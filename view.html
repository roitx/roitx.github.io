<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes Viewer - PM Roitx</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://roitx.qd.je/view.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
:root{ --border:rgba(255,255,255,0.12); --text:#eaf1ff; --muted:#8fa8cc; }
*{box-sizing:border-box; font-family:system-ui, Inter, Segoe UI}
body{margin:0; min-height:100vh; background:#060d1f; color:var(--text); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
.bg-svg{position:absolute; inset:0; width:100%; height:100%; z-index:-1;}
.viewer-box{width:92%; max-width:420px; background:linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.04)); border:1px solid var(--border); border-radius:28px; padding:28px; backdrop-filter:blur(22px) saturate(1.4); box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);}
.icon-wrap{width:64px; height:64px; margin:0 auto 14px; background:radial-gradient(circle at 30% 30%, #7aa5ff, #4a6bff); border-radius:18px; display:grid; place-items:center; box-shadow:0 8px 24px rgba(74,139,255,.6);}
h2{margin:0 0 6px; text-align:center; font-size:26px; font-weight:900;}
.sub{margin:0 0 24px; text-align:center; font-size:13.5px; color:var(--muted);}
.sel{position:relative;}
.sel svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:.7;}
select{width:100%; padding:15px 42px 15px 14px; border-radius:14px; background:rgba(11,22,51,.9); color:var(--text); border:1px solid var(--border); outline:none; font-size:15px; appearance:none;}
select:focus{border-color:#6b8cff; box-shadow:0 0 0 4px rgba(107,140,255,.15);}
.btn{width:100%; margin-top:22px; padding:15px; font-weight:800; border:none; border-radius:14px; background:linear-gradient(135deg,#4a8bff,#7b6bff,#a36bff); color:#fff; cursor:pointer; box-shadow:0 8px 28px rgba(123,107,255,.6); position:relative; overflow:hidden; transition:.25s;}
.btn::after{content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent); transform:translateX(-100%); transition:.6s;}
.btn:hover::after{transform:translateX(100%);} .btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<!-- ADVANCED SVG BACKGROUND -->
<svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="20%" cy="10%" r="80%"><stop offset="0%" stop-color="#1a2d66"/><stop offset="100%" stop-color="#060d1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="80%" r="70%"><stop offset="0%" stop-color="#4a2d8a"/><stop offset="100%" stop-color="#060d1f" stop-opacity="0"/></radialGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#060d1f"/>
  <circle cx="300" cy="120" r="380" fill="url(#g1)" filter="url(#blur40)"/>
  <circle cx="1150" cy="720" r="420" fill="url(#g2)" filter="url(#blur40)"/>
</svg>

<div class="viewer-box">
  <div class="icon-wrap">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M6.5 2H20V22H6.5C5.1 22 4 20.9 4 19.5V4.5C4 3.1 5.1 2 6.5 2Z" fill="white"/><path d="M8 7H16M8 11H13" stroke="#4a6bff" stroke-width="1.5" stroke-linecap="round"/></svg>
  </div>
  <h2>Notes Viewer</h2>
  <p class="sub">Select class, subject & chapter</p>

  <div style="display:flex; flex-direction:column; gap:14px;">
    <div class="sel"><select id="classSelect"><option>Select Class</option><option value="9">Class 9</option><option value="10">Class 10</option><option value="11">Class 11</option><option value="12">Class 12</option></select><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="#9fb4d6" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="sel"><select id="subjectSelect"><option>Select Subject</option><option value="physics">Physics</option><option value="chemistry">Chemistry</option><option value="maths">Maths</option><option value="biology">Biology</option></select><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="#9fb4d6" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <div class="sel"><select id="chapterSelect"><option>Select Chapter</option><option>Chapter 1</option><option>Chapter 2</option><option>Chapter 3</option><option>Chapter 4</option></select><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="#9fb4d6" stroke-width="1.6" stroke-linecap="round"/></svg></div>
  </div>

  <button class="btn" onclick="loadPdf()">📄 Open Notes</button>
</div>
<script src="view.js"></script>
</body>
</html>
