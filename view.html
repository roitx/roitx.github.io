<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Notes Viewer - PM Roitx</title>
<meta name="description" content="Access and preview high quality study notes, chapters, and educational materials seamlessly on PM Roitx.">
<meta name="keywords" content="PM Roitx, Notes Viewer, Study Material, Class 12 Notes, Physics, Chemistry, Maths, Biology">
<meta name="author" content="Rohit">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://roitx.qd.je/view.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root{ --border:rgba(255,255,255,0.12); --text:#eaf1ff; --muted:#8fa8cc; --accent1:#4a8bff; --accent2:#7b6bff; }
*{box-sizing:border-box; font-family:system-ui, Inter, Segoe UI, sans-serif;}
body{margin:0; min-height:100vh; background:#060d1f; color:var(--text); display:flex; align-items:center; justify-content:center; overflow-x:hidden; position:relative; padding:16px;}
.bg-svg{position:fixed; inset:0; width:100%; height:100%; z-index:-1;}
.viewer-box{width:100%; max-width:440px; background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03)); border:1px solid var(--border); border-radius:28px; padding:24px 20px; backdrop-filter:blur(24px) saturate(1.4); box-shadow:0 20px 50px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.15);}
.icon-wrap{width:56px; height:56px; margin:0 auto 12px; background:radial-gradient(circle at 30% 30%, #7aa5ff, #4a6bff); border-radius:16px; display:grid; place-items:center; box-shadow:0 8px 24px rgba(74,139,255,.5);}
h2{margin:0 0 4px; text-align:center; font-size:24px; font-weight:900;}
.sub{margin:0 0 20px; text-align:center; font-size:13px; color:var(--muted);}

.sel-group{display:flex; flex-direction:column; gap:12px;}
.sel{position:relative;}
.sel .field-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:.8; display:flex; align-items:center;}
.sel svg.dropdown-arrow{position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; opacity:.7;}
select{width:100%; padding:14px 42px 14px 44px; border-radius:14px; background:rgba(11,22,51,0.95); color:var(--text); border:1px solid var(--border); outline:none; font-size:14.5px; appearance:none; transition:0.2s;}
select option{background:#0b1633; color:#eaf1ff; padding:12px;}
select:focus{border-color:#6b8cff; box-shadow:0 0 0 4px rgba(107,140,255,.15);}
select:disabled{opacity:0.6; cursor:not-allowed;}
.msg-box{margin-top:6px; margin-bottom:10px; text-align:center; font-size:12.5px; color:#ffb4ab; min-height:16px;}

.btn-group{display:flex; gap:10px; margin-top:16px;}
.btn{flex:1; padding:14px; font-weight:750; border:none; border-radius:14px; cursor:pointer; font-size:14px; transition:.25s; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; gap:8px;}
.btn:disabled{opacity:0.4; cursor:not-allowed; transform:none !important; box-shadow:none !important;}
.btn-preview{background:rgba(255,255,255,0.08); border:1px solid var(--border); color:var(--text);}
.btn-preview:not(:disabled):hover{background:rgba(255,255,255,0.15);}
.btn-primary{background:linear-gradient(135deg,var(--accent1),var(--accent2),#a36bff); color:#fff; box-shadow:0 6px 20px rgba(123,107,255,.4);}
.btn-primary:not(:disabled):hover{transform:translateY(-1px); box-shadow:0 8px 24px rgba(123,107,255,.6);}

/* MODAL STYLES */
.modal-overlay{position:fixed; inset:0; background:rgba(3,7,18,0.85); backdrop-filter:blur(10px); z-index:999; display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:all 0.3s ease;}
.modal-overlay.active{opacity:1; pointer-events:auto;}
.modal-content{width:100%; max-width:650px; background:#0b1329; border:1px solid var(--border); border-radius:24px; display:flex; flex-direction:column; max-height:90vh; box-shadow:0 25px 60px rgba(0,0,0,0.8); transform:scale(0.95); transition:all 0.3s ease;}
.modal-overlay.active .modal-content{transform:scale(1);}
.modal-header{padding:16px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border);}
.modal-title-wrap{display:flex; align-items:center; gap:10px; max-width:80%;}
.modal-header h3{margin:0; font-size:16px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.close-btn{background:rgba(255,255,255,0.06); border:1px solid var(--border); color:var(--muted); width:32px; height:32px; border-radius:10px; display:grid; place-items:center; cursor:pointer; transition:0.2s;}
.close-btn:hover{background:rgba(255,255,255,0.15); color:#fff;}
.modal-body{flex:1; padding:12px; overflow:hidden; display:flex; flex-direction:column; min-height:400px;}
.modal-body iframe{width:100%; height:100%; min-height:400px; border:none; border-radius:12px; background:#000;}
.modal-footer{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}
</style>
</head>
<body>
<!-- ADVANCED SVG BACKGROUND -->
<svg class="bg-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="20%" cy="10%" r="80%"><stop offset="0%" stop-color="#1a2d66"/><stop offset="100%" stop-color="#060d1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="80%" r="70%"><stop offset="0%" stop-color="#4a2d8a"/><stop offset="100%" stop-color="#060d1f" stop-opacity="0"/></radialGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#060d1f"/>
  <circle cx="300" cy="120" r="380" fill="url(#g1)" filter="url(#blur40)"/>
  <circle cx="1150" cy="720" r="420" fill="url(#g2)" filter="url(#blur40)"/>
</svg>

<div class="viewer-box">
  <div class="icon-wrap">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M6.5 2H20V22H6.5C5.1 22 4 20.9 4 19.5V4.5C4 3.1 5.1 2 6.5 2Z" fill="white"/><path d="M8 7H16M8 11H13" stroke="#4a6bff" stroke-width="1.5" stroke-linecap="round"/></svg>
  </div>
  <h2>Notes Viewer</h2>
  <p class="sub">Select class, subject & chapter to explore</p>

  <div class="sel-group">
    <!-- Class Select -->
    <div class="sel">
      <span class="field-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fa8cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
      </span>
      <select id="classSelect">
        <option value="">Select Class</option>
        <option value="9">Class 9</option>
        <option value="10">Class 10</option>
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
      </select>
      <svg class="dropdown-arrow" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="#9fb4d6" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    
    <!-- Subject Select -->
    <div class="sel">
      <span class="field-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fa8cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <select id="subjectSelect" disabled>
        <option value="">Select Class First</option>
      </select>
      <svg class="dropdown-arrow" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="#9fb4d6" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>

    <!-- Chapter Select -->
    <div class="sel">
      <span class="field-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fa8cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </span>
      <select id="chapterSelect" disabled>
        <option value="">Select Subject First</option>
      </select>
      <svg class="dropdown-arrow" width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M5 7.5L10 12.5L15 7.5" stroke="#9fb4d6" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div id="msgBox" class="msg-box"></div>

  <div class="btn-group">
    <button id="previewBtn" class="btn btn-preview" onclick="openPreviewModal()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      Preview
    </button>
    <button id="viewFullBtn" class="btn btn-primary" onclick="loadPdf()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      View Full
    </button>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div id="previewModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a8bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <h3 id="modalTitle">Notes Preview</h3>
      </div>
      <button class="close-btn" onclick="closePreviewModal()">&times;</button>
    </div>
    <div class="modal-body">
      <iframe id="previewFrame" src=""></iframe>
    </div>
    <div class="modal-footer">
      <button class="btn btn-preview" style="flex:0.5; padding:10px;" onclick="closePreviewModal()">Close</button>
      <button class="btn btn-primary" style="flex:1; padding:10px;" onclick="loadPdf()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Open Full Screen
      </button>
    </div>
  </div>
</div>

<script src="view.js"></script>
</body>
</html>
