<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Advanced Notes Viewer - PM Roitx</title>
<meta name="description" content="Access and preview high quality study notes, chapters, and educational materials seamlessly on PM Roitx.">
<meta name="keywords" content="PM Roitx, Notes Viewer, Study Material, Class 12 Notes, Physics, Chemistry, Maths, Biology">
<meta name="author" content="Rohit">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://roitx.dpdns.org/view.html">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root{ 
  --bg-dark: #040916;
  --card-bg: rgba(13, 22, 48, 0.75);
  --border: rgba(255, 255, 255, 0.12); 
  --border-glow: rgba(59, 130, 246, 0.45);
  --text: #eef4ff; 
  --muted: #8ea5c9; 
  --accent1: #3b82f6; 
  --accent2: #8b5cf6; 
  --accent3: #06b6d4;
  --success: #10b981;
}

*{box-sizing:border-box; font-family:'Inter', system-ui, -apple-system, sans-serif;}

body {
  margin: 0; 
  min-height: 100vh; 
  background: var(--bg-dark); 
  color: var(--text); 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  overflow-x: hidden; 
  position: relative; 
  padding: 20px 16px;
}

/* CYBER AMBIENT BACKGROUND */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background: radial-gradient(circle at 50% 0%, #0d1d42 0%, #040916 70%);
}

.cyber-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
  background-size: 36px 36px;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(75px);
  opacity: 0.5;
  animation: floatOrb 12s infinite alternate ease-in-out;
}
.orb-1 { width: 320px; height: 320px; background: #2563eb; top: -60px; left: -50px; }
.orb-2 { width: 360px; height: 360px; background: #7c3aed; bottom: -80px; right: -60px; animation-delay: -4s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(20px, 18px) scale(1.06); }
}

/* TOP FLOATING NAV */
.top-nav {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 470px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 20;
}

.nav-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 99px;
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid var(--border);
  backdrop-filter: blur(16px);
  color: var(--text);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  transition: 0.25s ease;
}
.nav-pill:hover { border-color: var(--border-glow); background: rgba(30, 41, 59, 0.9); }

.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success); box-shadow: 0 0 8px var(--success);
}

/* GLASS CONTAINER */
.viewer-box {
  width: 100%; 
  max-width: 470px; 
  margin-top: 36px;
  background: var(--card-bg); 
  border: 1px solid var(--border); 
  border-radius: 28px; 
  padding: 26px 22px; 
  backdrop-filter: blur(28px) saturate(1.5); 
  box-shadow: 0 25px 60px rgba(0,0,0,0.75), inset 0 1px 0 rgba(255,255,255,0.18);
  position: relative;
  overflow: hidden;
}
.viewer-box::before {
  content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent3), var(--accent2), transparent);
}

.header-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.icon-wrap {
  width: 52px; height: 52px; flex-shrink: 0;
  background: linear-gradient(135deg, #3b82f6, #7c3aed); 
  border-radius: 16px; display: grid; place-items: center; 
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
}
.header-text h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }
.sub { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }

/* STEPPER */
.stepper {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px;
  background: rgba(6, 13, 31, 0.6); padding: 6px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06);
}
.step-item {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 6px; border-radius: 10px; font-size: 11.5px; font-weight: 600; color: var(--muted);
  transition: all 0.3s ease;
}
.step-item .step-num {
  width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,0.08);
  display: grid; place-items: center; font-size: 10px; font-weight: 700;
}
.step-item.active { background: rgba(59,130,246,0.18); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
.step-item.active .step-num { background: var(--accent1); color: #fff; }
.step-item.done { background: rgba(16,185,129,0.14); color: #6ee7b7; }
.step-item.done .step-num { background: var(--success); color: #fff; }

/* INPUTS & SELECTS */
.sel-group { display: flex; flex-direction: column; gap: 12px; }
.field-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--muted); margin-bottom: 5px; padding-left: 2px;
}
.sel { position: relative; }
.sel .field-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  pointer-events: none; color: #60a5fa; display: flex; align-items: center; justify-content: center; width: 22px;
}
.sel svg.dropdown-arrow {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0.7;
}
select {
  width: 100%; padding: 13px 40px 13px 44px; border-radius: 14px;
  background: rgba(8, 16, 38, 0.9); color: var(--text); border: 1px solid var(--border);
  outline: none; font-size: 14px; font-weight: 500; appearance: none; transition: 0.25s ease;
}
select option { background: #09122b; color: #eef4ff; padding: 12px; }
select:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
select:disabled { opacity: 0.45; cursor: not-allowed; }

.msg-box { margin-top: 8px; text-align: center; font-size: 12.5px; color: #fca5a5; min-height: 16px; }

/* BUTTONS */
.btn-group { display: flex; gap: 10px; margin-top: 14px; }
.btn {
  flex: 1; padding: 14px; font-weight: 700; border: none; border-radius: 14px;
  cursor: pointer; font-size: 14px; transition: all 0.25s ease;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.btn-preview { background: rgba(255,255,255,0.07); border: 1px solid var(--border); color: var(--text); }
.btn-preview:not(:disabled):hover { background: rgba(255,255,255,0.14); transform: translateY(-2px); }
.btn-primary { background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: #fff; box-shadow: 0 8px 22px rgba(99,102,241,0.4); }
.btn-primary:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99,102,241,0.6); }

/* MODAL STYLES */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(2, 6, 18, 0.88); backdrop-filter: blur(12px);
  z-index: 999; display: flex; align-items: center; justify-content: center; padding: 14px;
  opacity: 0; pointer-events: none; transition: all 0.3s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-content {
  width: 100%; max-width: 780px; background: #091126; border: 1px solid var(--border);
  border-radius: 24px; display: flex; flex-direction: column; max-height: 92vh;
  box-shadow: 0 25px 70px rgba(0,0,0,0.85); transform: scale(0.95); transition: all 0.3s ease;
}
.modal-content.expanded { max-width: 98vw; height: 95vh; max-height: 95vh; }
.modal-overlay.active .modal-content { transform: scale(1); }
.modal-header { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); gap: 10px; }
.modal-title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
.modal-header h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.tool-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted);
  height: 34px; padding: 0 10px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
  gap: 5px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
}
.tool-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
.modal-body { flex: 1; padding: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 440px; }
.modal-body iframe { width: 100%; height: 100%; min-height: 440px; border: none; border-radius: 14px; background: #020617; }
.modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }

@media(max-width:480px){
  body{padding:14px 12px;}
  .viewer-box{padding:20px 16px; border-radius:24px; margin-top:44px;}
  .header-text h2{font-size:19px;}
  select{font-size:13.5px; padding:12px 36px 12px 40px;}
  .btn{padding:12px; font-size:13.5px;}
}
</style>
</head>
<body>

<div class="bg-canvas">
  <div class="cyber-grid"></div>

</div>

<nav class="top-nav">
  <a href="classes.html" class="nav-pill">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

<div class="viewer-box">

      </div>

        Open Full Screen
      </button>
    </div>
  </div>
</div>

<!-- CONNECT EXISTING view.js -->

<script src="view.js"></script>
<script>
  // Stepper UI synchronization helper for view.js elements
  const cls = document.getElementById("classSelect");
  const sub = document.getElementById("subjectSelect");
  const chp = document.getElementById("chapterSelect");

  function refreshStepper() {
    document.getElementById("step1").className = "step-item " + (cls.value ? "done" : "active");
    document.getElementById("step2").className = "step-item " + (sub.value ? "done" : (cls.value ? "active" : ""));
    document.getElementById("step3").className = "step-item " + (chp.value ? "done" : (sub.value ? "active" : ""));
  }

  cls.addEventListener("change", refreshStepper);
  sub.addEventListener("change", refreshStepper);
  chp.addEventListener("change", refreshStepper);

  function toggleModalExpand() {
    document.getElementById("modalContentBox").classList.toggle("expanded");
  }
</script>
