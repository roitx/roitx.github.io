<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Tests - Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FontAwesome & Base CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="admin-manage-tests.css">

  <!-- Supabase CDN + Central Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body oncontextmenu="return false;">

  <div class="bg-glow top-left"></div>
  <div class="bg-glow bottom-right"></div>

  <div class="admin-card">
    <div class="header-nav">
      <button class="back-btn" onclick="window.location.href='admin-ai-test.html'">
        <i class="fa-solid fa-plus"></i> Create New Test
      </button>
      <button class="back-btn" onclick="window.location.href='profile.html'">
        <i class="fa-solid fa-arrow-left"></i> Profile
      </button>
    </div>

    <h1><i class="fa-solid fa-list-check"></i> Test Management</h1>
    <p class="subtitle">Aapke sabhi live aur published tests ki list. Yahan se edit ya delete kar sakte hain.</p>

    <!-- Search & Filter Controls -->
    <div class="grid-3" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px;">
      <div class="form-group">
        <input type="text" id="searchInput" class="input-box" placeholder="Search by topic or title..." oninput="filterTests()">
      </div>
      <div class="form-group">
        <select id="filterClass" class="input-box" onchange="filterTests()">
          <option value="ALL">All Classes</option>
        </select>
      </div>
      <div class="form-group">
        <select id="filterSubject" class="input-box" onchange="filterTests()">
          <option value="ALL">All Subjects</option>
        </select>
      </div>
    </div>

    <!-- Status Messages -->
    <div id="loaderBox" class="loader-box">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <p>Loading published tests from database...</p>
    </div>

    <p id="statusMsg" class="status-msg"></p>

    <!-- Tests List Container -->
    <div id="testsContainer" class="tests-list"></div>

  </div>

  <!-- Advanced Edit Test Modal -->
  <div id="editModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 700px; width: 95%; max-height: 90vh; overflow-y: auto;">
      <h2><i class="fa-solid fa-pen-to-square"></i> Full Test Editor</h2>
      <input type="hidden" id="editTestId">

      <!-- Test Title -->
      <div class="form-group">
        <label><i class="fa-solid fa-heading"></i> Test Title</label>
        <input type="text" id="editTitle" class="input-box">
      </div>

      <!-- Category & Class -->
      <div class="grid-2">
        <div class="form-group">
          <label><i class="fa-solid fa-graduation-cap"></i> Exam Category</label>
          <select id="editCategory" class="input-box" onchange="updateEditSubCategories()">
            <option value="board">School & Board Exams (Class 9 - 12)</option>
            <option value="competitive">Competitive Exams (JEE / NEET)</option>
          </select>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-book-open"></i> Target Class / Exam</label>
          <select id="editClass" class="input-box" onchange="updateEditSubjectOptions()">
          </select>
        </div>
      </div>

      <!-- Stream & Subject Dropdown -->
      <div class="grid-2">
        <div class="form-group" id="editStreamGroup" style="display: none;">
          <label><i class="fa-solid fa-microscope"></i> Stream</label>
          <select id="editStream" class="input-box" onchange="updateEditSubjectOptions()">
            <option value="science_math">Science (Mathematics)</option>
            <option value="science_bio">Science (Biology)</option>
            <option value="arts">Arts / Humanities</option>
            <option value="commerce">Commerce</option>
          </select>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-flask"></i> Subject</label>
          <select id="editSubject" class="input-box">
          </select>
        </div>
      </div>

      <!-- Language & Time Limit Dropdowns -->
      <div class="grid-2">
        <div class="form-group">
          <label><i class="fa-solid fa-language"></i> Language</label>
          <select id="editLanguage" class="input-box">
            <option value="English">English</option>
            <option value="Hindi">Hindi</option>
            <option value="Bilingual (Hindi + English)">Bilingual (Hinglish)</option>
          </select>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-clock"></i> Time Limit (Mins)</label>
          <input type="number" id="editTimeLimit" class="input-box">
        </div>
      </div>

      <!-- Marks & Negative Marks -->
      <div class="grid-2">
        <div class="form-group">
          <label><i class="fa-solid fa-circle-plus"></i> Marks Per Que (+)</label>
          <input type="number" id="editMarks" class="input-box" step="0.5">
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-circle-minus"></i> Negative Mark (-)</label>
          <input type="number" id="editNegativeMark" class="input-box" step="0.25">
        </div>
      </div>

      <!-- Questions Payload JSON Editor Area -->
      <div class="form-group">
        <label><i class="fa-solid fa-code"></i> Questions Payload (JSON Format)</label>
        <textarea id="editQuestionsJson" class="input-box" rows="8" style="font-family: monospace; font-size: 12px;"></textarea>
      </div>

      <div class="modal-actions">
        <button class="back-btn" onclick="closeEditModal()">Cancel</button>
        <button class="back-btn save-modal-btn" onclick="saveTestChanges()">
          <i class="fa-solid fa-floppy-disk"></i> Update Full Test
        </button>
      </div>
    </div>
  </div>

  <!-- Read-Only Preview Modal -->
  <div id="previewModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 650px; width: 90%; max-height: 85vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px;">
        <h3 id="previewTitle" style="margin: 0; color: #2d3748;">Test Preview</h3>
        <button onclick="closePreviewModal()" style="background: none; border: none; font-size: 18px; cursor: pointer;">✕</button>
      </div>
      
      <div id="previewMeta" style="font-size: 12px; color: #718096; margin-bottom: 15px;"></div>
      
      <div id="previewQuestionsContainer"></div>

      <div style="margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px; display: flex; justify-content: space-between; align-items: center;">
        <button onclick="submitTestPreview()" style="background: #4A00E0; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Submit Test (Check Score)</button>
        <button onclick="closePreviewModal()" style="background: #e2e8f0; color: #4a5568; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Close</button>
      </div>
    </div>
  </div>

  <!-- FLOATING BUG REPORT BUTTON WITH SVG ICON -->
  <button id="bugReportFab" onclick="openBugReportsModal()" class="fab-bug-btn" title="View Reported Bugs">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="8" height="14" x="8" y="6" rx="4"/>
      <path d="m19 7-3 2"/>
      <path d="m5 7 3 2"/>
      <path d="m19 19-3-2"/>
      <path d="m5 19 3-2"/>
      <path d="M20 13h-4"/>
      <path d="M4 13h4"/>
      <path d="m10 4 1-2"/>
      <path d="m14 4-1-2"/>
    </svg>
    <span id="bugBadge" class="fab-badge" style="display: none;">0</span>
  </button>

  <!-- BUG REPORTS ADMIN MODAL -->
  <div id="bugReportsModal" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 750px; width: 95%; max-height: 85vh; overflow-y: auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 10px; margin-bottom: 15px;">
        <h2 style="margin:0; font-size:18px;"><i class="fa-solid fa-bug" style="color: #f43f5e;"></i> Student Bug Reports</h2>
        <button onclick="closeBugReportsModal()" style="background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
      </div>

      <div id="bugReportsContainer" style="display: flex; flex-direction: column; gap: 12px;">
        <p style="text-align: center; color: #64748b; font-size: 13px;">Loading reports...</p>
      </div>

      <div class="modal-actions" style="margin-top: 15px;">
        <button class="back-btn" onclick="closeBugReportsModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="admin-manage-tests.js"></script>
</body>
</html>
