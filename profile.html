<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - Roitx Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- Custom External CSS -->
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <div class="bg-glow top-left"></div>
  <div class="bg-glow bottom-right"></div>

  <!-- Profile Main Card -->
  <div class="profile-card">
    <a href="about.html" class="info-btn" title="About & Feedback">
      <i class="fa-solid fa-circle-info"></i>
    </a>

    <div class="avatar-section">
      <div class="avatar-wrapper" onclick="triggerPhotoSelect()" title="Click to Change Photo">
        <div class="avatar" id="avatarContainer">U</div>
        <div class="avatar-edit-badge"><i class="fa-solid fa-camera"></i></div>
      </div>
      <button type="button" id="deletePhotoBtn" class="delete-photo-btn" style="display: none;" onclick="deleteAvatarPhoto()">
        <i class="fa-solid fa-trash-can"></i> Delete Photo
      </button>
    </div>

    <input type="file" id="avatarFileInput" accept="image/*" onchange="handleFileSelected(event)">

    <h1 id="userDisplayName">Loading...</h1>
    <p class="role-badge" id="userRoleBadge"><i class="fa-solid fa-spinner fa-spin"></i> Fetching Role...</p>

    <!-- Section 1: Basic Account Info -->
    <div class="section-title"><i class="fa-solid fa-user-gear"></i> Personal Account Info</div>

    <div class="form-group">
      <label><i class="fa-solid fa-signature"></i> Full Name</label>
      <input type="text" id="fullNameInput" class="input-box" placeholder="Enter your full name" oninput="updateInitialAvatar()">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-envelope"></i> Email Address</label>
      <input type="text" id="emailInput" class="input-box" readonly style="opacity: 0.7; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-phone"></i> Phone Number</label>
      <div class="phone-wrapper">
        <select id="countryCodeSelect" class="input-box">
          <option value="+91">+91 (IN)</option>
          <option value="+1">+1 (US)</option>
          <option value="+971">+971 (UAE)</option>
          <option value="+977">+977 (NP)</option>
          <option value="+880">+880 (BD)</option>
          <option value="+92">+92 (PK)</option>
          <option value="+44">+44 (UK)</option>
        </select>
        <input type="tel" id="phoneInput" class="input-box" placeholder="10-digit Mobile No">
      </div>
    </div>

    <!-- Section 2: Academic Info -->
    <div class="section-title"><i class="fa-solid fa-graduation-cap"></i> Academic Details</div>

    <div class="form-group">
      <label><i class="fa-solid fa-book-open"></i> Target Exam / Class</label>
      <select id="classSelect" class="input-box">
        <option value="">Select Class / Target Exam</option>
        <option value="Class 9th">Class 9th</option>
        <option value="Class 10th">Class 10th</option>
        <option value="Class 11th">Class 11th</option>
        <option value="Class 12th">Class 12th</option>
        <option value="JEE Main & Advanced">JEE Main & Advanced</option>
        <option value="NEET UG">NEET UG</option>
        <option value="Other Competitive Exam">Other Competitive Exam</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-microscope"></i> Stream / Subject Branch</label>
      <select id="streamSelect" class="input-box">
        <option value="">Select Stream</option>
        <option value="PCM (Physics, Chem, Math)">PCM (Maths)</option>
        <option value="PCB (Physics, Chem, Bio)">PCB (Biology)</option>
        <option value="PCMB (Maths & Bio)">PCMB (Both)</option>
        <option value="Commerce">Commerce</option>
        <option value="Arts / Humanities">Arts / Humanities</option>
        <option value="General Science">General Science</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-building-columns"></i> School / Coaching Name</label>
      <input type="text" id="institutionInput" class="input-box" placeholder="e.g. KV School / Allen / Physics Wallah">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label><i class="fa-solid fa-city"></i> City</label>
        <input type="text" id="cityInput" class="input-box" placeholder="Your City">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-map-location-dot"></i> State</label>
        <input type="text" id="stateInput" class="input-box" placeholder="Your State">
      </div>
    </div>

    <p id="statusMsg" class="status-msg"></p>

    <!-- Password Section -->
    <div id="passwordSection" style="margin: 10px 0; text-align: left; background: #e0e5ec; padding: 15px; border-radius: 14px; box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;">
      <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a5568; font-weight: 600; margin-bottom: 6px;">
        <i class="fa-solid fa-key"></i> Set / Change Password
      </label>
      <input type="password" id="newPasswordInput" class="input-box" placeholder="Enter new password (min 6 chars)" style="margin-bottom: 10px;">
      <button class="btn" onclick="setGoogleUserPassword()" style="background: #e0e5ec; color: #5a2eff; font-size: 13px; padding: 10px;">
        <i class="fa-solid fa-lock"></i> Save New Password
      </button>
    </div>

    <!-- Admin Buttons -->
    <button class="btn btn-admin" id="adminBtn" style="display: none;" onclick="goToAdminPanel()">
      <i class="fa-solid fa-shield-halved"></i> Open Admin Panel
    </button>
    <!-- REPLACED BUTTON: Send Broadcast Notification -->
    <button class="btn btn-admin" id="sendNotifBtn" style="display: none; margin-top: 8px; background: linear-gradient(135deg, #00d2ff, #0072ff); color: #fff;" onclick="window.location.href='admin-notifications.html'">
      <i class="fa-solid fa-paper-plane"></i> Send Notification
    </button>

    <!-- General Action Buttons -->
    <div class="btn-group">
      <button class="btn btn-save" onclick="saveProfileDetails()">
        <i class="fa-solid fa-floppy-disk"></i> Save Profile Info
      </button>
      <button class="btn btn-explore" onclick="goToHome()">
        <i class="fa-solid fa-compass"></i> Explore Notes & Formulas
      </button>
      <button class="btn btn-danger" onclick="logoutUser()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout Account
      </button>
    </div>
  </div>

  <!-- Cropper Modal -->
  <div class="crop-modal-overlay" id="cropModal">
    <div class="crop-modal-card">
      <h3 style="color: #2d3748; font-size: 16px;"><i class="fa-solid fa-crop-simple"></i> Crop Your Profile Photo</h3>
      <div class="cropper-img-container">
        <img id="cropTargetImage" src="" alt="Crop Target">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn btn-danger" onclick="closeCropModal()" style="padding: 10px;">Cancel</button>
        <button class="btn btn-save" onclick="cropAndUpload()" style="padding: 10px;">
          <i class="fa-solid fa-check"></i> Crop & Upload
        </button>
      </div>
    </div>
  </div>

  <!-- Custom External JS -->
  <script src="profile.js"></script>
</body>
</html>
