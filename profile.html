<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - Roitx Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Custom External CSS -->
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <div class="bg-glow top-left"></div>
  <div class="bg-glow bottom-right"></div>

  <!-- Profile Main Card -->
  <div class="profile-card">
    <a href="about.html" class="info-btn" title="About & Feedback">
      <i class="fa-solid fa-circle-info"></i>
    </a>

    <!-- Avatar Section -->
    <div class="avatar-section">
      <div class="avatar-wrapper" onclick="openPhotoOptions()" title="Click to Change Photo">
        <div class="avatar" id="avatarContainer">U</div>
        <div class="avatar-edit-badge"><i class="fa-solid fa-camera"></i></div>
        
        <!-- Profile Progress Badge Under Photo -->
        <div class="profile-progress-badge" id="profileProgressBadge">0%</div>
      </div>
    </div>

    <!-- Hidden file inputs for Camera & Gallery -->
    <input type="file" id="avatarFileInputGallery" accept="image/*" onchange="handleFileSelected(event)">
    <input type="file" id="avatarFileInputCamera" accept="image/*" capture="environment" onchange="handleFileSelected(event)">

    <h1 id="userDisplayName">Loading...</h1>
    <p class="role-badge" id="userRoleBadge"><i class="fa-solid fa-spinner fa-spin"></i> Fetching Role...</p>

    <!-- Section 1: Basic Account Info -->
    <div class="section-title"><i class="fa-solid fa-user-gear"></i> Personal Account Info</div>

    <div class="form-group">
      <label><i class="fa-solid fa-signature"></i> Full Name</label>
      <input type="text" id="fullNameInput" class="input-box" placeholder="Enter your full name" oninput="updateProfileProgress()">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-envelope"></i> Email Address</label>
      <input type="text" id="emailInput" class="input-box" readonly style="opacity: 0.7; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-phone"></i> Phone Number</label>
      <div class="phone-wrapper">
        <select id="countryCodeSelect" class="input-box">
          <option value="+91">+91 (IN)</option>
          <option value="+1">+1 (US)</option>
          <option value="+971">+971 (UAE)</option>
          <option value="+977">+977 (NP)</option>
          <option value="+880">+880 (BD)</option>
          <option value="+92">+92 (PK)</option>
          <option value="+44">+44 (UK)</option>
        </select>
        <input 
          type="tel" 
          id="phoneInput" 
          class="input-box" 
          placeholder="10-digit Mobile No" 
          maxlength="10" 
          oninput="this.value = this.value.replace(/[^0-9]/g, ''); updateProfileProgress();"
        >
      </div>
    </div>

    <!-- Section 2: Academic Info -->
    <div class="section-title"><i class="fa-solid fa-graduation-cap"></i> Academic Details</div>

    <div class="form-group">
      <label><i class="fa-solid fa-book-open"></i> Target Exam / Class</label>
      <select id="classSelect" class="input-box" onchange="updateProfileProgress()">
        <option value="">Select Class / Target Exam</option>
        <option value="Class 9th">Class 9th</option>
        <option value="Class 10th">Class 10th</option>
        <option value="Class 11th">Class 11th</option>
        <option value="Class 12th">Class 12th</option>
        <option value="JEE Main & Advanced">JEE Main & Advanced</option>
        <option value="NEET UG">NEET UG</option>
        <option value="Other Competitive Exam">Other Competitive Exam</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-microscope"></i> Stream / Subject Branch</label>
      <select id="streamSelect" class="input-box" onchange="updateProfileProgress()">
        <option value="">Select Stream</option>
        <option value="PCM (Physics, Chem, Math)">PCM (Maths)</option>
        <option value="PCB (Physics, Chem, Bio)">PCB (Biology)</option>
        <option value="PCMB (Maths & Bio)">PCMB (Both)</option>
        <option value="Commerce">Commerce</option>
        <option value="Arts / Humanities">Arts / Humanities</option>
        <option value="General Science">General Science</option>
      </select>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-building-columns"></i> School / Coaching Name</label>
      <input type="text" id="institutionInput" class="input-box" placeholder="e.g. KV School / Allen / Physics Wallah" oninput="updateProfileProgress()">
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label><i class="fa-solid fa-city"></i> City</label>
        <input type="text" id="cityInput" class="input-box" placeholder="Your City" oninput="updateProfileProgress()">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-map-location-dot"></i> State</label>
        <input type="text" id="stateInput" class="input-box" placeholder="Your State" oninput="updateProfileProgress()">
      </div>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-location-pin"></i> Area Pincode <span style="color:#5a2eff; font-size:10px;">(Required for Leaderboard)</span></label>
      <input type="text" id="pincodeInput" class="input-box" placeholder="e.g. 800001" maxlength="6" oninput="updateProfileProgress()">
    </div>

    <p id="statusMsg" class="status-msg"></p>

    <!-- Password Section -->
    <div id="passwordSection" style="margin: 10px 0; text-align: left; background: #e0e5ec; padding: 15px; border-radius: 14px; box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;">
      <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a5568; font-weight: 600; margin-bottom: 6px;">
        <i class="fa-solid fa-key"></i> Set / Change Password
      </label>
      <input type="password" id="newPasswordInput" class="input-box" placeholder="Enter new password (min 6 chars)" style="margin-bottom: 10px;">
      <button class="btn" onclick="setGoogleUserPassword()" style="background: #e0e5ec; color: #5a2eff; font-size: 13px; padding: 10px;">
        <i class="fa-solid fa-lock"></i> Save New Password
      </button>
    </div>

    <!-- Admin & Teammate Dynamic Action Buttons -->
    <button class="btn btn-admin" id="adminBtn" style="display: none;" onclick="goToAdminPanel()">
      <i class="fa-solid fa-shield-halved"></i> Open Admin Panel
    </button>
    
    <button class="btn btn-admin" id="manageTeamBtn" style="display: none; margin-top: 8px; background: linear-gradient(135deg, #6366f1, #4f46e5); color: #fff;" onclick="goToManageTeam()">
      <i class="fa-solid fa-users-gear"></i> Manage Teammates
    </button>

    <button class="btn btn-admin" id="sendNotifBtn" style="display: none; margin-top: 8px; background: linear-gradient(135deg, #00d2ff, #0072ff); color: #fff;" onclick="goToSendNotification()">
      <i class="fa-solid fa-paper-plane"></i> Send Notification
    </button>

    <button class="btn btn-admin" id="uploadTestBtn" style="display: none; margin-top: 8px; background: linear-gradient(135deg, #11998e, #38ef7d); color: #fff;" onclick="goToUploadTest()">
      <i class="fa-solid fa-file-arrow-up"></i> Upload / Manage Test
    </button>

    <button class="btn btn-admin" id="aiTestBtn" style="display: none; margin-top: 8px; background: linear-gradient(135deg, #8E2DE2, #4A00E0); color: #fff;" onclick="goToAiTestCreator()">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Create AI Test
    </button>

    <!-- General Action Buttons -->
    <div class="btn-group">
      <button class="btn btn-save" onclick="saveProfileDetails()">
        <i class="fa-solid fa-floppy-disk"></i> Save Profile Info
      </button>
      <button class="btn btn-explore" onclick="goToHome()">
        <i class="fa-solid fa-compass"></i> Explore Notes & Formulas
      </button>
      <button class="btn btn-logout" onclick="logoutUser()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout Account
      </button>
    </div>

    <!-- Section 3: Danger Zone -->
    <div 
      class="section-title danger-title" 
      onclick="toggleDangerDeleteBtn()" 
      style="cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center;"
      title="Tap to reveal account deletion option"
    >
      <span><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</span>
      <span id="dangerZoneTimerNotice" style="font-size: 10px; color: #e53e3e; font-weight: bold; opacity: 0.8;">(Tap to unlock)</span>
    </div>

    <!-- Hidden Account Delete Wrapper -->
    <div id="dangerDeleteWrapper" style="display: none; margin-top: 10px; transition: all 0.3s ease;">
      <button class="btn btn-danger" onclick="openDeleteConfirmModal()">
        <i class="fa-solid fa-user-xmark"></i> Delete My Account Permanently
      </button>
    </div>
  </div>

  <!-- Bottom Sheet / Photo Actions Modal -->
  <div class="sheet-overlay" id="photoOptionsSheet" onclick="closePhotoOptions(event)">
    <div class="sheet-card" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">Add photo</h3>
      
      <div class="sheet-options">
        <button class="sheet-btn" onclick="triggerCamera()">
          <i class="fa-solid fa-camera"></i> Take a photo
        </button>
        <button class="sheet-btn" onclick="triggerGallery()">
          <i class="fa-solid fa-image"></i> Select from Gallery
        </button>
        <button class="sheet-btn" onclick="openAvatarSelector()">
          <i class="fa-solid fa-user-ninja"></i> Choose Avatar
        </button>
        <button class="sheet-btn text-danger" id="sheetRemoveBtn" onclick="deleteAvatarPhoto()">
          <i class="fa-solid fa-minus-circle"></i> Remove current photo
        </button>
      </div>
    </div>
  </div>

  <!-- Choose Avatar Picker Modal -->
  <div class="sheet-overlay" id="avatarPickerSheet" onclick="closeAvatarSelector(event)">
    <div class="sheet-card" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title">Choose Your Avatar</h3>
      <div class="avatar-grid" id="avatarGrid">
        <!-- Built-in SVGs generated via JS -->
      </div>
    </div>
  </div>

  <!-- Cropper Modal -->
  <div class="crop-modal-overlay" id="cropModal">
    <div class="crop-modal-card">
      <h3 style="color: #2d3748; font-size: 16px;"><i class="fa-solid fa-crop-simple"></i> Crop Your Profile Photo</h3>
      <div class="cropper-img-container">
        <img id="cropTargetImage" src="" alt="Crop Target">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn btn-logout" onclick="closeCropModal()" style="padding: 10px;">Cancel</button>
        <button class="btn btn-save" onclick="cropAndUpload()" style="padding: 10px;">
          <i class="fa-solid fa-check"></i> Crop & Upload
        </button>
      </div>
    </div>
  </div>

  <!-- Account Delete Confirmation Modal -->
  <div class="crop-modal-overlay" id="deleteConfirmModal">
    <div class="crop-modal-card">
      <div style="font-size: 38px; color: #e53e3e; margin-bottom: 8px;">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h3 style="color: #2d3748; font-size: 18px; margin-bottom: 8px;">Delete Account Permanently?</h3>
      <p style="font-size: 13px; color: #718096; margin-bottom: 12px; line-height: 1.5;">
        Aapka data completely erase kar diya jayega. Confirm karne ke liye niche apna **Exact Email** type karein:
      </p>

      <div style="margin-bottom: 15px; text-align: left;">
        <label id="confirmEmailLabel" style="font-size: 11px; font-weight: 700; color: #e53e3e; display: block; margin-bottom: 4px;"></label>
        <input 
          type="text" 
          id="deleteConfirmEmailInput" 
          class="input-box" 
          placeholder="Type your email here" 
          oninput="validateDeleteEmailInput()"
        >
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-logout" onclick="closeDeleteConfirmModal()" style="padding: 12px; font-size: 13px; flex: 1;">Cancel</button>
        <button 
          class="btn btn-danger" 
          id="confirmDeleteActionBtn" 
          onclick="deleteUserAccount()" 
          disabled 
          style="padding: 12px; font-size: 13px; background: #fff5f5; opacity: 0.5; cursor: not-allowed; flex: 1;"
        >
          <i class="fa-solid fa-trash-can"></i> Permanently Delete
        </button>
      </div>
    </div>
  </div>

  <script src="profile.js"></script>

  <!-- Navigation Helper Functions -->
  <script>
    function goToAdminPanel() { window.location.href = "admin-panel.html"; }
    function goToManageTeam() { window.location.href = "manage-team.html"; }
    function goToSendNotification() { window.location.href = "admin-notifications.html"; }
    function goToUploadTest() { window.location.href = "admin-manage-tests.html"; }
    function goToAiTestCreator() { window.location.href = "admin-ai-test.html"; }
    function goToHome() { window.location.href = "index.html"; }
  </script>
</body>
</html>
