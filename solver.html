<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Smart AI Assistant & Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- CSS PATH -->
  <link rel="stylesheet" href="solver.css">

  <!-- MARKDOWN PARSER -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MATHJAX SETUP -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        pageReady: () => {
          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

  <div class="box">
    <!-- CHAT HEADER -->
    <div class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">
          <!-- BOT SVG ICON -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
            <path d="M12 12L2.5 7.5"></path>
            <path d="M12 12v9.5"></path>
            <circle cx="12" cy="12" r="3" fill="#3aa0ff"></circle>
          </svg>
        </div>
        <div>
          <h3>ROITX AI Tutor</h3>
          <span class="online-status">🟢 Online | Saath Me Padhne Ke Liye Taiyar</span>
        </div>
      </div>
    </div>

    <!-- CONTINUOUS CHAT STREAM CONTAINER -->
    <div id="answerHistory" class="chat-container">
      
      <!-- DEFAULT WHATSAPP INTERACTIVE CARD (LANGUAGE SELECTION) -->
      <div class="chat-bubble ai" style="background: transparent; padding: 0; border: none;">
        <div class="interactive-card">
          <div class="card-text">
            Namaste 🙏 Welcome to ROITX AI Tutor.<br>
            Kripya apni pasandida bhasha chunein / Choose your language:
          </div>
          <div class="interactive-btn-group">
            <button class="wa-action-btn" onclick="selectLanguage('hinglish', 'Hinglish')">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              Hinglish (Mix)
            </button>
            <button class="wa-action-btn" onclick="selectLanguage('hi', 'हिंदी (Hindi)')">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              हिंदी (Hindi)
            </button>
            <button class="wa-action-btn" onclick="selectLanguage('en', 'English')">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
              English
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- QUESTION INPUT -->
    <div class="input-group">
      <textarea
        id="question"
        placeholder="Apna sawaal, equation ya theory problem type karein..."
      ></textarea>
      <button id="solveBtn" onclick="solve()">
        Bhejen 
        <svg class="send-btn-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>

    <!-- FLOATING MY FEEDBACKS BUTTON -->
    <button class="doubt-fab" title="Mere Feedbacks" onclick="toggleMyDoubt()">
      <svg class="fab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span id="notifyDot" class="notify-dot" style="display:none;"></span>
    </button>

    <!-- MY FEEDBACKS PANEL -->
    <div id="myDoubtPanel" class="my-doubt-panel" style="display:none;">
      <div class="panel-header">
        <h3>📝 Mere Sawaal & Feedbacks</h3>
        <button class="close-btn" onclick="toggleMyDoubt()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="doubtList">Loading...</div>
    </div>

  </div>

  <!-- SOLVER JS PATH -->
  <script src="solver.js"></script>

</body>
</html>
