<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart AI Assistant & Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="solver.css">

  <!-- MATHJAX SAFE SETUP -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        pageReady: () => {
          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Supabase CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

  <div class="box">
       <!-- CHAT HEADER -->
    <div class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">🤖</div>
        <div>
          <h3>ROITX AI Tutor</h3>
          <span class="online-status">🟢 Online | Ready to Help</span>
        </div>
      </div>

      <!-- LANGUAGE SELECTOR -->
      <div class="lang-selector" style="display: flex; gap: 5px;">
        <button id="langHi" onclick="setLanguage('hi')" style="background: #0284c7; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">Hinglish</button>
        <button id="langEn" onclick="setLanguage('en')" style="background: #334155; color: #cbd5e1; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">English</button>
      </div>
    </div>


    <!-- CONTINUOUS CHAT STREAM CONTAINER -->
    <div id="answerHistory" class="chat-container">
      <!-- Welcome message and dynamic buttons render here -->
    </div>

    <!-- QUESTION INPUT -->
    <div class="input-group">
      <textarea
        id="question"
        placeholder="Apna sawaal, equation ya theory problem type karein..."
      ></textarea>
      <button id="solveBtn" onclick="solve()">Send ➔</button>
    </div>

    <!-- FLOATING MY FEEDBACKS BUTTON -->
    <button class="doubt-fab" title="My Feedbacks" onclick="toggleMyDoubt()">
      💬
      <span id="notifyDot" class="notify-dot" style="display:none;"></span>
    </button>

    <!-- MY FEEDBACKS PANEL -->
    <div id="myDoubtPanel" class="my-doubt-panel" style="display:none;">
      <div class="panel-header">
        <h3>📝 My Feedbacks & Queries</h3>
        <button class="close-btn" onclick="toggleMyDoubt()">✕</button>
      </div>
      <div id="doubtList">Loading...</div>
    </div>

  </div>

  <!-- Solver Logic -->
  <script src="solver.js"></script>

</body>
</html>
