<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Smart AI Assistant & Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- CSS PATH -->
  <link rel="stylesheet" href="solver.css">

  <!-- MARKDOWN PARSER -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Cropper.js CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <!-- MATHJAX SETUP -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      startup: {
        pageReady: () => {
          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- SUPABASE CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

  <div class="box">
    <!-- CHAT HEADER -->
    <div class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">
          <!-- BOT SVG ICON -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
            <path d="M12 12L2.5 7.5"></path>
            <path d="M12 12v9.5"></path>
            <circle cx="12" cy="12" r="3" fill="#3aa0ff"></circle>
          </svg>
        </div>
        <div>
          <h3>ROITX AI Tutor</h3>
          <span class="online-status">🟢 Online | Saath Me Padhne Ke Liye Taiyar</span>
        </div>
      </div>
    </div>

    <!-- CONTINUOUS CHAT STREAM CONTAINER (JS will render initial UI card dynamic) -->
    <div id="answerHistory" class="chat-container"></div>

    <!-- QUESTION INPUT -->
        <!-- QUESTION INPUT WITH IMAGE UPLOAD -->
    <div id="imagePreviewContainer" class="image-preview-box" style="display:none;">
      <img id="imagePreview" src="" alt="Selected Math Question">
      <button type="button" class="remove-img-btn" onclick="removeSelectedImage()">✖</button>
    </div>

    <div class="input-group">
      <label for="solverImageInput" class="attach-btn" title="Photo Bhejen">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </label>
      <input type="file" id="solverImageInput" accept="image/*" style="display:none;" onchange="handleSolverImagePreview(event)">

      <textarea
        id="question"
        placeholder="Apna sawaal, equation type karein ya photo upload karein..."
        onkeydown="if(event.key === 'Enter' && !event.shiftKey){ event.preventDefault(); solve(); }"
      ></textarea>
      
      <button id="solveBtn" onclick="solve()">
        Bhejen 
        <svg class="send-btn-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>


    <!-- FLOATING MY FEEDBACKS BUTTON -->
    <button class="doubt-fab" title="Mere Feedbacks" onclick="toggleMyDoubt()">
      <svg class="fab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span id="notifyDot" class="notify-dot" style="display:none;"></span>
    </button>

    <!-- MY FEEDBACKS PANEL -->
    <div id="myDoubtPanel" class="my-doubt-panel" style="display:none;">
      <div class="panel-header">
        <h3>📝 Mere Sawaal & Feedbacks</h3>
        <button class="close-btn" onclick="toggleMyDoubt()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="doubtList">Loading...</div>
    </div>

  </div>
<!-- IMAGE CROPPER MODAL -->
<div id="cropperModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
  <div style="background:#1e293b; border:1px solid #3b82f6; border-radius:12px; width:90%; max-width:500px; padding:15px; color:#fff; display:flex; flex-direction:column; gap:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; font-size:15px; color:#60a5fa;">✂️ Question Crop / Highlight Karein</h3>
      <button onclick="closeCropperModal()" style="background:none; border:none; color:#94a3b8; font-size:18px; cursor:pointer;">✖</button>
    </div>
    
    <div id="cropperWrapper" style="max-height:55vh; overflow:hidden; background:#0f172a; border-radius:8px; display:flex; justify-content:center; align-items:center;">
      <img id="cropperImageSrc" src="" style="max-width:100%; display:block;">
    </div>

    <div id="cropperDefaultFooter" style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="closeCropperModal()" style="background:#334155; border:none; color:#cbd5e1; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:12px;">Cancel</button>
      <button onclick="applyImageCrop()" style="background:#2563eb; border:none; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;">Crop & Highlight</button>
    </div>
  </div>
</div>

  <!-- SOLVER JS PATH -->
  <script src="solver.js"></script>

</body>
</html>
