<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step Solver & Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="solver.css">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Config -->
  <script src="supabase.js"></script>
</head>
<body>

  <div class="box">
    <h2>🧠 Step-by-Step Solver & AI Assistant</h2>

    <p class="hint">
      ✏️ Apna question ya math problem yahan type karein<br>
      💬 AI answer karega, ya aap Admin ko Feedback bhej sakte hain.
    </p>

    <!-- QUESTION INPUT -->
    <div class="input-group">
      <textarea
        id="question"
        placeholder="Apna sawaal ya problem likhein..."
      ></textarea>
      <button id="solveBtn" onclick="solve()">🔍 Ask / Solve</button>
    </div>

    <!-- CHAT & ANSWER CONTAINER (CONTINUOUS MESSAGES) -->
    <div id="answerHistory" class="chat-container">
      <!-- Messages will appear here continuously -->
    </div>

    <!-- FLOATING MY FEEDBACKS BUTTON -->
    <button class="doubt-fab" title="My Feedbacks" onclick="toggleMyDoubt()">
      💬
      <span id="notifyDot" class="notify-dot" style="display:none;"></span>
    </button>

    <!-- MY FEEDBACKS PANEL -->
    <div id="myDoubtPanel" class="my-doubt-panel" style="display:none;">
      <div class="panel-header">
        <h3>📝 My Feedbacks & Queries</h3>
        <button class="close-btn" onclick="toggleMyDoubt()">✕</button>
      </div>
      <div id="doubtList">Loading...</div>
    </div>

  </div>

  <!-- Solver Logic -->
  <script src="solver.js"></script>

</body>
</html>
