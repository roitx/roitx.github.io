<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#080f19">
  <script>(function(){try{var t=localStorage.getItem('roitx_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#080f19':'#f5f8fd';}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
  <title>ROITX AI Tutor & Instant Math Doubt Solver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- SEO Meta Tags -->
  <meta name="description" content="Upload image or type your math, physics, and chemistry equations to get instant step-by-step solutions using ROITX AI Tutor.">
  <meta name="keywords" content="AI Doubt Solver, Class 12 Math Problem Solver, Crop Question Solver, Roitx AI Tutor, NCERT Doubts Solution">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="canonical" href="https://roitx.dpdns.org/solver.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ROITX AI Tutor - Instant Doubt Solver">
  <meta property="og:description" content="Ask study doubts, crop questions, and get step-by-step AI answers.">
  <meta property="og:url" content="https://roitx.dpdns.org/solver.html">
  <meta property="og:image" content="https://roitx.dpdns.org/banner.png">

  <!-- Schema Markup -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ROITX AI Tutor",
    "url": "https://roitx.dpdns.org/solver.html",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "All"
  }
  </script>

  <link rel="stylesheet" href="solver.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
      startup: { pageReady: () => MathJax.startup.defaultPageReady() }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>

<body>

  <div class="box">
    <!-- CHAT HEADER -->
    <div class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">
          <!-- BOT SVG ICON -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3aa0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
            <path d="M12 12L2.5 7.5"></path>
            <path d="M12 12v9.5"></path>
            <circle cx="12" cy="12" r="3" fill="#3aa0ff"></circle>
          </svg>
        </div>
        <div>
          <h3>ROITX AI Tutor</h3>
          <span class="online-status">🟢 Online | Saath Me Padhne Ke Liye Taiyar</span>
        </div>
      </div>
<div class="header-actions">
        <button type="button" class="sound-toggle" title="Sound on / off" aria-label="Toggle sound" onclick="toggleSound()">
          <svg class="icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"></path></svg>
          <svg class="icon-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>
        </button>
        <button type="button" class="theme-toggle" title="Dark / Light mode" aria-label="Toggle theme" onclick="toggleTheme()">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        </button>
        <button type="button" class="new-chat-btn" title="Nayi chat" onclick="startNewChat()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
        </svg>
      </button>
      </div>
    </div>

    <!-- CONTINUOUS CHAT STREAM CONTAINER (JS will render initial UI card dynamic) -->
    <div id="answerHistory" class="chat-container"></div>

    <!-- QUESTION INPUT -->
        <!-- QUESTION INPUT WITH IMAGE UPLOAD -->
    <div id="imagePreviewContainer" class="image-preview-box" style="display:none;">
      <img id="imagePreview" src="" alt="Selected Math Question">
      <button type="button" class="remove-img-btn" onclick="removeSelectedImage()">✖</button>
    </div>

    <div class="input-group">
      <textarea
        id="question"
        rows="1"
        placeholder="Apna sawaal, equation type karein ya photo upload karein..."
        onkeydown="if(event.key === 'Enter' && !event.shiftKey){ event.preventDefault(); solve(); }"
      ></textarea>

      <div class="composer-row">
        <label for="solverImageInput" class="attach-btn" title="Photo / Attach">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </label>
        <input type="file" id="solverImageInput" accept="image/*" style="display:none;" onchange="handleSolverImagePreview(event)">

        <button type="button" id="ctxPill" class="ctx-pill" title="Subject" onclick="renderFieldSelection()">General Doubt</button>

        <span class="composer-spacer"></span>

        <button type="button" id="micBtn" class="mic-btn" title="Mic" aria-label="Voice input" onclick="toggleMic()">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg>
        </button>

        <button id="solveBtn" type="button" title="Send" aria-label="Send" onclick="solve()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
        </button>
      </div>
    </div>

    <!-- FLOATING MY FEEDBACKS BUTTON -->
    <button class="doubt-fab" title="Mere Feedbacks" onclick="toggleMyDoubt()">
      <svg class="fab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
      <span id="notifyDot" class="notify-dot" style="display:none;"></span>
    </button>

    <!-- MY FEEDBACKS PANEL -->
    <div id="myDoubtPanel" class="my-doubt-panel" style="display:none;">
      <div class="panel-header">
        <h3>📝 Mere Sawaal & Feedbacks</h3>
        <button class="close-btn" onclick="toggleMyDoubt()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="doubtList">Loading...</div>
    </div>

  </div>
<!-- IMAGE CROPPER MODAL -->
<div id="cropperModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
  <div style="background:var(--surface); border:1px solid var(--accent); border-radius:12px; width:90%; max-width:500px; padding:15px; color:var(--text); display:flex; flex-direction:column; gap:12px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0; font-size:15px; color:var(--accent);">✂️ Question Crop / Highlight Karein</h3>
      <button onclick="closeCropperModal()" style="background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer;">✖</button>
    </div>
    
    <div id="cropperWrapper" style="max-height:55vh; overflow:hidden; background:var(--bg); border-radius:8px; display:flex; justify-content:center; align-items:center;">
      <img id="cropperImageSrc" src="" style="max-width:100%; display:block;">
    </div>

    <div id="cropperDefaultFooter" style="display:flex; gap:10px; justify-content:flex-end;">
      <button onclick="closeCropperModal()" style="background:var(--border); border:none; color:var(--muted); padding:8px 14px; border-radius:6px; cursor:pointer; font-size:12px;">Cancel</button>
      <button onclick="applyImageCrop()" style="background:var(--accent); border:none; color:#fff; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;">Crop & Highlight</button>
    </div>
  </div>
</div>

  <!-- SOLVER JS PATH -->
  <script src="solver.js"></script>

</body>
</html>
