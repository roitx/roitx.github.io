<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center; 
  align-items: center;     
  background: #e0e5ec;
  overflow-x: hidden;      
  padding: 20px;           
}

/* BACKGROUND ANIMATION */
.bg span {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .45;
  animation: float 10s infinite alternate;
  z-index: -1;
}
.bg span:nth-child(1) { background: #ff7a3d; top: 10%; left: 5%; }
.bg span:nth-child(2) { background: #5a2eff; bottom: 10%; right: 5%; }

@keyframes float {
  to { transform: translateY(-40px); }
}

/* WRAPPER */
.wrapper {
  position: relative;
  width: 100%;
  max-width: 380px; 
  display: flex;
  justify-content: center;
}

/* CHARACTER */
.character {
  width: 140px;
  height: 140px;
  background: #e0e5ec;
  border-radius: 50%;
  position: absolute;
  top: -70px; 
  z-index: 10;
  box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #fff;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), rotate 0.25s ease-out, translate 0.25s ease-out;
  transform-origin: center bottom;
  cursor: pointer;
  animation: breathing 4s ease-in-out infinite;
}

@keyframes breathing {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.02) translateY(-2px); }
}

.eye-container {
  position: absolute;
  top: 50px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  padding: 0 38px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
}

.eye {
  width: 22px;
  height: 22px;
  background: radial-gradient(circle at 50% 40%, #fff 55%, #e6e9ef 100%);
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.28), 0 1px 0 #fff;
  transition: transform 0.3s ease, background 0.3s ease, border 0.3s ease, height 0.3s ease;
  animation: blink 4.5s infinite;
}
/* Iris + pupil + light reflections */
.iris {
  position: absolute;
  left: 50%; top: 50%;
  width: 14px; height: 14px;
  margin: -7px 0 0 -7px;
  border-radius: 50%;
  background: radial-gradient(circle, #0b0b0d 0 28%, #3b2417 31%, #7a4a2b 64%, #2a1a10 100%);
  transition: transform 0.12s ease-out;
}
.iris::after {
  content: "";
  position: absolute;
  top: 2px; left: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 4px 5px 0 -1px rgba(255,255,255,.55);
}
/* Lower lid: rises when smiling => "eye smile" */
.eye::before {
  content: "";
  position: absolute;
  left: -20%; right: -20%; bottom: -2px;
  height: 10%;
  background: #e0e5ec;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  box-shadow: 0 -1px 2px rgba(0,0,0,.12);
  transition: height 0.35s ease;
  z-index: 2;
}
/* Upper lid */
.eye::after {
  content: "";
  position: absolute;
  left: -5%; right: -5%; top: -2px;
  height: 22%;
  background: #e0e5ec;
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
  box-shadow: 0 1px 2px rgba(0,0,0,.2);
  transition: height 0.35s ease;
  z-index: 2;
}
.character.happy .eye::before,
.character.expr-blush .eye::before,
.character.expr-star .eye::before,
.character.expr-wink .eye.left::before { height: 48%; }
.character.happy .eye::after { height: 28%; }
.character.expr-sleep .iris,
.character.expr-dizzy .iris,
.character.expr-star .iris { display: none; }

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(0.08); }
}

/* Soft Blended Cheeks / Blush */
.cheek {
  position: absolute;
  width: 24px;
  height: 12px;
  background: rgba(255, 122, 61, 0.2);
  border-radius: 50%;
  filter: blur(4px);
  top: 74px;
  transition: 0.3s ease;
}
.cheek.left { left: 22px; }
.cheek.right { right: 22px; }

/* Flawless SVG Natural Smile (Zero Rendering Lines) */
.mouth {
  position: absolute;
  top: 84px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 14px;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.mouth svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.mouth path {
  stroke: #7a3b36;
  stroke-width: 2.6;
  stroke-linecap: round;
  fill: none;
  transition: stroke 0.3s ease;
}

.mouth .lip { fill: #e8918c; stroke: none; opacity: .9; }
.character[class*="expr-"]:not(.expr-blush):not(.expr-wink):not(.expr-star) .mouth .lip,
.wrong .mouth .lip { opacity: 0; }

/* Happy: bigger smile, raised cheeks (eye-smile handled above) */
.character.happy .mouth .line { d: path("M1 3 Q 18 21 35 3"); }
.character.happy .mouth .lip { d: path("M1 3 Q 18 21 35 3 Q 18 12 1 3 Z"); }
.character.happy .cheek {
  background: rgba(255, 110, 110, 0.38);
  transform: translateY(-3px) scale(1.15);
}

/* Zzz Animation for Sleep Mode */
.zzz-container {
  position: absolute;
  top: -22px;
  right: 18px;
  display: none;
  z-index: 15;
}
.character.expr-sleep .zzz-container {
  display: block;
}
.zzz-container span {
  position: absolute;
  font-weight: bold;
  color: #5a2eff;
  opacity: 0;
  animation: floatZzz 2.2s ease-in-out infinite;
}
.zzz-container span:nth-child(1) { font-size: 11px; animation-delay: 0s; left: 0px; }
.zzz-container span:nth-child(2) { font-size: 15px; animation-delay: 0.7s; left: 8px; }
.zzz-container span:nth-child(3) { font-size: 19px; animation-delay: 1.4s; left: 18px; }

@keyframes floatZzz {
  0% { transform: translateY(0px) scale(0.8); opacity: 0; }
  50% { opacity: 0.85; }
  100% { transform: translateY(-28px) scale(1.2); opacity: 0; }
}

/* Detailed Expressions */
.character.jump {
  animation: teddyJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes teddyJump {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-24px) scale(1.08, 0.92) rotate(3deg); }
  70% { transform: translateY(4px) scale(0.95, 1.05); }
  100% { transform: translateY(0) scale(1); }
}

.character.wiggle {
  animation: teddyWiggle 0.5s cubic-bezier(0.36, 0, 0.66, -0.56);
}
@keyframes teddyWiggle {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-10deg) scale(1.04); }
  40% { transform: rotate(10deg) scale(1.04); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
}

/* 😖 Pain */
.character.expr-pain .eye { transform: rotate(45deg) scale(0.75); }
.character.expr-pain .mouth path { d: path("M2 2 Q 18 14 34 2"); }

/* 😴 Sleep (Poori tarah aankh band + Zzz) */
.character.expr-sleep .eye { height: 3px !important; border-radius: 2px !important; background: #333 !important; transform: none !important; }
.character.expr-sleep .mouth path { d: path("M8 8 Q 18 5 28 8"); }

/* 😉 Wink */
.character.expr-wink .eye.right { transform: scaleY(0.12); }
.character.expr-wink .mouth path { d: path("M2 4 Q 18 16 34 4"); transform: rotate(-4deg); }

/* 😵 Dizzy */
.character.expr-dizzy { animation: teddySpin 0.6s ease; }
@keyframes teddySpin {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(15deg) scale(0.96); }
}
.character.expr-dizzy .eye { background: transparent; border: 2px dashed #333; }
.character.expr-dizzy .mouth path { d: path("M4 10 Q 18 2 32 10"); }

/* 😫 Tired */
.character.expr-tired .eye { transform: scaleY(0.25); }
.character.expr-tired .mouth path { d: path("M4 8 Q 18 2 32 8"); stroke: #ff4d4d; }

/* 🥴 Woozy */
.character.expr-woozy { transform: rotate(-6deg) scale(0.97); }
.character.expr-woozy .eye.left { transform: scaleY(0.35); }
.character.expr-woozy .mouth path { d: path("M6 6 Q 18 14 30 6"); }

/* 🧐 Monocle / Curious */
.character.expr-monocle .eye-container { transform: translateX(5px) scale(0.9); }
.character.expr-monocle .mouth path { d: path("M10 6 A 4 4 0 0 1 26 6 A 4 4 0 0 1 10 6"); }

/* 🥱 Yawn */
.character.expr-yawn .eye { transform: scaleY(0.18); }
.character.expr-yawn .mouth path { d: path("M12 2 A 6 6 0 1 1 24 2 A 6 6 0 1 1 12 2"); fill: #333; stroke: none; }

/* 😗 Kiss */
.character.expr-kiss .mouth path { d: path("M14 4 A 4 4 0 1 1 22 4 A 4 4 0 1 1 14 4"); fill: #333; stroke: none; }

/* ☺️ Blush */
.character.expr-blush .cheek { background: rgba(255, 90, 140, 0.35); width: 28px; height: 14px; filter: blur(3px); }
.character.expr-blush .mouth path { d: path("M2 4 Q 18 16 34 4"); }

/* 🤩 Star / Excited */
.character.expr-star { animation: teddyExcited 0.4s ease infinite alternate; }
@keyframes teddyExcited {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-8px) scale(1.05); }
}
.character.expr-star .eye { background: #ffaa00; border-radius: 30%; }
.character.expr-star .mouth path { d: path("M2 4 Q 18 16 34 4"); }

/* 😛 Silly */
.character.expr-silly .eye.left { transform: scaleY(0.3); }
.character.expr-silly .mouth path { d: path("M12 2 C 12 12, 24 12, 24 2 Z"); fill: #ff4d4d; stroke: none; }

/* 🥺 Pleading */
.character.expr-pleading .eye { transform: scale(1.2); }
.character.expr-pleading .mouth path { d: path("M6 8 Q 18 2 30 8"); }

/* 🤫 Shushing */
.character.expr-shush .mouth path { d: path("M14 7 A 3 3 0 1 1 20 7 A 3 3 0 1 1 14 7"); fill: #333; stroke: none; }

.hand {
  position: absolute;
  width: 40px;
  height: 43px;
  top: 40px;
  opacity: 0;
  pointer-events: none;
  z-index: 12;
  filter: drop-shadow(2px 4px 4px rgba(90, 60, 40, .35));
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
}
.hand svg { width: 100%; height: 100%; display: block; overflow: visible; }
.hand.right svg { transform: scaleX(-1); }
.hand.left  { left: 30px;  transform: translate(-10px, 40px) rotate(-6deg); }
.hand.right { right: 30px; transform: translate(10px, 40px) rotate(6deg); }
.cover .hand.left  { transform: translate(0, 0) rotate(7deg); }
.cover .hand.right { transform: translate(0, 0) rotate(-7deg); }

/* 👋 Welcome wave (page load par right hand side se hilta hai) */
.hand.right.wave-hi {
  opacity: 1;
  transform-origin: 50% 90%;
  animation: handWave 0.45s ease-in-out 0s 6 alternate;
}
@keyframes handWave {
  from { transform: translate(52px, 6px) rotate(-10deg); }
  to   { transform: translate(56px, 2px) rotate(24deg); }
}

/* ✨ Click par sparkles / hearts */
.spark {
  position: absolute;
  left: 50%; top: 42%;
  font-size: 16px;
  line-height: 1;
  pointer-events: none;
  z-index: 20;
  animation: sparkFly 0.9s ease-out forwards;
}
@keyframes sparkFly {
  0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .hand.right.wave-hi { animation: none; }
  .spark { display: none; }
}

/* 😟 Worried (weak password) */
.character.worried .mouth path { d: path("M5 9 Q 11 3 18 8 T 31 8"); }
.character.worried .eye { transform: scale(1.08); }

/* 👍 😰 🎉 Reaction badge (character ke upar pop hota hai) */
.react-badge {
  position: absolute;
  top: -8px; right: -14px;
  font-size: 28px;
  line-height: 1;
  pointer-events: none;
  z-index: 25;
  animation: badgePop 1.7s ease forwards;
}
@keyframes badgePop {
  0%   { transform: scale(0) rotate(-25deg); opacity: 0; }
  18%  { transform: scale(1.3) rotate(8deg); opacity: 1; }
  32%  { transform: scale(1) rotate(0deg); }
  80%  { opacity: 1; }
  100% { transform: translateY(-16px) scale(1); opacity: 0; }
}

/* 🎊 Login success confetti */
.confetti-piece {
  position: fixed;
  top: -14px;
  left: var(--x);
  width: 8px; height: 12px;
  background: var(--c);
  border-radius: 2px;
  pointer-events: none;
  z-index: 9999;
  animation: confettiFall var(--dur) linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 1; }
  85%  { opacity: 1; }
  100% { transform: translate3d(var(--drift), 105vh, 0) rotate(var(--rot)); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .confetti-piece, .react-badge { display: none; }
  .character { transition: none; }
}

/* ANIMATION STATES (EYE COVER LOGIC) */
.cover .eye-container { opacity: 0; }
.cover .cheek { opacity: 0.1; }
.cover .hand { opacity: 1; }

.wrong .mouth path {
  d: path("M2 10 Q 18 2 34 10");
  stroke: #ff4d4d;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  50% { transform: translateX(10px); }
  75% { transform: translateX(-10px); }
}
.shake { animation: shake 0.4s ease-in-out; }

/* CARD */
.card {
  width: 100%; 
  padding: 90px 25px 30px;
  border-radius: 28px;
  background: #e0e5ec;
  box-shadow: 18px 18px 30px #b8bec7, -18px -18px 30px #fff;
  text-align: center;
}

h1 { font-size: 24px; color: #444; margin-bottom: 5px; }
h2 { font-size: 14px; margin-bottom: 20px; color: #777; font-weight: 400; }

input {
  width: 100%;
  padding: 15px;
  margin-bottom: 12px;
  border: none;
  border-radius: 12px;
  background: #e0e5ec;
  box-shadow: inset 6px 6px 12px #b8bec7, inset -6px -6px 12px #fff;
  outline: none;
  font-size: 15px;
}

/* PASSWORD WRAPPER WITH EYE TOGGLE */
.password-field-wrapper {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.password-field-wrapper input {
  margin-bottom: 0 !important;
  padding-right: 48px !important;
}
.eye-toggle-btn {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #718096;
  padding: 4px;
  z-index: 2;
}
.eye-toggle-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Password Strength Indicator */
.password-strength-indicator {
  font-size: 12px;
  text-align: left;
  margin-top: -6px;
  margin-bottom: 12px;
  padding-left: 5px;
  font-weight: 600;
  display: none;
}
.strength-weak { color: #ff4d4d; }
.strength-good { color: #ffa500; }
.strength-strong { color: #28a745; }

#confirmPassWrapper {
  display: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#confirmPassWrapper.visible {
  display: flex;
  opacity: 1;
}

button.primary-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: #e0e5ec;
  color: #444;
  font-weight: 700;
  font-size: 16px;
  box-shadow: 6px 6px 12px #b8bec7, -6px -6px 12px #fff;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 6px;
}

button.primary-btn:active {
  box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #fff;
  transform: scale(0.98);
}

.google-btn {
  margin-top: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.auth-links {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-size: 13px;
}

.auth-links a {
  color: #5a2eff;
  text-decoration: none;
  font-weight: 600;
  cursor: pointer;
}

.auth-links a:hover { text-decoration: underline; }

@media (max-width: 400px) {
  .card { padding: 80px 20px 25px; }
  .character { width: 120px; height: 120px; top: -60px; }
  .hand { width: 34px; height: 36px; top: 38px; }
  .hand.left  { left: 32px; }
  .hand.right { right: 32px; }
}
</style>

          <rect x="37.5" y="9.5" width="7" height="8" rx="3.5"/>

        <g fill="none" stroke="#c9885f" stroke-width=".9" stroke-linecap="round" opacity=".5">
          <path d="M5 36h6M16 34h6M27 33h6M38 34h6"/>
          <path d="M14 50q8 5 20 0"/>
        </g>
      </svg>
    </div>
  </aside>

  <section class="card" id="authCard">
    <header>
      <h1 id="titleText">Welcome Back!</h1>
      <h2 id="subText">ROITX HUB</h2>
    </header>

    <form onsubmit="return false;" autocomplete="on">
      <!-- Signup Extra Fields -->
      <input id="fullName" type="text" placeholder="Full Name" style="display: none;" autocomplete="name">
      <input id="phone" type="tel" placeholder="10-digit Phone Number" maxlength="10" style="display: none;" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="tel">
      <input id="pincode" type="text" placeholder="Area Pincode (e.g. 800001)" maxlength="6" style="display: none;" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="postal-code">

      <input id="email" type="email" placeholder="Email Address" autocomplete="email">
      <!-- Email OTP code input (sirf otp_verify mode me dikhta hai) -->
      <input id="otpCode" type="text" inputmode="numeric" maxlength="8" placeholder="Enter code from email" style="display: none; text-align: center; letter-spacing: 6px; font-weight: 700; font-size: 20px;" oninput="this.value=this.value.replace(/[^0-9]/g,'')" autocomplete="one-time-code">
      
      <!-- Primary Password Input with Eye -->
      <div class="password-field-wrapper" id="mainPassWrapper">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" oninput="handlePasswordTyping()">
        <button type="button" class="eye-toggle-btn" onclick="togglePassVisibility('password', this)" aria-label="Toggle Password Visibility">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>

      <!-- Password Strength Text -->
      <div id="passwordStrength" class="password-strength-indicator"></div>

      <!-- Dynamic Confirm Password Field -->
      <div class="password-field-wrapper" id="confirmPassWrapper">
        <input id="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password">
        <button type="button" class="eye-toggle-btn" onclick="togglePassVisibility('confirmPassword', this)" aria-label="Toggle Confirm Password Visibility">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </button>
      </div>
      
      <button id="mainBtn" class="primary-btn" onclick="handleAuthSubmit()">Login</button>

      <!-- Google OAuth Button -->
      <button id="googleBtn" type="button" class="primary-btn google-btn" onclick="triggerGoogleAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="googleBtnText">Login with Google</span>
      </button>
    </form>

    <nav class="auth-links" id="linkBox" aria-label="Authentication Navigation">
      <a onclick="switchMode('forgot')" id="forgotLink">Forgot Password?</a>
      <span>New here? <a onclick="switchMode('signup')">Create Account</a></span>
      <a onclick="switchMode('otp')">Login with Email Code</a>
    </nav>
  </section>
</main>

<script>
/* Anti-DevTools Protection Script */
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('keydown', (e) => {
  if (e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
      (e.ctrlKey && e.key === 'U')) {
    e.preventDefault();
    return false;
  }
});

let currentMode = "login"; 

const fullNameInput = document.getElementById("fullName");
const phoneInput = document.getElementById("phone");
const pincodeInput = document.getElementById("pincode");
const passwordInput = document.getElementById("password");
const confirmPassInput = document.getElementById("confirmPassword");
const confirmPassWrapper = document.getElementById("confirmPassWrapper");
const emailInput = document.getElementById("email");
const otpCodeInput = document.getElementById("otpCode");
let otpEmail = "";
let otpTimer = null;

const char = document.getElementById("char");
const card = document.getElementById("authCard");
const titleText = document.getElementById("titleText");
const subText = document.getElementById("subText");
const mainBtn = document.getElementById("mainBtn");
const googleBtn = document.getElementById("googleBtn");
const googleBtnText = document.getElementById("googleBtnText");
const linkBox = document.getElementById("linkBox");
const passwordStrengthEl = document.getElementById("passwordStrength");

const leftEye = document.getElementById("leftEye");
const rightEye = document.getElementById("rightEye");
const mouthPath = document.querySelector(".mouth path");

/* Smooth Cursor Movement Tracking for Character Eyes */
document.addEventListener("mousemove", (e) => {
  if (char.classList.contains("cover")) return;
  const eyes = [leftEye, rightEye];
  eyes.forEach(eye => {
    if (!eye) return;
    const rect = eye.getBoundingClientRect();
    const eyeCenterX = rect.left + rect.width / 2;
    const eyeCenterY = rect.top + rect.height / 2;
    
    const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
    const distance = Math.min(3.2, Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 25);
    
    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;
    
    const iris = eye.querySelector('.iris');
    if (iris) iris.style.transform = `translate(${x}px, ${y}px)`;
  });
});

const allExpressions = [
  "expr-pain", "expr-sleep", "expr-wink", 
  "expr-dizzy", "expr-tired", "expr-woozy", "expr-monocle", 
  "expr-yawn", "expr-kiss", "expr-blush", "jump", "wiggle",
  "expr-star", "expr-silly", "expr-pleading", "expr-shush"
];

function clearAllExpressions() {
  char.classList.remove(...allExpressions);
  if (mouthPath) mouthPath.setAttribute("d", "M2 4 Q 18 16 34 4");
}

/* Tap / Click Reactions */
function sparkBurst() {
  const icons = ["✨", "💖", "⭐", "✨", "💫", "💖"];
  icons.forEach((icon, i) => {
    const el = document.createElement("span");
    el.className = "spark";
    el.textContent = icon;
    const angle = (-90 + (i - 2.5) * 32) * Math.PI / 180;   // upar ki taraf pankhe jaisa
    const dist = 55 + Math.random() * 25;
    el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    el.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    char.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  });
}

char.addEventListener("click", () => {
  if (char.classList.contains("cover")) return;
  sparkBurst();
  clearAllExpressions();
  const randomExpr = allExpressions[Math.floor(Math.random() * allExpressions.length)];
  void char.offsetWidth; 
  char.classList.add(randomExpr);
  
  setTimeout(() => {
    char.classList.remove(randomExpr);
  }, 700);
});

/* 5 Seconds Idle Waiting & Rotating Expressions (Sleep gets 15 seconds stay) */
let idleTimer = null;
let rotateInterval = null;

function resetIdleTimer() {
  clearTimeout(idleTimer);
  clearTimeout(rotateInterval);
  clearAllExpressions();
  
  idleTimer = setTimeout(() => {
    const activeEl = document.activeElement;
    const isTyping = activeEl && activeEl.tagName === 'INPUT';
    
    if (!char.classList.contains("cover") && !isTyping) {
      triggerExpressionWithCustomTiming();
    }
  }, 5000);
}

function triggerExpressionWithCustomTiming() {
  const activeEl = document.activeElement;
  if (activeEl && activeEl.tagName === 'INPUT' || char.classList.contains("cover")) return;

  clearAllExpressions();
  const randomExpr = allExpressions[Math.floor(Math.random() * allExpressions.length)];
  void char.offsetWidth;
  char.classList.add(randomExpr);

  // If sleep, hold for 15 seconds, else hold for 4 seconds
  const displayDuration = (randomExpr === "expr-sleep") ? 15000 : 4000;

  rotateInterval = setTimeout(() => {
    const currentActive = document.activeElement;
    const stillTyping = currentActive && currentActive.tagName === 'INPUT';
    
    if (!char.classList.contains("cover") && !stillTyping) {
      triggerExpressionWithCustomTiming();
    } else {
      clearAllExpressions();
    }
  }, displayDuration);
}

const allInputs = document.querySelectorAll("input");
allInputs.forEach(input => {
  input.addEventListener("focus", () => {
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  });
  input.addEventListener("input", () => {
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  });
  input.addEventListener("blur", () => {
    resetIdleTimer();
  });
});

document.addEventListener("keydown", resetIdleTimer);
document.addEventListener("click", (e) => {
  if (e.target.tagName !== 'INPUT') {
    resetIdleTimer();
  }
});
document.addEventListener("touchstart", resetIdleTimer);

/* Toggle Password Visibility */
function togglePassVisibility(inputId, btnEl) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const isPassword = input.type === "password";
  input.type = isPassword ? "text" : "password";

  if (isPassword) {
    char.classList.add("cover");
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  } else {
    char.classList.remove("cover");
    resetIdleTimer();
  }

  const eyeOpen = `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
  const eyeClosed = `<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>`;

  btnEl.innerHTML = isPassword ? eyeClosed : eyeOpen;
}

/* ---- Reaction helpers: badge + jump ---- */
function showBadge(emoji) {
  const old = char.querySelector(".react-badge");
  if (old) old.remove();
  const el = document.createElement("span");
  el.className = "react-badge";
  el.textContent = emoji;
  char.appendChild(el);
  el.addEventListener("animationend", () => el.remove());
}
function jumpOnce() {
  char.classList.remove("jump");
  void char.offsetWidth;
  char.classList.add("jump");
  setTimeout(() => char.classList.remove("jump"), 520);
}

/* Password strength -> character reaction (weak: chinta 😰, strong: thumbs-up 👍) */
let lastStrengthLevel = null;
function reactToStrength(strengthClass, len) {
  let level = null;
  if (strengthClass === "strength-strong") level = "strong";
  else if (strengthClass === "strength-good") level = "good";
  else if (strengthClass === "strength-weak" && len >= 3) level = "weak";

  char.classList.toggle("worried", level === "weak");

  if (level !== lastStrengthLevel) {
    if (level === "weak") showBadge("😰");
    if (level === "strong") { showBadge("👍"); jumpOnce(); }
    lastStrengthLevel = level;
  }
}

/* Password Strength & Character Happiness */
function handlePasswordTyping() {
  const val = passwordInput.value;

  if (currentMode === "signup" || currentMode === "update_password") {
    if (val.length > 0) {
      confirmPassWrapper.classList.add("visible");
      passwordStrengthEl.style.display = "block";
      
      let strengthText = "";
      let strengthClass = "";
      
      if (val.length < 6) {
        strengthText = "Strength: Weak (Too short)";
        strengthClass = "strength-weak";
        char.classList.remove("happy");
      } else {
        const hasLetter = /[a-zA-Z]/.test(val);
        const hasNumber = /[0-9]/.test(val);
        const hasSpecial = /[^A-Za-z0-9]/.test(val);
        
        if (val.length >= 8 && hasLetter && hasNumber && hasSpecial) {
          strengthText = "Strength: Strong";
          strengthClass = "strength-strong";
          char.classList.add("happy");
        } else if (val.length >= 6 && ((hasLetter && hasNumber) || hasSpecial)) {
          strengthText = "Strength: Good Enough";
          strengthClass = "strength-good";
          char.classList.remove("happy");
        } else {
          strengthText = "Strength: Weak";
          strengthClass = "strength-weak";
          char.classList.remove("happy");
        }
      }
      passwordStrengthEl.innerText = strengthText;
      passwordStrengthEl.className = "password-strength-indicator " + strengthClass;
      reactToStrength(strengthClass, val.length);

    } else {
      confirmPassWrapper.classList.remove("visible");
      confirmPassInput.value = "";
      passwordStrengthEl.style.display = "none";
      passwordStrengthEl.innerText = "";
      char.classList.remove("happy");
      reactToStrength(null, 0);
    }
  }
}

/* Mode Switcher */
function switchMode(mode) {
  currentMode = mode;
  clearInterval(otpTimer);
  otpCodeInput.value = "";
  otpCodeInput.style.display = "none";
  emailInput.value = "";
  passwordInput.value = "";
  confirmPassInput.value = "";
  fullNameInput.value = "";
  phoneInput.value = "";
  pincodeInput.value = "";
  confirmPassWrapper.classList.remove("visible");
  passwordStrengthEl.style.display = "none";
  passwordStrengthEl.innerText = "";
  clearTimeout(idleTimer);
  clearTimeout(rotateInterval);
  clearAllExpressions();
  char.classList.remove("happy");
  reactToStrength(null, 0);
  resetIdleTimer();

  if (mode === "login") {
    titleText.innerText = "Welcome Back!";
    subText.innerText = "ROITX HUB";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "flex";
    passwordInput.placeholder = "Password";
    googleBtn.style.display = "flex";
    googleBtnText.innerText = "Login with Google";
    mainBtn.innerText = "Login";
    linkBox.innerHTML = `
      <a onclick="switchMode('forgot')">Forgot Password?</a>
      <span>New here? <a onclick="switchMode('signup')">Create Account</a></span>
      <a onclick="switchMode('otp')">Login with Email Code</a>
    `;
  } else if (mode === "signup") {
    titleText.innerText = "Join Roitx";
    subText.innerText = "CREATE ACCOUNT";
    fullNameInput.style.display = "block";
    phoneInput.style.display = "block";
    pincodeInput.style.display = "block";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "flex";
    passwordInput.placeholder = "Create Password (min 6 chars)";
    googleBtn.style.display = "flex";
    googleBtnText.innerText = "Signup with Google";
    mainBtn.innerText = "Sign Up";
    linkBox.innerHTML = `
      <span>Already have an account? <a onclick="switchMode('login')">Login</a></span>
    `;
  } else if (mode === "forgot") {
    titleText.innerText = "Reset Password";
    subText.innerText = "ENTER YOUR EMAIL";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "none";
    googleBtn.style.display = "none";
    mainBtn.innerText = "Send Reset Link";
    linkBox.innerHTML = `
      <span>Remembered Password? <a onclick="switchMode('login')">Back to Login</a></span>
    `;
  } else if (mode === "otp") {
    titleText.innerText = "Login with Email Code";
    subText.innerText = "NO PASSWORD NEEDED";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "none";
    googleBtn.style.display = "none";
    mainBtn.innerText = "Send Code";
    linkBox.innerHTML = `
      <span>Prefer password? <a onclick="switchMode('login')">Back to Login</a></span>
    `;
  } else if (mode === "otp_verify") {
    titleText.innerText = "Enter Code";
    subText.innerText = "SENT TO " + maskEmail(otpEmail);
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "none";
    otpCodeInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "none";
    googleBtn.style.display = "none";
    mainBtn.innerText = "Verify & Login";
    linkBox.innerHTML = `
      <a id="resendOtpLink" onclick="resendOtp()">Resend code</a>
      <a onclick="switchMode('otp')">Change email</a>
    `;
    startOtpCooldown(30);
    setTimeout(() => otpCodeInput.focus(), 100);
  } else if (mode === "update_password") {
    titleText.innerText = "New Password";
    subText.innerText = "SET YOUR NEW PASSWORD";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "none";
    document.getElementById("mainPassWrapper").style.display = "flex";
    passwordInput.placeholder = "Enter New Password";
    googleBtn.style.display = "none";
    mainBtn.innerText = "Save New Password";
    linkBox.innerHTML = `<span><a onclick="switchMode('login')">Cancel & Login</a></span>`;
  }
}

function maskEmail(email) {
  if (!email || !email.includes("@")) return "YOUR EMAIL";
  const [name, domain] = email.split("@");
  const shown = name.length <= 2 ? name[0] : name.slice(0, 2);
  return (shown + "***@" + domain).toUpperCase();
}

function startOtpCooldown(seconds) {
  const link = document.getElementById("resendOtpLink");
  if (!link) return;
  let left = seconds;
  link.style.pointerEvents = "none";
  link.style.opacity = "0.55";
  link.innerText = "Resend code in " + left + "s";
  clearInterval(otpTimer);
  otpTimer = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(otpTimer);
      link.style.pointerEvents = "auto";
      link.style.opacity = "1";
      link.innerText = "Resend code";
    } else {
      link.innerText = "Resend code in " + left + "s";
    }
  }, 1000);
}

async function resendOtp() {
  if (!otpEmail) return switchMode("otp");
  const ok = await window.sendLoginCode(otpEmail);
  if (ok) {
    otpCodeInput.value = "";
    startOtpCooldown(30);
    alert("Naya code aapke email par bhej diya gaya hai.");
  }
}
window.resendOtp = resendOtp;

function triggerGoogleAuth() {
  const forceConsent = currentMode === "signup";
  window.signInWithGoogle(forceConsent);
}

document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const isReset = urlParams.get('reset');
  
  const hashString = window.location.hash.substring(1);
  const hashParams = new URLSearchParams(hashString);
  const type = hashParams.get('type');

  if (isReset || type === 'recovery') {
    switchMode("update_password");
    return;
  }

  const user = await window.getCurrentUser();
  if (user) {
    const redirectTarget = sessionStorage.getItem("redirect_after_login");
    if (redirectTarget) {
      sessionStorage.removeItem("redirect_after_login");
      window.location.href = redirectTarget;
    } else {
      window.location.href = window.getPageUrl ? window.getPageUrl("profile.html") : "profile.html";
    }
  }

  resetIdleTimer();
});

passwordInput.addEventListener("focus", () => {
  if (passwordInput.type === "password") {
    char.classList.add("cover");
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  }
});
passwordInput.addEventListener("blur", () => {
  char.classList.remove("cover");
  resetIdleTimer();
});

confirmPassInput.addEventListener("focus", () => {
  if (confirmPassInput.type === "password") {
    char.classList.add("cover");
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  }
});
confirmPassInput.addEventListener("blur", () => {
  char.classList.remove("cover");
  resetIdleTimer();
});

window.triggerErrorAnim = () => {
  char.classList.add("wrong");
  card.classList.add("shake");
  setTimeout(() => {
    char.classList.remove("wrong");
    card.classList.remove("shake");
  }, 1500);
};

async function handleAuthSubmit() {
  if (currentMode === "login") {
    await window.loginUser();
    await celebrateIfLoggedIn();
  } else if (currentMode === "signup") {
    const fullName = fullNameInput.value.trim();
    const phone = phoneInput.value.trim();
    const pincode = pincodeInput.value.trim();
    const email = emailInput.value.trim();
    const p1 = passwordInput.value;
    const p2 = confirmPassInput.value;

    if (!fullName || !phone || !pincode || !email || !p1) {
      alert("Kripya saare mandatory fields ko bharein!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (phone.length !== 10) {
      alert("Kripya valid 10-digit Phone Number daalein.");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (pincode.length !== 6) {
      alert("Kripya valid 6-digit Area Pincode daalein.");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (p1.length < 6) {
      alert("Password minimum 6 characters ka hona chahiye!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (p1 !== p2) {
      alert("Passwords match nahi ho rahe hain!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    await window.signUpUser();
  } else if (currentMode === "forgot") {
    window.sendResetLink();
  } else if (currentMode === "otp") {
    const email = emailInput.value.trim();
    const ok = await window.sendLoginCode(email);
    if (ok) {
      otpEmail = email;
      switchMode("otp_verify");
    }
  } else if (currentMode === "otp_verify") {
    const code = otpCodeInput.value.trim();
    if (code.length < 6) {
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      alert("Kripya email me aaya poora code daalein.");
      return;
    }
    const ok = await window.verifyLoginCode(otpEmail, code);
    if (ok) await celebrateIfLoggedIn();
  } else if (currentMode === "update_password") {
    const p1 = passwordInput.value;
    const p2 = confirmPassInput.value;
    if (p1 !== p2) {
      alert("Passwords match nahi ho rahe hain!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }
    window.updatePassword();
  }
}

window.switchMode = switchMode;

/* 🎉 LOGIN SUCCESS: jump + confetti, phir redirect */
let isCelebrating = false;

function launchConfetti(count = 60) {
  const colors = ["#ff5c7a", "#ffc83d", "#4ade80", "#38bdf8", "#a78bfa", "#fb923c"];
  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "confetti-piece";
    el.style.setProperty("--x", (Math.random() * 100) + "vw");
    el.style.setProperty("--c", colors[i % colors.length]);
    el.style.setProperty("--dur", (1.6 + Math.random() * 1.2) + "s");
    el.style.setProperty("--drift", ((Math.random() - 0.5) * 160) + "px");
    el.style.setProperty("--rot", ((Math.random() - 0.5) * 900) + "deg");
    el.style.animationDelay = (Math.random() * 0.35) + "s";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
}

window.celebrateLogin = function (done) {
  if (isCelebrating) return;
  isCelebrating = true;
  clearTimeout(idleTimer);
  clearTimeout(rotateInterval);
  clearAllExpressions();
  char.classList.remove("cover", "worried");
  char.classList.add("happy");
  showBadge("🎉");
  jumpOnce();
  setTimeout(jumpOnce, 600);
  launchConfetti();
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => { if (typeof done === "function") done(); }, reduce ? 500 : 1700);
};

function goAfterLogin() {
  const redirectTarget = sessionStorage.getItem("redirect_after_login");
  if (redirectTarget) {
    sessionStorage.removeItem("redirect_after_login");
    window.location.href = redirectTarget;
  } else {
    window.location.href = window.getPageUrl ? window.getPageUrl("profile.html") : "profile.html";
  }
}

async function celebrateIfLoggedIn() {
  try {
    const user = await window.getCurrentUser();
    if (user && !isCelebrating) window.celebrateLogin(goAfterLogin);
  } catch (e) { /* login fail / session nahi: kuch nahi karna */ }
}

/* 🙂 Head tilt: cursor ki taraf halka sa sir ka jhukav + shift */
function resetTilt() {
  char.style.rotate = "0deg";
  char.style.translate = "0px 0px";
}
document.addEventListener("mousemove", (e) => {
  if (char.classList.contains("cover") || isCelebrating) { resetTilt(); return; }
  const r = char.getBoundingClientRect();
  const dx = (e.clientX - (r.left + r.width / 2)) / Math.max(window.innerWidth / 2, 1);
  const dy = (e.clientY - (r.top + r.height / 2)) / Math.max(window.innerHeight / 2, 1);
  const cx = Math.max(-1, Math.min(1, dx));
  const cy = Math.max(-1, Math.min(1, dy));
  char.style.rotate = (cx * 7) + "deg";
  char.style.translate = (cx * 4) + "px " + (cy * 3) + "px";
});
document.addEventListener("mouseleave", resetTilt);

/* 👋 Page khulte hi character hello bolta hai (sirf tab jab user typing/cover me nahi) */
window.addEventListener("load", () => {
  setTimeout(() => {
    const active = document.activeElement;
    if (char.classList.contains("cover") || (active && active.tagName === "INPUT")) return;
    const waveHand = char.querySelector(".hand.right");
    if (!waveHand) return;
    waveHand.classList.add("wave-hi");
    char.classList.add("happy");
    setTimeout(() => {
      waveHand.classList.remove("wave-hi");
      char.classList.remove("happy");
    }, 2800);
  }, 700);
});
</script>
