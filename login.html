<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center; 
  align-items: center;     
  background: #e0e5ec;
  overflow-x: hidden;      
  padding: 20px;           
}

/* BACKGROUND ANIMATION */
.bg span {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(70px);
  opacity: .45;
  animation: float 10s infinite alternate;
  z-index: -1;
}
.bg span:nth-child(1) { background: #ff7a3d; top: 10%; left: 5%; }
.bg span:nth-child(2) { background: #5a2eff; bottom: 10%; right: 5%; }

@keyframes float {
  to { transform: translateY(-40px); }
}

/* WRAPPER */
.wrapper {
  position: relative;
  width: 100%;
  max-width: 380px; 
  display: flex;
  justify-content: center;
}

/* CHARACTER */
.character {
  width: 140px;
  height: 140px;
  background: #e0e5ec;
  border-radius: 50%;
  position: absolute;
  top: -70px; 
  z-index: 10;
  box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #fff;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform-origin: center bottom;
  cursor: pointer;
  animation: breathing 4s ease-in-out infinite;
}

@keyframes breathing {
  0%, 100% { transform: scale(1) translateY(0); }
  50% { transform: scale(1.02) translateY(-2px); }
}

.eye-container {
  position: absolute;
  top: 55px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  padding: 0 38px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.eye {
  width: 14px;
  height: 14px;
  background: #333;
  border-radius: 50%;
  position: relative;
  transition: transform 0.3s ease, background 0.3s ease, border 0.3s ease, height 0.3s ease;
  animation: blink 4.5s infinite;
}

@keyframes blink {
  0%, 94%, 100% { transform: scaleY(1); }
  97% { transform: scaleY(0.08); }
}

/* Soft Blended Cheeks / Blush */
.cheek {
  position: absolute;
  width: 24px;
  height: 12px;
  background: rgba(255, 122, 61, 0.2);
  border-radius: 50%;
  filter: blur(4px);
  top: 74px;
  transition: 0.3s ease;
}
.cheek.left { left: 22px; }
.cheek.right { right: 22px; }

/* Flawless SVG Natural Smile (Zero Rendering Lines) */
.mouth {
  position: absolute;
  top: 84px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 14px;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.mouth svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
.mouth path {
  stroke: #333;
  stroke-width: 3.5;
  stroke-linecap: round;
  fill: none;
  transition: stroke 0.3s ease;
}

.character.happy .mouth path {
  stroke: #28a745;
}

/* Zzz Animation for Sleep Mode */
.zzz-container {
  position: absolute;
  top: -22px;
  right: 18px;
  display: none;
  z-index: 15;
}
.character.expr-sleep .zzz-container {
  display: block;
}
.zzz-container span {
  position: absolute;
  font-weight: bold;
  color: #5a2eff;
  opacity: 0;
  animation: floatZzz 2.2s ease-in-out infinite;
}
.zzz-container span:nth-child(1) { font-size: 11px; animation-delay: 0s; left: 0px; }
.zzz-container span:nth-child(2) { font-size: 15px; animation-delay: 0.7s; left: 8px; }
.zzz-container span:nth-child(3) { font-size: 19px; animation-delay: 1.4s; left: 18px; }

@keyframes floatZzz {
  0% { transform: translateY(0px) scale(0.8); opacity: 0; }
  50% { opacity: 0.85; }
  100% { transform: translateY(-28px) scale(1.2); opacity: 0; }
}

/* Detailed Expressions */
.character.jump {
  animation: teddyJump 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes teddyJump {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-24px) scale(1.08, 0.92) rotate(3deg); }
  70% { transform: translateY(4px) scale(0.95, 1.05); }
  100% { transform: translateY(0) scale(1); }
}

.character.wiggle {
  animation: teddyWiggle 0.5s cubic-bezier(0.36, 0, 0.66, -0.56);
}
@keyframes teddyWiggle {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-10deg) scale(1.04); }
  40% { transform: rotate(10deg) scale(1.04); }
  60% { transform: rotate(-6deg); }
  80% { transform: rotate(6deg); }
}

/* 😖 Pain */
.character.expr-pain .eye { transform: rotate(45deg) scale(0.75); }
.character.expr-pain .mouth path { d: path("M2 2 Q 18 14 34 2"); }

/* 😴 Sleep (Poori tarah aankh band + Zzz) */
.character.expr-sleep .eye { height: 3px !important; border-radius: 2px !important; background: #333 !important; transform: none !important; }
.character.expr-sleep .mouth path { d: path("M8 8 Q 18 5 28 8"); }

/* 😉 Wink */
.character.expr-wink .eye.right { transform: scaleY(0.12); }
.character.expr-wink .mouth path { d: path("M2 4 Q 18 16 34 4"); transform: rotate(-4deg); }

/* 😵 Dizzy */
.character.expr-dizzy { animation: teddySpin 0.6s ease; }
@keyframes teddySpin {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(15deg) scale(0.96); }
}
.character.expr-dizzy .eye { background: transparent; border: 2px dashed #333; }
.character.expr-dizzy .mouth path { d: path("M4 10 Q 18 2 32 10"); }

/* 😫 Tired */
.character.expr-tired .eye { transform: scaleY(0.25); }
.character.expr-tired .mouth path { d: path("M4 8 Q 18 2 32 8"); stroke: #ff4d4d; }

/* 🥴 Woozy */
.character.expr-woozy { transform: rotate(-6deg) scale(0.97); }
.character.expr-woozy .eye.left { transform: scaleY(0.35); }
.character.expr-woozy .mouth path { d: path("M6 6 Q 18 14 30 6"); }

/* 🧐 Monocle / Curious */
.character.expr-monocle .eye-container { transform: translateX(5px) scale(0.9); }
.character.expr-monocle .mouth path { d: path("M10 6 A 4 4 0 0 1 26 6 A 4 4 0 0 1 10 6"); }

/* 🥱 Yawn */
.character.expr-yawn .eye { transform: scaleY(0.18); }
.character.expr-yawn .mouth path { d: path("M12 2 A 6 6 0 1 1 24 2 A 6 6 0 1 1 12 2"); fill: #333; stroke: none; }

/* 😗 Kiss */
.character.expr-kiss .mouth path { d: path("M14 4 A 4 4 0 1 1 22 4 A 4 4 0 1 1 14 4"); fill: #333; stroke: none; }

/* ☺️ Blush */
.character.expr-blush .cheek { background: rgba(255, 90, 140, 0.35); width: 28px; height: 14px; filter: blur(3px); }
.character.expr-blush .mouth path { d: path("M2 4 Q 18 16 34 4"); }

/* 🤩 Star / Excited */
.character.expr-star { animation: teddyExcited 0.4s ease infinite alternate; }
@keyframes teddyExcited {
  0% { transform: translateY(0) scale(1); }
  100% { transform: translateY(-8px) scale(1.05); }
}
.character.expr-star .eye { background: #ffaa00; border-radius: 30%; }
.character.expr-star .mouth path { d: path("M2 4 Q 18 16 34 4"); }

/* 😛 Silly */
.character.expr-silly .eye.left { transform: scaleY(0.3); }
.character.expr-silly .mouth path { d: path("M12 2 C 12 12, 24 12, 24 2 Z"); fill: #ff4d4d; stroke: none; }

/* 🥺 Pleading */
.character.expr-pleading .eye { transform: scale(1.2); }
.character.expr-pleading .mouth path { d: path("M6 8 Q 18 2 30 8"); }

/* 🤫 Shushing */
.character.expr-shush .mouth path { d: path("M14 7 A 3 3 0 1 1 20 7 A 3 3 0 1 1 14 7"); fill: #333; stroke: none; }

.hand {
  width: 50px;
  height: 20px;
  background: #e0e5ec;
  border-radius: 20px;
  position: absolute;
  top: 60px;
  opacity: 0;
  box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #fff;

}
.hand.left { left: -5px; transform: rotate(-25deg); }
.hand.right { right: -5px; transform: rotate(25deg); }

/* ANIMATION STATES (EYE COVER LOGIC) */
.cover .eye-container { opacity: 0; }
.cover .cheek { opacity: 0.1; }
.cover .hand { opacity: 1; }

.wrong .mouth path {
  d: path("M2 10 Q 18 2 34 10");
  stroke: #ff4d4d;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  50% { transform: translateX(10px); }
  75% { transform: translateX(-10px); }
}
.shake { animation: shake 0.4s ease-in-out; }

/* CARD */
.card {
  width: 100%; 
  padding: 90px 25px 30px;
  border-radius: 28px;
  background: #e0e5ec;
  box-shadow: 18px 18px 30px #b8bec7, -18px -18px 30px #fff;

h1 { font-size: 24px; color: #444; margin-bottom: 5px; }
h2 { font-size: 14px; margin-bottom: 20px; color: #777; font-weight: 400; }

input {

/* PASSWORD WRAPPER WITH EYE TOGGLE */
.password-field-wrapper {
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  margin-bottom: 12px;
}
.password-field-wrapper input {

}
.eye-toggle-btn {

}
.eye-toggle-btn svg {

}

/* Password Strength Indicator */
.password-strength-indicator {
  font-size: 12px;
  text-align: left;

  margin-bottom: 12px;
  padding-left: 5px;

}
.strength-weak { color: #ff4d4d; }
.strength-good { color: #ffa500; }

#confirmPassWrapper {
  display: none;

#confirmPassWrapper.visible {

button.primary-btn {

}

button.primary-btn:active {
  box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #fff;

.google-btn {

}

.auth-links {
  margin-top: 20px;

}

.auth-links a {
  color: #5a2eff;

}

@media (max-width: 400px) {
  .card { padding: 80px 20px 25px; }
  .character { width: 120px; height: 120px; top: -60px; }
}
</style>

<script>
/* Anti-DevTools Protection Script */
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('keydown', (e) => {
  if (e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
      (e.ctrlKey && e.key === 'U')) {
    e.preventDefault();
    return false;
  }
});

let currentMode = "login"; 

const fullNameInput = document.getElementById("fullName");
const phoneInput = document.getElementById("phone");
const pincodeInput = document.getElementById("pincode");
const passwordInput = document.getElementById("password");
const confirmPassInput = document.getElementById("confirmPassword");
const confirmPassWrapper = document.getElementById("confirmPassWrapper");
const emailInput = document.getElementById("email");

const char = document.getElementById("char");
const card = document.getElementById("authCard");
const titleText = document.getElementById("titleText");
const subText = document.getElementById("subText");
const mainBtn = document.getElementById("mainBtn");
const googleBtn = document.getElementById("googleBtn");
const googleBtnText = document.getElementById("googleBtnText");
const linkBox = document.getElementById("linkBox");
const passwordStrengthEl = document.getElementById("passwordStrength");

const leftEye = document.getElementById("leftEye");
const rightEye = document.getElementById("rightEye");
const mouthPath = document.querySelector(".mouth path");

/* Smooth Cursor Movement Tracking for Character Eyes */
document.addEventListener("mousemove", (e) => {
  if (char.classList.contains("cover")) return;
  const eyes = [leftEye, rightEye];
  eyes.forEach(eye => {
    if (!eye) return;
    const rect = eye.getBoundingClientRect();
    const eyeCenterX = rect.left + rect.width / 2;
    const eyeCenterY = rect.top + rect.height / 2;
    
    const angle = Math.atan2(e.clientY - eyeCenterY, e.clientX - eyeCenterX);
    const distance = Math.min(3.5, Math.hypot(e.clientX - eyeCenterX, e.clientY - eyeCenterY) / 25);
    
    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;
    
    eye.style.transform = `translate(${x}px, ${y}px)`;
  });
});

const allExpressions = [
  "expr-pain", "expr-sleep", "expr-wink", 
  "expr-dizzy", "expr-tired", "expr-woozy", "expr-monocle", 
  "expr-yawn", "expr-kiss", "expr-blush", "jump", "wiggle",
  "expr-star", "expr-silly", "expr-pleading", "expr-shush"
];

function clearAllExpressions() {
  char.classList.remove(...allExpressions);
  if (mouthPath) mouthPath.setAttribute("d", "M2 4 Q 18 16 34 4");
}

/* Tap / Click Reactions */
char.addEventListener("click", () => {
  if (char.classList.contains("cover")) return;
  clearAllExpressions();
  const randomExpr = allExpressions[Math.floor(Math.random() * allExpressions.length)];
  void char.offsetWidth; 
  char.classList.add(randomExpr);
  
  setTimeout(() => {
    char.classList.remove(randomExpr);
  }, 700);
});

/* 5 Seconds Idle Waiting & Rotating Expressions (Sleep gets 15 seconds stay) */
let idleTimer = null;
let rotateInterval = null;

function resetIdleTimer() {
  clearTimeout(idleTimer);
  clearTimeout(rotateInterval);
  clearAllExpressions();
  
  idleTimer = setTimeout(() => {
    const activeEl = document.activeElement;
    const isTyping = activeEl && activeEl.tagName === 'INPUT';
    
    if (!char.classList.contains("cover") && !isTyping) {
      triggerExpressionWithCustomTiming();
    }
  }, 5000);
}

function triggerExpressionWithCustomTiming() {
  const activeEl = document.activeElement;
  if (activeEl && activeEl.tagName === 'INPUT' || char.classList.contains("cover")) return;

  clearAllExpressions();
  const randomExpr = allExpressions[Math.floor(Math.random() * allExpressions.length)];
  void char.offsetWidth;
  char.classList.add(randomExpr);

  // If sleep, hold for 15 seconds, else hold for 4 seconds
  const displayDuration = (randomExpr === "expr-sleep") ? 15000 : 4000;

  rotateInterval = setTimeout(() => {
    const currentActive = document.activeElement;
    const stillTyping = currentActive && currentActive.tagName === 'INPUT';
    
    if (!char.classList.contains("cover") && !stillTyping) {
      triggerExpressionWithCustomTiming();
    } else {
      clearAllExpressions();
    }
  }, displayDuration);
}

const allInputs = document.querySelectorAll("input");
allInputs.forEach(input => {
  input.addEventListener("focus", () => {
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  });
  input.addEventListener("input", () => {
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  });
  input.addEventListener("blur", () => {
    resetIdleTimer();
  });
});

document.addEventListener("keydown", resetIdleTimer);
document.addEventListener("click", (e) => {
  if (e.target.tagName !== 'INPUT') {
    resetIdleTimer();
  }
});
document.addEventListener("touchstart", resetIdleTimer);

/* Toggle Password Visibility */
function togglePassVisibility(inputId, btnEl) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const isPassword = input.type === "password";
  input.type = isPassword ? "text" : "password";

  if (isPassword) {
    char.classList.add("cover");
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  } else {
    char.classList.remove("cover");
    resetIdleTimer();
  }

  const eyeOpen = `<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>`;
  const eyeClosed = `<svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>`;

  btnEl.innerHTML = isPassword ? eyeClosed : eyeOpen;
}

/* Password Strength & Character Happiness */
function handlePasswordTyping() {
  const val = passwordInput.value;

  if (currentMode === "signup" || currentMode === "update_password") {
    if (val.length > 0) {
      confirmPassWrapper.classList.add("visible");
      passwordStrengthEl.style.display = "block";
      
      let strengthText = "";
      let strengthClass = "";
      
      if (val.length < 6) {
        strengthText = "Strength: Weak (Too short)";
        strengthClass = "strength-weak";
        char.classList.remove("happy");
      } else {
        const hasLetter = /[a-zA-Z]/.test(val);
        const hasNumber = /[0-9]/.test(val);
        const hasSpecial = /[^A-Za-z0-9]/.test(val);
        
        if (val.length >= 8 && hasLetter && hasNumber && hasSpecial) {
          strengthText = "Strength: Strong";
          strengthClass = "strength-strong";
          char.classList.add("happy");
        } else if (val.length >= 6 && ((hasLetter && hasNumber) || hasSpecial)) {
          strengthText = "Strength: Good Enough";
          strengthClass = "strength-good";
          char.classList.remove("happy");
        } else {
          strengthText = "Strength: Weak";
          strengthClass = "strength-weak";
          char.classList.remove("happy");
        }
      }
      passwordStrengthEl.innerText = strengthText;
      passwordStrengthEl.className = "password-strength-indicator " + strengthClass;

    } else {
      confirmPassWrapper.classList.remove("visible");
      confirmPassInput.value = "";
      passwordStrengthEl.style.display = "none";
      passwordStrengthEl.innerText = "";
      char.classList.remove("happy");
    }
  }
}

/* Mode Switcher */
function switchMode(mode) {
  currentMode = mode;
  emailInput.value = "";
  passwordInput.value = "";
  confirmPassInput.value = "";
  fullNameInput.value = "";
  phoneInput.value = "";
  pincodeInput.value = "";
  confirmPassWrapper.classList.remove("visible");
  passwordStrengthEl.style.display = "none";
  passwordStrengthEl.innerText = "";
  clearTimeout(idleTimer);
  clearTimeout(rotateInterval);
  clearAllExpressions();
  char.classList.remove("happy");
  resetIdleTimer();

  if (mode === "login") {
    titleText.innerText = "Welcome Back!";
    subText.innerText = "ROITX HUB";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "flex";
    passwordInput.placeholder = "Password";
    googleBtn.style.display = "flex";
    googleBtnText.innerText = "Login with Google";
    mainBtn.innerText = "Login";
    linkBox.innerHTML = `
      <a onclick="switchMode('forgot')">Forgot Password?</a>
      <span>New here? <a onclick="switchMode('signup')">Create Account</a></span>
    `;
  } else if (mode === "signup") {
    titleText.innerText = "Join Roitx";
    subText.innerText = "CREATE ACCOUNT";
    fullNameInput.style.display = "block";
    phoneInput.style.display = "block";
    pincodeInput.style.display = "block";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "flex";
    passwordInput.placeholder = "Create Password (min 6 chars)";
    googleBtn.style.display = "flex";
    googleBtnText.innerText = "Signup with Google";
    mainBtn.innerText = "Sign Up";
    linkBox.innerHTML = `
      <span>Already have an account? <a onclick="switchMode('login')">Login</a></span>
    `;
  } else if (mode === "forgot") {
    titleText.innerText = "Reset Password";
    subText.innerText = "ENTER YOUR EMAIL";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "block";
    document.getElementById("mainPassWrapper").style.display = "none";
    googleBtn.style.display = "none";
    mainBtn.innerText = "Send Reset Link";
    linkBox.innerHTML = `
      <span>Remembered Password? <a onclick="switchMode('login')">Back to Login</a></span>
    `;
  } else if (mode === "update_password") {
    titleText.innerText = "New Password";
    subText.innerText = "SET YOUR NEW PASSWORD";
    fullNameInput.style.display = "none";
    phoneInput.style.display = "none";
    pincodeInput.style.display = "none";
    emailInput.style.display = "none";
    document.getElementById("mainPassWrapper").style.display = "flex";
    passwordInput.placeholder = "Enter New Password";
    googleBtn.style.display = "none";
    mainBtn.innerText = "Save New Password";
    linkBox.innerHTML = `<span><a onclick="switchMode('login')">Cancel & Login</a></span>`;
  }
}

function triggerGoogleAuth() {
  const forceConsent = currentMode === "signup";
  window.signInWithGoogle(forceConsent);
}

document.addEventListener("DOMContentLoaded", async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const isReset = urlParams.get('reset');
  
  const hashString = window.location.hash.substring(1);
  const hashParams = new URLSearchParams(hashString);
  const type = hashParams.get('type');

  if (isReset || type === 'recovery') {
    switchMode("update_password");
    return;
  }

  const user = await window.getCurrentUser();
  if (user) {
    const redirectTarget = sessionStorage.getItem("redirect_after_login");
    if (redirectTarget) {
      sessionStorage.removeItem("redirect_after_login");
      window.location.href = redirectTarget;
    } else {
      window.location.href = window.getPageUrl ? window.getPageUrl("profile.html") : "profile.html";
    }
  }

  resetIdleTimer();
});

passwordInput.addEventListener("focus", () => {
  if (passwordInput.type === "password") {
    char.classList.add("cover");
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  }
});
passwordInput.addEventListener("blur", () => {
  char.classList.remove("cover");
  resetIdleTimer();
});

confirmPassInput.addEventListener("focus", () => {
  if (confirmPassInput.type === "password") {
    char.classList.add("cover");
    clearTimeout(idleTimer);
    clearTimeout(rotateInterval);
    clearAllExpressions();
  }
});
confirmPassInput.addEventListener("blur", () => {
  char.classList.remove("cover");
  resetIdleTimer();
});

window.triggerErrorAnim = () => {
  char.classList.add("wrong");
  card.classList.add("shake");
  setTimeout(() => {
    char.classList.remove("wrong");
    card.classList.remove("shake");
  }, 1500);
};

async function handleAuthSubmit() {
  if (currentMode === "login") {
    await window.loginUser();
  } else if (currentMode === "signup") {
    const fullName = fullNameInput.value.trim();
    const phone = phoneInput.value.trim();
    const pincode = pincodeInput.value.trim();
    const email = emailInput.value.trim();
    const p1 = passwordInput.value;
    const p2 = confirmPassInput.value;

    if (!fullName || !phone || !pincode || !email || !p1) {
      alert("Kripya saare mandatory fields ko bharein!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (phone.length !== 10) {
      alert("Kripya valid 10-digit Phone Number daalein.");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (pincode.length !== 6) {
      alert("Kripya valid 6-digit Area Pincode daalein.");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (p1.length < 6) {
      alert("Password minimum 6 characters ka hona chahiye!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    if (p1 !== p2) {
      alert("Passwords match nahi ho rahe hain!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }

    await window.signUpUser();
  } else if (currentMode === "forgot") {
    window.sendResetLink();
  } else if (currentMode === "update_password") {
    const p1 = passwordInput.value;
    const p2 = confirmPassInput.value;
    if (p1 !== p2) {
      alert("Passwords match nahi ho rahe hain!");
      if (window.triggerErrorAnim) window.triggerErrorAnim();
      return;
    }
    window.updatePassword();
  }
}

window.switchMode = switchMode;
</script>
