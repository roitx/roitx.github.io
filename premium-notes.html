    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: rgba(17, 24, 39, 0.75);
            --accent-cyan: #00d2ff;
            --accent-blue: #0072ff;
            --accent-purple: #7928ca;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Radial Background Glows */
        .bg-glow-1 {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(121, 40, 202, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Base Container */
        .notes-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(12px, 3vw, 24px);
        }

        /* Glass Header Box */
        .header-box {
            text-align: center;
            margin-bottom: 20px;
            padding: clamp(16px, 4vw, 28px) clamp(14px, 3vw, 20px);
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid var(--border-glow);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
        }

        .header-box h1 {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 800;
            margin: 0;
            color: #fff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-box h1 span {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-box p {
            font-size: clamp(0.78rem, 2.5vw, 0.9rem);
            color: var(--text-muted);
            margin: 6px 0 0 0;
        }

        /* Search & Filter Bar Section */
        .filter-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        .search-box-container {
            position: relative;
            width: 100%;
        }

        .search-box-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-cyan);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            background: rgba(13, 18, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 11px 14px 11px 40px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
            background: #0f1624;
        }

        .filter-pills {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .filter-pills::-webkit-scrollbar {
            display: none;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .pill-btn.active, .pill-btn:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Responsive Ultra-Compact Grid */
        .compact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            gap: clamp(10px, 2vw, 16px);
        }

        @media (min-width: 550px) {
            .compact-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            }
        }

        .mini-card {
            background: linear-gradient(145deg, rgba(18, 24, 38, 0.9), rgba(26, 35, 51, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            box-sizing: border-box;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .mini-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 210, 255, 0.35);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.15);
        }

        .card-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
        }

        .badge-tag {
            font-size: 0.62rem;
            font-weight: 700;
            background: rgba(0, 210, 255, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 210, 255, 0.25);
            padding: 2px 8px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .card-top-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Top-Right Eye & Share Buttons */
        .icon-btn-action {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
            font-size: 0.72rem;
        }

        .icon-btn-action:hover {
            color: var(--accent-cyan);
            background: rgba(0, 210, 255, 0.18);
            border-color: rgba(0, 210, 255, 0.4);
        }

        .card-title {
            font-size: clamp(0.85rem, 2vw, 0.95rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .chapter-sub {
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .price-tag {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 210, 255, 0.3);
        }

        /* Sleek Button Styles */
        .btn-mini {
            width: 100%;
            padding: 9px 0;
            font-size: 0.78rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-read { 
            background: linear-gradient(135deg, #00c6ff, #0072ff); 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(0, 198, 255, 0.3);
        }

        .btn-read:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 198, 255, 0.45);
        }

        .btn-unlock { 
            background: linear-gradient(135deg, #7928ca, #00d2ff); 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(121, 40, 202, 0.35);
        }

        .btn-unlock:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(121, 40, 202, 0.5);
        }

        .btn-pending {
            background: rgba(255, 171, 0, 0.12);
            color: #ffab00;
            border: 1px dashed rgba(255, 171, 0, 0.4);
            cursor: not-allowed;
            pointer-events: none;
            font-size: 0.75rem;
        }

        /* Payment Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal-content {
            background: #111622;
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 16px 45px rgba(0, 210, 255, 0.25);
            color: #fff;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .qr-container {
            background: #ffffff;
            padding: 10px;
            border-radius: 14px;
            display: inline-block;
            margin: 12px 0;
            box-shadow: 0 4px 18px rgba(255,255,255,0.12);
        }

        .qr-img {
            width: 160px;
            height: 160px;
            display: block;
        }

        .btn-upi-app {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.82rem;
            padding: 11px;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 4px 14px rgba(40, 167, 69, 0.4);
            transition: all 0.2s ease;
        }

        .btn-upi-app:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(40, 167, 69, 0.55);
        }

        .copy-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #fff;
            background: rgba(255,255,255,0.08);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-utr {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid rgba(0, 210, 255, 0.35);
            background: #090d16;
            color: var(--accent-cyan);
            font-size: 0.92rem;
            font-weight: 700;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            letter-spacing: 1px;
        }

        .input-utr::placeholder {
            color: #5fb5ff66;
            font-size: 0.78rem;
            font-weight: normal;
            letter-spacing: normal;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="notes-container">
        <!-- Glass Header -->
        <div class="header-box">
            <h1><i class="fa-solid fa-crown" style="color: #00d2ff;"></i> PM-Roit <span>Premium Notes</span></h1>
            <p>Select your chapter, search topics & unlock full study access instantly</p>
        </div>

        <!-- Filter & Search Controls -->
        <div class="filter-wrapper">
            <div class="search-box-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by title, subject or chapter..." oninput="filterNotesUI()">
            </div>
            
            <div class="filter-pills" id="filterPills">
                <button class="pill-btn active" onclick="setSubjectFilter('ALL', this)">All Notes</button>
                <button class="pill-btn" onclick="setSubjectFilter('PHYSICS', this)">Physics</button>
                <button class="pill-btn" onclick="setSubjectFilter('CHEMISTRY', this)">Chemistry</button>
                <button class="pill-btn" onclick="setSubjectFilter('BIOLOGY', this)">Biology</button>
                <button class="pill-btn" onclick="setSubjectFilter('MATHS', this)">Maths</button>
            </div>
        </div>

        <!-- Dynamic Grid -->
        <div class="compact-grid" id="notesGrid">
            <!-- Dynamic Cards Inserted Here -->
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin: 0 0 5px 0; font-size: 1.15rem; color: #fff;">Complete Payment</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Scan QR or Pay <b id="modalPrice" style="color: var(--accent-cyan);"></b></p>
            
            <div class="qr-container">
                <img id="upiQrCode" src="" alt="Payment QR Code" class="qr-img">
            </div>

            <a id="payDirectBtn" href="#" class="btn-upi-app">
                <i class="fa-solid fa-mobile-screen-button"></i>
                Tap to Open PhonePe / GPay / Paytm
            </a>

            <p style="font-size: 0.75rem; color: #aaa; margin: 8px 0;">
                UPI ID: <span class="copy-box" onclick="copyUpiId()"><b style="color: #fff;">9199364179-3@ibl</b> <i class="fa-regular fa-copy" style="color: var(--accent-cyan);"></i></span>
            </p>

            <input type="text" id="utrInput" class="input-utr" placeholder="Enter 12-digit UTR / Trans ID" maxlength="12" inputmode="numeric">

            <div class="modal-actions">
                <button class="btn-mini btn-unlock" onclick="submitManualPayment()">
                    <i class="fa-solid fa-circle-check"></i> Confirm Payment
                </button>
                <button class="btn-mini btn-cancel" onclick="document.getElementById('paymentModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
    const MY_UPI_ID = "9199364179-3@ibl";
    let currentUser = null;
    let purchases = [];
    let orderStatuses = {}; 
    let selectedNoteForPay = null;
    const loadedNotesMap = {};
    let cachedNotesList = [];
    let activeSubjectFilter = 'ALL';

    window.onload = async () => {
        if (typeof window.getCurrentUser === "function") {
            currentUser = await window.getCurrentUser();
        }

        if (currentUser) {
            const { data: purchaseData } = await window.supabaseClient
                .from('user_purchases')
                .select('note_id')
                .eq('user_id', currentUser.id);
            
            purchases = (purchaseData || []).map(p => String(p.note_id));

            const { data: ordersData } = await window.supabaseClient
                .from('user_orders')
                .select('note_id, status')
                .eq('user_email', currentUser.email);

            if (ordersData) {
                ordersData.forEach(o => {
                    const nId = String(o.note_id);
                    orderStatuses[nId] = o.status;
                    if (o.status === 'approved' && !purchases.includes(nId)) {
                        purchases.push(nId);
                    }
                });
            }

            setupRealtimeOrderListener();
        }

        loadNotes();
    };

    function setupRealtimeOrderListener() {
        if (!currentUser || !window.supabaseClient) return;

        window.supabaseClient
            .channel('public:user_orders')
            .on('postgres_changes', { 
                event: 'UPDATE', 
                schema: 'public', 
                table: 'user_orders',
                filter: `user_email=eq.${currentUser.email}`
            }, payload => {
                const updatedOrder = payload.new;
                if (updatedOrder) {
                    const noteIdStr = String(updatedOrder.note_id);
                    orderStatuses[noteIdStr] = updatedOrder.status;
                    
                    if (updatedOrder.status === 'approved') {
                        if (!purchases.includes(noteIdStr)) {
                            purchases.push(noteIdStr);
                        }
                    }
                    renderNotesGrid(cachedNotesList); 
                }
            })
            .subscribe();
    }

    async function loadNotes() {
        const { data: notes, error } = await window.supabaseClient
            .from('premium_notes')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error("Error loading notes:", error);
            return;
        }

        cachedNotesList = notes || [];
        cachedNotesList.forEach(note => {
            loadedNotesMap[note.id] = note;
        });

        generateDynamicSubjectPills(cachedNotesList);
        renderNotesGrid(cachedNotesList);
    }

    // Dynamic Subject Filter Pill Generator
    function generateDynamicSubjectPills(notes) {
        const pillsContainer = document.getElementById('filterPills');
        if (!pillsContainer) return;

        // Unique subjects extract karein aur format karein
        const uniqueSubjects = new Set();
        notes.forEach(n => {
            if (n.subject && n.subject.trim() !== '') {
                uniqueSubjects.add(n.subject.trim().toUpperCase());
            }
        });

        let html = `<button class="pill-btn ${activeSubjectFilter === 'ALL' ? 'active' : ''}" onclick="setSubjectFilter('ALL', this)">All Notes</button>`;

        uniqueSubjects.forEach(subj => {
            const isActive = activeSubjectFilter === subj ? 'active' : '';
            // Capitalize First Letter for display
            const formattedSubj = subj.charAt(0) + subj.slice(1).toLowerCase();
            html += `<button class="pill-btn ${isActive}" onclick="setSubjectFilter('${subj}', this)">${formattedSubj}</button>`;
        });

        pillsContainer.innerHTML = html;
    }

    function setSubjectFilter(subj, btnElem) {
        activeSubjectFilter = subj;
        document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
        if (btnElem) btnElem.classList.add('active');
        filterNotesUI();
    }

    function filterNotesUI() {
        const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();

        const filtered = cachedNotesList.filter(note => {
            const titleStr = (note.title || '').toLowerCase();
            const subjStr = (note.subject || '').toLowerCase();
            const chapStr = (note.chapter_no || '').toLowerCase();

            const matchesSearch = !query || titleStr.includes(query) || subjStr.includes(query) || chapStr.includes(query);
            const matchesSubject = activeSubjectFilter === 'ALL' || subjStr === activeSubjectFilter.toLowerCase();

            return matchesSearch && matchesSubject;
        });

        renderNotesGrid(filtered);
    }

    function renderNotesGrid(notes) {
        const container = document.getElementById('notesGrid');
        container.innerHTML = "";

        if (!notes || notes.length === 0) {
            container.innerHTML = `<div style="color:#8a99ad; grid-column:1/-1; text-align:center; padding: 40px 10px; font-size:0.9rem;">
                <i class="fa-solid fa-folder-open" style="font-size:2rem; display:block; margin-bottom:8px; color:var(--accent-cyan);"></i>
                No premium notes found matching your criteria.
            </div>`;
            return;
        }

        notes.forEach(note => {
            const noteIdStr = String(note.id);
            
            const isApproved = purchases.includes(noteIdStr) || orderStatuses[noteIdStr] === 'approved';
            const isPending = orderStatuses[noteIdStr] === 'pending';

            let actionBtnHtml = '';
            if (isApproved) {
                actionBtnHtml = `<button class="btn-mini btn-read" onclick="openInViewer(${note.id})"><i class="fa-solid fa-book-open"></i> Read Note</button>`;
            } else if (isPending) {
                actionBtnHtml = `<button class="btn-mini btn-pending" disabled><i class="fa-regular fa-clock"></i> Pending Verification</button>`;
            } else {
                actionBtnHtml = `<button class="btn-mini btn-unlock" onclick="openPaymentModal(${note.id})"><i class="fa-solid fa-bolt"></i> Unlock Note</button>`;
            }

            let previewIconHtml = !isApproved 
                ? `<div class="icon-btn-action" title="Preview Note" onclick="openInViewer(${note.id})"><i class="fa-regular fa-eye"></i></div>`
                : `<div class="icon-btn-action" style="color:#2ed573; border-color:rgba(46,213,115,0.3); background:rgba(46,213,115,0.1); cursor:default;"><i class="fa-solid fa-check"></i></div>`;

            let shareIconHtml = `<div class="icon-btn-action" title="Share Note" onclick="shareNote(${note.id})"><i class="fa-solid fa-share-nodes"></i></div>`;

            container.innerHTML += `
                <div class="mini-card">
                    <div class="card-header-line">
                        <span class="badge-tag">${note.class_no || ''} | ${note.subject || ''}</span>
                        <div class="card-top-actions">
                            ${previewIconHtml}
                            ${shareIconHtml}
                        </div>
                    </div>
                    
                    <div>
                        <div class="card-title" title="${note.title}">${note.title}</div>
                        <div class="meta-info-row">
                            <span class="chapter-sub">${note.chapter_no || 'Chapter'}</span>
                            <span class="price-tag">₹${note.price}</span>
                        </div>
                    </div>
                    
                    ${actionBtnHtml}
                </div>
            `;
        });
    }

    function shareNote(noteId) {
        const note = loadedNotesMap[noteId];
        if (!note) return;

        const shareText = `📚 Check out this premium note: *${note.title}* (${note.subject || 'Study Material'}) on PM-Roit!`;
        if (navigator.share) {
            navigator.share({
                title: note.title,
                text: shareText,
                url: window.location.href
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(`${shareText}\n${window.location.href}`);
            alert("🔗 Note link copied to clipboard!");
        }
    }

    function openInViewer(noteId) {
        const note = loadedNotesMap[noteId];
        if (!note) return;

        const noteIdStr = String(note.id);
        const isApproved = purchases.includes(noteIdStr) || orderStatuses[noteIdStr] === 'approved';
        let targetFilePath = note.file_path || note.full_pdf_url || '';

        let rawClass = note.class_no ? String(note.class_no) : '';
        let classDigits = rawClass.replace(/\D/g, ''); 
        const classPart = classDigits ? classDigits : rawClass;

        const subjectPart = note.subject ? note.subject.toUpperCase() : '';
        const titlePart = note.title || 'Note';
        const prefixSymbol = "💎";
        
        const descriptiveName = [prefixSymbol, classPart, subjectPart, titlePart].filter(Boolean).join(' • ');

        const cleanPath = encodeURIComponent(targetFilePath);
        const cleanName = encodeURIComponent(descriptiveName);

        if (typeof trackActivityLocally === "function") {
            trackActivityLocally({
                title: descriptiveName,
                url: targetFilePath,
                meta: "Notes Viewer",
                isPremium: true,
                isPurchased: isApproved
            }, isApproved);
        }
        
        let url = `notes-viewer.html?path=${cleanPath}&name=${cleanName}&type=premium&status=premium`;
        if (isApproved) {
            url += `&purchased=true`;
        }

        window.location.href = url;
    }

    async function openPaymentModal(noteId) {
        const note = loadedNotesMap[noteId];
        if (!note) return;

        if (typeof window.getCurrentUser === "function") {
            currentUser = await window.getCurrentUser();
        }
        
        if (!currentUser) {
            alert("🔒 Unlock karne ke liye pehle login karein!");
            sessionStorage.setItem("redirect_after_login", window.location.href);
            const loginUrl = typeof window.getPageUrl === "function" ? window.getPageUrl("login.html") : "login.html";
            window.location.href = loginUrl;
            return;
        }

        selectedNoteForPay = note;
        document.getElementById('modalTitle').innerText = "Pay for " + note.title;
        document.getElementById('modalPrice').innerText = "₹" + note.price;
        
        const upiUri = `upi://pay?pa=${encodeURIComponent(MY_UPI_ID)}&pn=PM-Roit&am=${note.price}&cu=INR&tn=${encodeURIComponent('Note: ' + note.title)}`;
        
        document.getElementById('payDirectBtn').href = upiUri;

        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUri)}`;
        document.getElementById('upiQrCode').src = qrUrl;
        
        document.getElementById('paymentModal').style.display = 'flex';
    }

    function copyUpiId() {
        navigator.clipboard.writeText(MY_UPI_ID);
        alert("📋 UPI ID Copied to Clipboard!");
    }

    async function submitManualPayment() {
        const utr = document.getElementById('utrInput').value.trim();
        if (!/^\d{12}$/.test(utr)) {
            alert("⚠️ Kripya 12-digit ka valid UTR / Transaction number darj karein!");
            return;
        }

        if (!selectedNoteForPay || !currentUser) {
            alert("Something went wrong. Refresh and try again.");
            return;
        }

        const { data: profile } = await window.supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', currentUser.id)
            .single();

        const orderPayload = {
            user_id: currentUser.id,
            user_email: currentUser.email,
            note_id: selectedNoteForPay.id,
            note_title: selectedNoteForPay.title,
            amount: selectedNoteForPay.price,
            utr_code: utr,
            status: 'pending',
            user_name: profile?.full_name || '',
            user_phone: profile?.phone || '',
            target_class: profile?.target_class || '',
            stream: profile?.stream || '',
            institution: profile?.institution || '',
            city: profile?.city || '',
            state: profile?.state || '',
            avatar_url: profile?.avatar_url || ''
        };

        const { error: orderError } = await window.supabaseClient
            .from('user_orders')
            .insert([orderPayload]);

        if (orderError) {
            alert("Order submit nahi ho paya: " + orderError.message);
        } else {
            alert("🎉 Payment request submit ho gayi hai! Verification ke baad note unlock ho jayega.");
            orderStatuses[String(selectedNoteForPay.id)] = 'pending';
            document.getElementById('paymentModal').style.display = 'none';
            document.getElementById('utrInput').value = '';
            renderNotesGrid(cachedNotesList);
        }
    }
</script>
