<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-Roit | Premium Notes Hub</title>
    <link rel="stylesheet" href="premium.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        /* Base Container */
        .notes-container {
            max-width: 950px;
            margin: 0 auto;
            padding: 15px 10px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 20px;
            padding: 18px 15px;
            background: rgba(17, 22, 34, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header-box h1 {
            font-size: 1.3rem;
            margin: 0;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .header-box span {
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.4);
        }

        .header-box p {
            font-size: 0.8rem;
            color: #8a99ad;
            margin-top: 4px;
        }

        /* Responsive Ultra-Compact Grid */
        .compact-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 600px) {
            .compact-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 14px;
            }
        }

        .mini-card {
            background: linear-gradient(145deg, #121826, #1a2333);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            position: relative;
            box-sizing: border-box;
        }

        .card-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
        }

        .badge-tag {
            font-size: 0.6rem;
            font-weight: 700;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.2);
            padding: 2px 6px;
            border-radius: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 75%;
            text-transform: uppercase;
        }

        /* Top-Right Eye Only Preview Icon Button */
        .icon-btn-preview {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .icon-btn-preview:hover {
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.3);
        }

        .icon-btn-preview svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .chapter-sub {
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .price-tag {
            font-size: 0.92rem;
            font-weight: 800;
            color: #00d2ff;
        }

        /* Sleek Button Styles */
        .btn-mini {
            width: 100%;
            padding: 8px 0;
            font-size: 0.78rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .btn-mini svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
        }

        .btn-read { 
            background: linear-gradient(135deg, #00c6ff, #0072ff); 
            color: #fff; 
            box-shadow: 0 3px 10px rgba(0, 198, 255, 0.25);
        }

        .btn-unlock { 
            background: linear-gradient(135deg, #7928ca, #00d2ff); 
            color: #fff; 
            box-shadow: 0 3px 10px rgba(121, 40, 202, 0.25);
        }

        /* Clean Pending State (Only Clock Icon + Short Text) */
        .btn-pending {
            background: rgba(255, 171, 0, 0.12);
            color: #ffab00;
            border: 1px dashed rgba(255, 171, 0, 0.4);
            cursor: not-allowed;
            pointer-events: none;
            font-size: 0.75rem;
        }

        /* Payment Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #111622;
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 18px;
            padding: 22px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 210, 255, 0.25);
            color: #fff;
        }

        .qr-container {
            background: #ffffff;
            padding: 10px;
            border-radius: 14px;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        .qr-img {
            width: 165px;
            height: 165px;
            display: block;
        }

        .btn-upi-app {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.82rem;
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
            box-shadow: 0 4px 14px rgba(40, 167, 69, 0.4);
            transition: all 0.2s ease;
        }

        .btn-upi-app svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .copy-box {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #fff;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .copy-box svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #00d2ff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .input-utr {
            width: 100%;
            padding: 11px 12px;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid rgba(0, 210, 255, 0.3);
            background: #090d16;
            color: #00d2ff;
            font-size: 0.92rem;
            font-weight: 600;
            text-align: center;
            box-sizing: border-box;
            outline: none;
        }

        .input-utr::placeholder {
            color: #5fb5ff66;
            font-size: 0.8rem;
            font-weight: normal;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="notes-container">
        <div class="header-box">
            <h1>PM-Roit <span>Premium Notes</span></h1>
            <p>Select your chapter and unlock full study access</p>
        </div>

        <div class="compact-grid" id="notesGrid">
            <!-- Dynamic Cards -->
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin: 0 0 5px 0; font-size: 1.1rem; color: #fff;">Complete Payment</h3>
            <p style="font-size: 0.85rem; color: #8a99ad; margin: 0;">Scan or Pay <b id="modalPrice" style="color:#00d2ff;"></b></p>
            
            <div class="qr-container">
                <img id="upiQrCode" src="" alt="Payment QR Code" class="qr-img">
            </div>

            <a id="payDirectBtn" href="#" class="btn-upi-app">
                <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                Tap to Open PhonePe / GPay / Paytm
            </a>

            <p style="font-size: 0.75rem; color: #aaa; margin: 6px 0;">
                UPI ID: <span class="copy-box" onclick="copyUpiId()"><b style="color: #fff;">9199364179-3@ibl</b> <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></span>
            </p>

            <input type="text" id="utrInput" class="input-utr" placeholder="Enter 12-digit UTR / Trans ID" maxlength="20">

            <div class="modal-actions">
                <button class="btn-mini btn-unlock" onclick="submitManualPayment()">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> Confirm
                </button>
                <button class="btn-mini btn-cancel" onclick="document.getElementById('paymentModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const MY_UPI_ID = "9199364179-3@ibl";
        let currentUser = null;
        let purchases = [];
        let orderStatuses = {}; 
        let selectedNoteForPay = null;
        const loadedNotesMap = {};

        window.onload = async () => {
            if (typeof window.getCurrentUser === "function") {
                currentUser = await window.getCurrentUser();
            }

            if (currentUser) {
                const { data: purchaseData } = await window.supabaseClient
                    .from('user_purchases')
                    .select('note_id')
                    .eq('user_id', currentUser.id);
                
                purchases = (purchaseData || []).map(p => String(p.note_id));

                const { data: ordersData } = await window.supabaseClient
                    .from('user_orders')
                    .select('note_id, status')
                    .eq('user_email', currentUser.email);

                if (ordersData) {
                    ordersData.forEach(o => {
                        const nId = String(o.note_id);
                        orderStatuses[nId] = o.status;
                        if (o.status === 'approved' && !purchases.includes(nId)) {
                            purchases.push(nId);
                        }
                    });
                }

                setupRealtimeOrderListener();
            }

            loadNotes();
        };

        function setupRealtimeOrderListener() {
            if (!currentUser || !window.supabaseClient) return;

            window.supabaseClient
                .channel('public:user_orders')
                .on('postgres_changes', { 
                    event: 'UPDATE', 
                    schema: 'public', 
                    table: 'user_orders',
                    filter: `user_email=eq.${currentUser.email}`
                }, payload => {
                    const updatedOrder = payload.new;
                    if (updatedOrder) {
                        const noteIdStr = String(updatedOrder.note_id);
                        orderStatuses[noteIdStr] = updatedOrder.status;
                        
                        if (updatedOrder.status === 'approved') {
                            if (!purchases.includes(noteIdStr)) {
                                purchases.push(noteIdStr);
                            }
                        }
                        loadNotes(); 
                    }
                })
                .subscribe();
        }

        async function loadNotes() {
            const { data: notes, error } = await window.supabaseClient
                .from('premium_notes')
                .select('*')
                .order('id', { ascending: false });

            const container = document.getElementById('notesGrid');
            container.innerHTML = "";

            if (!notes || notes.length === 0) {
                container.innerHTML = "<p style='color:#888; grid-column:1/-1; text-align:center;'>No notes uploaded yet.</p>";
                return;
            }

            notes.forEach(note => {
                const noteIdStr = String(note.id);
                loadedNotesMap[note.id] = note;
                
                const isApproved = purchases.includes(noteIdStr) || orderStatuses[noteIdStr] === 'approved';
                const isPending = orderStatuses[noteIdStr] === 'pending';

                const readIconSvg = `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>`;
                const eyeIconSvg = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
                const unlockIconSvg = `<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`;
                const clockIconSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 16 14"></polyline></svg>`;

                // Action Button logic (Unlock / Pending / Read)
                let actionBtnHtml = '';
                if (isApproved) {
                    actionBtnHtml = `<button class="btn-mini btn-read" onclick="openInViewer(${note.id})">${readIconSvg} Read Note</button>`;
                } else if (isPending) {
                    actionBtnHtml = `<button class="btn-mini btn-pending" disabled>${clockIconSvg} Pending</button>`;
                } else {
                    actionBtnHtml = `<button class="btn-mini btn-unlock" onclick="openPaymentModal(${note.id})">${unlockIconSvg} Unlock Note</button>`;
                }

                // Eye Icon Only for Preview on Top-Right
                let previewIconHtml = !isApproved 
                    ? `<div class="icon-btn-preview" title="Preview Note" onclick="openInViewer(${note.id})">${eyeIconSvg}</div>`
                    : `<div class="icon-btn-preview" style="color:#2ed573; border-color:rgba(46,213,115,0.3); background:rgba(46,213,115,0.1); cursor:default;">✓</div>`;

                container.innerHTML += `
                    <div class="mini-card">
                        <div class="card-header-line">
                            <span class="badge-tag">${note.class_no || ''} | ${note.subject || ''}</span>
                            ${previewIconHtml}
                        </div>
                        
                        <div>
                            <div class="card-title" title="${note.title}">${note.title}</div>
                            <div class="meta-info-row">
                                <span class="chapter-sub">${note.chapter_no || 'Chapter'}</span>
                                <span class="price-tag">₹${note.price}</span>
                            </div>
                        </div>
                        
                        ${actionBtnHtml}
                    </div>
                `;
            });
        }

        function openInViewer(noteId) {
            const note = loadedNotesMap[noteId];
            if (!note) return;

            const noteIdStr = String(note.id);
            const isApproved = purchases.includes(noteIdStr) || orderStatuses[noteIdStr] === 'approved';
            let targetFilePath = note.file_path || note.full_pdf_url || '';

            let rawClass = note.class_no ? String(note.class_no) : '';
            let classDigits = rawClass.replace(/\D/g, ''); 
            const classPart = classDigits ? classDigits : rawClass;

            const subjectPart = note.subject ? note.subject.toUpperCase() : '';
            const titlePart = note.title || 'Note';
            const prefixSymbol = "💎";
            
            const descriptiveName = [prefixSymbol, classPart, subjectPart, titlePart].filter(Boolean).join(' • ');

            const cleanPath = encodeURIComponent(targetFilePath);
            const cleanName = encodeURIComponent(descriptiveName);

            if (typeof trackActivityLocally === "function") {
                trackActivityLocally({
                    title: descriptiveName,
                    url: targetFilePath,
                    meta: "Notes Viewer",
                    isPremium: true,
                    isPurchased: isApproved
                }, isApproved);
            }
            
            let url = `notes-viewer.html?path=${cleanPath}&name=${cleanName}&type=premium&status=premium`;
            if (isApproved) {
                url += `&purchased=true`;
            }

            window.location.href = url;
        }

        async function openPaymentModal(noteId) {
            const note = loadedNotesMap[noteId];
            if (!note) return;

            if (typeof window.getCurrentUser === "function") {
                currentUser = await window.getCurrentUser();
            }
            
            if (!currentUser) {
                alert("🔒 Unlock karne ke liye pehle login karein!");
                sessionStorage.setItem("redirect_after_login", window.location.href);
                const loginUrl = typeof window.getPageUrl === "function" ? window.getPageUrl("login.html") : "login.html";
                window.location.href = loginUrl;
                return;
            }

            selectedNoteForPay = note;
            document.getElementById('modalTitle').innerText = "Pay for " + note.title;
            document.getElementById('modalPrice').innerText = "₹" + note.price;
            
            const upiUri = `upi://pay?pa=${encodeURIComponent(MY_UPI_ID)}&pn=PM-Roit&am=${note.price}&cu=INR&tn=${encodeURIComponent('Note: ' + note.title)}`;
            
            document.getElementById('payDirectBtn').href = upiUri;

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUri)}`;
            document.getElementById('upiQrCode').src = qrUrl;
            
            document.getElementById('paymentModal').style.display = 'flex';
        }

        function copyUpiId() {
            navigator.clipboard.writeText(MY_UPI_ID);
            alert("UPI ID Copied to Clipboard!");
        }

        async function submitManualPayment() {
    const utr = document.getElementById('utrInput').value.trim();
    if (utr.length < 8) {
        alert("Please enter a valid UTR/Transaction number!");
        return;
    }

    // Pehle profiles table se user ki extra details fetch kar lo
    const { data: profileData } = await window.supabaseClient
        .from('profiles')
        .select('full_name, phone, avatar_url')
        .eq('email', currentUser.email)
        .maybeSingle();

    const { error } = await window.supabaseClient
        .from('user_orders')
        .insert([{
            user_email: currentUser.email,
            user_name: profileData?.full_name || currentUser.user_metadata?.full_name || 'N/A',
            user_phone: profileData?.phone || 'N/A',
            avatar_url: profileData?.avatar_url || '',
            note_title: selectedNoteForPay.title,
            note_id: selectedNoteForPay.id,
            amount: selectedNoteForPay.price,
            utr_code: utr,
            status: 'pending'
        }]);

    if (!error) {
        alert("Payment details submitted successfully! Admin will verify and approve soon.");
        document.getElementById('paymentModal').style.display = 'none';
        document.getElementById('utrInput').value = '';
        
        orderStatuses[String(selectedNoteForPay.id)] = 'pending';
        loadNotes();
    } else {
        alert("Database sync failed: " + error.message);
    }
}

    </script>
</body>
</html>
