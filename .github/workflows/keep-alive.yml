name: Keep Supabase Alive

on:
  schedule:
    # Har 3 din mein raat 12 baje chalega (UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Manual test run ke liye

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Website/Supabase
        run: |
          curl -s "https://roitx.github.io" > /dev/null
          echo "Supabase keep-alive ping sent successfully!"
