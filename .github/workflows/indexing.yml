name: Google Indexing API

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'changed or all'
        default: 'changed'

jobs:
  indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google APIs
        run: npm install googleapis

      - name: Submit URLs
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: node .github/scripts/index-urls.js
