name: Unzip upload

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and copy
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Koi zip nahi mili, skipping"; exit 0; fi

          for z in "${zips[@]}"; do
            echo "== $z =="
            X=$(mktemp -d)
            unzip -q -o "$z" -d "$X" || { echo "Is zip me dikkat hai: $z"; rm -rf "$X"; continue; }

            # zip ke andar sirf ek folder ho to wahi source maano
            SRC="$X"
            if [ "$(ls -A "$X" | wc -l)" = "1" ] && [ -d "$X/$(ls -A "$X")" ]; then
              SRC="$X/$(ls -A "$X")"
            fi

            tar -C "$SRC" --exclude='./.git' --exclude='./.github' --exclude='./__MACOSX' --exclude='.DS_Store' --exclude='*.zip' -cf - . | tar -xf -
            rm -f "$z"
            rm -rf "$X"
          done

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update site from zip [skip ci]"
          git push
