<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Exam Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0052cc;
            --primary-light: #e6efff;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --neutral-bg: #f8fafc;
            --text-main: #1e293b;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: #f1f5f9; color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Top Header Navigation */
        header { background: #ffffff; border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; sticky: top; z-index: 10; }
        .brand-title { font-size: 18px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .timer-badge { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        /* Layout Grid */
        .portal-layout { display: grid; grid-template-columns: 1fr 300px; max-width: 1200px; width: 100%; margin: 20px auto; gap: 20px; padding: 0 16px; flex-grow: 1; }
        
        @media (max-width: 850px) {
            .portal-layout { grid-template-columns: 1fr; }
        }

        /* Main Question Box */
        .question-box { background: #ffffff; border-radius: 12px; border: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; justify-content: space-between; min-height: 480px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        .q-num { font-weight: 700; font-size: 16px; color: var(--primary); }
        .q-text { font-size: 16px; line-height: 1.6; font-weight: 600; margin-bottom: 20px; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .option-card { border: 1.5px solid var(--border); border-radius: 8px; padding: 14px 18px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 12px; background: #fff; font-size: 15px; }
        .option-card:hover { border-color: var(--primary); background: var(--primary-light); }
        .option-card.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 600; color: var(--primary); }
        .opt-prefix { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: #fff; }
        .option-card.selected .opt-prefix { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Actions Row */
        .action-bar { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 16px; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: #f1f5f9; }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { opacity: 0.9; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-success { background: var(--success); color: #fff; }

        /* Question Palette Drawer Panel */
        .palette-box { background: #ffffff; border-radius: 12px; border: 1px solid var(--border); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .palette-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
        .p-btn { width: 100%; aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .p-btn.active { border: 2px solid var(--primary); }
        .p-btn.answered { background: var(--success); color: #fff; border-color: var(--success); }
        .p-btn.review { background: var(--warning); color: #fff; border-color: var(--warning); }
        .p-btn.unanswered { background: #f1f5f9; color: var(--text-main); }

        .legend { font-size: 12px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; }

        /* Result Analytics UI */
        .result-wrapper { max-width: 800px; margin: 30px auto; background: #fff; padding: 32px; border-radius: 16px; border: 1px solid var(--border); text-align: center; }
        .score-card { display: flex; justify-content: space-around; background: var(--neutral-bg); padding: 20px; border-radius: 12px; margin: 24px 0; }
        .stat-item h3 { font-size: 24px; font-weight: 800; color: var(--primary); }
        .stat-item p { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; }

        /* Solutions View Card System */
        .sol-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-top: 14px; text-align: left; }
        .badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-danger { background: #fee2e2; color: #b91c1c; }
        .badge-warning { background: #fef3c7; color: #b45309; }
    </style>
</head>
<body>

<header>
    <div class="brand-title"><i class="fa-solid fa-graduation-cap"></i> <span id="testHeading">Loading Examination...</span></div>
    <div class="timer-badge"><i class="fa-regular fa-clock"></i> <span id="timerText">00:00</span></div>
</header>

<div id="testArea" class="portal-layout">
    <!-- Main Question Container -->
    <div class="question-box">
        <div>
            <div class="q-header">
                <span class="q-num" id="currentQNum">Question 1</span>
                <span style="font-size: 13px; color: #64748b;" id="marksInfo">Single Choice</span>
            </div>
            <div class="q-text" id="questionText">Loading text...</div>
            <div class="options-grid" id="optionsContainer"></div>
        </div>

        <div class="action-bar">
            <div>
                <button class="btn btn-outline" onclick="clearResponse()"><i class="fa-solid fa-rotate-left"></i> Clear</button>
                <button class="btn btn-warning" onclick="markForReview()"><i class="fa-solid fa-bookmark"></i> Review</button>
            </div>
            <div>
                <button class="btn btn-outline" onclick="navigateQuestion(-1)"><i class="fa-solid fa-arrow-left"></i> Prev</button>
                <button class="btn btn-primary" id="nextBtn" onclick="navigateQuestion(1)">Next <i class="fa-solid fa-arrow-right"></i></button>
                <button class="btn btn-success" onclick="confirmSubmission()"><i class="fa-solid fa-paper-plane"></i> Submit</button>
            </div>
        </div>
    </div>

    <!-- Navigation Drawer Palette -->
    <div class="palette-box">
        <div class="palette-title">Question Navigator</div>
        <div class="palette-grid" id="paletteGrid"></div>
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: var(--success);"></div> Attempted</div>
            <div class="legend-item"><div class="dot" style="background: var(--warning);"></div> Marked for Review</div>
            <div class="legend-item"><div class="dot" style="background: #f1f5f9; border:1px solid #ccc;"></div> Unattempted</div>
        </div>
    </div>
</div>

<!-- RESULT VIEW -->
<div id="resultArea" style="display: none;">
    <div class="result-wrapper">
        <i class="fa-solid fa-circle-check" style="font-size: 54px; color: var(--success);"></i>
        <h2 style="margin-top: 12px;">Test Submitted Successfully!</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 4px;" id="resultStatusMsg">Score leaderboard updated.</p>

        <div class="score-card">
            <div class="stat-item">
                <h3 id="statScore">0/0</h3>
                <p>Total Score</p>
            </div>
            <div class="stat-item">
                <h3 id="statAccuracy" style="color: var(--success);">0%</h3>
                <p>Accuracy Rate</p>
            </div>
            <div class="stat-item">
                <h3 id="statTime">0s</h3>
                <p>Time Taken</p>
            </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: center;">
            <button class="btn btn-primary" onclick="toggleSolutions()"><i class="fa-solid fa-eye"></i> View Solutions & Key</button>
            <button class="btn btn-outline" onclick="window.location.href='tests.html'"><i class="fa-solid fa-house"></i> Tests Center</button>
        </div>

        <div id="solutionsContainer" style="display: none; margin-top: 30px;">
            <h3 style="text-align: left; margin-bottom: 10px;">Answer Key & Detailed Analysis</h3>
            <div id="solutionsList"></div>
        </div>
    </div>
</div>

<script src="supabase.js"></script>
<script>
    let currentTest = null;
    let questions = [];
    let currentIndex = 0;
    
    // User response maps
    let userAnswers = {};
    let reviewStatus = {};
    
    let timerInterval = null;
    let timeRemaining = 0;
    let testStartTime = Date.now();

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const testId = urlParams.get('id');
        if (testId) {
            loadTestDetails(testId);
        } else {
            alert("Test ID missing!");
            window.location.href = "tests.html";
        }
    };

    function loadTestDetails(id) {
        window.supabaseClient
            .from('tests')
            .select('*')
            .eq('id', id)
            .single()
            .then(res => {
                if (res.error) throw res.error;
                currentTest = res.data;
                questions = currentTest.questions_data || [];

                document.getElementById("testHeading").innerText = currentTest.title || "Examination";
                timeRemaining = (currentTest.time_limit_mins || 15) * 60;
                
                startTimer();
                renderPalette();
                loadQuestion(0);
            })
            .catch(err => alert("Error initializing exam: " + err.message));
    }

    function renderPalette() {
        const grid = document.getElementById("paletteGrid");
        grid.innerHTML = "";
        questions.forEach((_, idx) => {
            const btn = document.createElement("button");
            btn.className = `p-btn ${getQuestionClass(idx)}`;
            btn.innerText = idx + 1;
            btn.onclick = () => loadQuestion(idx);
            grid.appendChild(btn);
        });
    }

    function getQuestionClass(idx) {
        let cls = "";
        if (idx === currentIndex) cls += " active";
        if (reviewStatus[idx]) return cls + " review";
        if (userAnswers[idx] !== undefined) return cls + " answered";
        return cls + " unanswered";
    }

    function loadQuestion(idx) {
        if (idx < 0 || idx >= questions.length) return;
        currentIndex = idx;
        const q = questions[idx];

        document.getElementById("currentQNum").innerText = `Question ${idx + 1} of ${questions.length}`;
        document.getElementById("questionText").innerText = q.question_text || q.question;

        const optionsBox = document.getElementById("optionsContainer");
        optionsBox.innerHTML = "";

        const options = q.options || [q.option1, q.option2, q.option3, q.option4];

        options.forEach((opt, oIdx) => {
            const card = document.createElement("div");
            card.className = `option-card ${userAnswers[idx] === oIdx ? 'selected' : ''}`;
            card.onclick = () => selectOption(oIdx);
            card.innerHTML = `
                <div class="opt-prefix">${String.fromCharCode(65 + oIdx)}</div>
                <div>${opt}</div>
            `;
            optionsBox.appendChild(card);
        });

        renderPalette();
    }

    function selectOption(oIdx) {
        userAnswers[currentIndex] = oIdx;
        delete reviewStatus[currentIndex];
        loadQuestion(currentIndex);
    }

    function clearResponse() {
        delete userAnswers[currentIndex];
        delete reviewStatus[currentIndex];
        loadQuestion(currentIndex);
    }

    function markForReview() {
        reviewStatus[currentIndex] = true;
        navigateQuestion(1);
    }

    function navigateQuestion(direction) {
        const nextIdx = currentIndex + direction;
        if (nextIdx >= 0 && nextIdx < questions.length) {
            loadQuestion(nextIdx);
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            document.getElementById("timerText").innerText = 
                `${mins < 10 ? "0" : ""}${mins}:${secs < 10 ? "0" : ""}${secs}`;

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert("Time limit reached! Automatic submission in progress.");
                submitTest();
            }
        }, 1000);
    }

    function parseCorrectOption(val) {
        if (typeof val === 'number') return val;
        if (!val) return 0;
        let str = val.toString().trim().toUpperCase();
        if (str === 'A' || str === '0') return 0;
        if (str === 'B' || str === '1') return 1;
        if (str === 'C' || str === '2') return 2;
        if (str === 'D' || str === '3') return 3;
        return parseInt(str, 10) || 0;
    }

    function confirmSubmission() {
        if (confirm("Kyu aap exam submit karna chahte hain?")) {
            submitTest();
        }
    }

    async function submitTest() {
        clearInterval(timerInterval);
        let correctCount = 0;
        let wrongCount = 0;

        let marksPerQ = parseFloat(currentTest.marks_per_question) || 1;
        let negMarking = parseFloat(currentTest.negative_marking) || 0;

        questions.forEach((q, idx) => {
            let correctIdx = parseCorrectOption(q.correct_option);
            if (userAnswers[idx] !== undefined) {
                if (userAnswers[idx] === correctIdx) {
                    correctCount++;
                } else {
                    wrongCount++;
                }
            }
        });

        let totalScore = (correctCount * marksPerQ) - (wrongCount * negMarking);
        if (totalScore < 0) totalScore = 0;

        let totalMarks = questions.length * marksPerQ;
        let timeTakenSec = Math.round((Date.now() - testStartTime) / 1000);
        let accuracy = questions.length > 0 ? Math.round((correctCount / questions.length) * 100) : 0;

        document.getElementById("testArea").style.display = "none";
        document.getElementById("resultArea").style.display = "block";

        document.getElementById("statScore").innerText = `${totalScore}/${totalMarks}`;
        document.getElementById("statAccuracy").innerText = `${accuracy}%`;
        document.getElementById("statTime").innerText = `${Math.floor(timeTakenSec / 60)}m ${timeTakenSec % 60}s`;

        try {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            
            if (!user) {
                document.getElementById("resultStatusMsg").innerText = "⚠️ User login session missing. Result shown locally.";
                return;
            }

            // High Score logic: Upsert ensures duplicate rows for single user are avoided
            const { error } = await window.supabaseClient
                .from('test_results')
                .upsert([{
                    test_id: currentTest.id,
                    user_id: user.id,
                    score: totalScore,
                    total_marks: totalMarks,
                    correct_answers: correctCount,
                    wrong_answers: wrongCount,
                    time_taken_sec: timeTakenSec
                }], { onConflict: 'user_id, test_id' });

            if (error) throw error;
            document.getElementById("resultStatusMsg").innerText = "✅ Result successfully updated on Leaderboard!";
        } catch (err) {
            document.getElementById("resultStatusMsg").innerText = "❌ Sync Notice: " + err.message;
        }
    }

    function toggleSolutions() {
        const solContainer = document.getElementById("solutionsContainer");
        if (solContainer.style.display === "none") {
            renderSolutions();
            solContainer.style.display = "block";
        } else {
            solContainer.style.display = "none";
        }
    }

    function renderSolutions() {
        let html = "";
        questions.forEach((q, idx) => {
            let correctIdx = parseCorrectOption(q.correct_option);
            let userAnsIdx = userAnswers[idx];
            let options = q.options || [q.option1, q.option2, q.option3, q.option4];

            let isCorrect = userAnsIdx === correctIdx;
            let badgeClass = isCorrect ? 'badge-success' : (userAnsIdx === undefined ? 'badge-warning' : 'badge-danger');
            let badgeText = isCorrect ? '✔ Correct' : (userAnsIdx === undefined ? '⚠ Unanswered' : '✖ Incorrect');

            html += `
                <div class="sol-card">
                    <span class="badge ${badgeClass}">${badgeText}</span>
                    <h4 style="margin-bottom: 8px;">Q${idx + 1}. ${q.question_text || q.question}</h4>
                    <p style="font-size: 14px; margin-bottom: 4px;"><b>Your Choice:</b> ${userAnsIdx !== undefined ? options[userAnsIdx] : 'None'}</p>
                    <p style="font-size: 14px; color: var(--success); margin-bottom: 6px;"><b>Correct Answer:</b> ${options[correctIdx]}</p>
                    ${q.explanation ? `<p style="font-size: 13px; color: #64748b; background: #f8fafc; padding: 8px; border-radius:6px; margin-top:6px;"><i>Explanations: ${q.explanation}</i></p>` : ''}
                </div>
            `;
        });
        document.getElementById("solutionsList").innerHTML = html;
    }
</script>
</body>
</html>
