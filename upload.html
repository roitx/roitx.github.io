<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Reference Book</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="upload.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

<div class="upload-card">

  <h2>📘 Upload Reference Book</h2>
  <p class="sub">Admin only • Chapter based • Auto naming</p>

  <label class="label">Author / Book Name</label>
  <input type="text" id="authorInput" placeholder="e.g. RD Sharma">

  <label class="label">Class</label>
  <select id="classSelect">
    <option value="1">Part I</option>
    <option value="2">Part II</option>
    <option value="8">Class 8</option>
    <option value="9">Class 9</option>
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
  </select>

  <label class="label">Subject</label>
  <select id="subjectSelect">
        <option value="Math">Mathematics</option>
    <option value="Physics">Physics</option>
    <option value="Chemistry">Chemistry</option>
    <option value="Biology">Biology</option>
    <option value="ComputerScience">Computer Science</option>
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
    <option value="History">History</option>
    <option value="Geography">Geography</option>
    <option value="PoliticalScience">Political Science</option>
    <option value="Economics">Economics</option>
    <option value="Accounts">Accountancy</option>
    <option value="BusinessStudies">Business Studies</option>
    <option value="Psychology">Psychology</option>
    <option value="Sociology">Sociology</option>
    <option value="PhysicalEducation">Physical Education</option>
    
  </select> 

  <label class="label">Chapter No</label>
  <input type="number" id="chapter_noInput" placeholder="e.g. 1">

  <label class="label">Chapter Name</label>
  <input type="text" id="chapterInput" placeholder="e.g. Motion">

  <label class="label">PDF File</label>
  <input type="file" id="bookFile" accept=".pdf">

  <div class="preview">
    <div class="preview-title">📖 Auto Generated Name</div>
    <div id="previewName" class="preview-name">
      Fill details to preview name
    </div>
  </div>

  <button onclick="uploadBook()">⬆ Upload Chapter</button>

  <p id="status" class="status"></p>

  <hr class="divider">

  
<h3 class="list-title">📚 Uploaded Chapters</h3>

<!-- ✅ SEARCH & FILTERS (Author, Class, Subject) -->
<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
  <input type="text" id="searchBook" placeholder="🔍 Search chapter name..." style="margin-bottom: 0;">
  
  <div style="display: flex; gap: 6px;">
    <!-- Author Filter -->
    <select id="filterAuthor" style="flex: 1; padding: 8px; font-size: 12px;">
      <option value="">All Authors</option>
      <!-- JavaScript se authors automatically yahan aayenge -->
    </select>

    <!-- Class Filter -->
    <select id="filterClass" style="width: 95px; padding: 8px; font-size: 12px;">
      <option value="">All Classes</option>
      <option value="1">Part I</option>
      <option value="2">Part II</option>
      <option value="8">Class 8</option>
      <option value="9">Class 9</option>
      <option value="10">Class 10</option>
      <option value="11">Class 11</option>
      <option value="12">Class 12</option>
    </select>

    <!-- Subject Filter -->
    <select id="filterSubject" style="width: 95px; padding: 8px; font-size: 12px;">
      <option value="">All Subjects</option>
      <option value="Math">Mathematics</option>
    <option value="Physics">Physics</option>
    <option value="Chemistry">Chemistry</option>
    <option value="Biology">Biology</option>
    <option value="ComputerScience">Computer Science</option>
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
    <option value="History">History</option>
    <option value="Geography">Geography</option>
    <option value="PoliticalScience">Political Science</option>
    <option value="Economics">Economics</option>
    <option value="Accounts">Accountancy</option>
    <option value="BusinessStudies">Business Studies</option>
    <option value="Psychology">Psychology</option>
    <option value="Sociology">Sociology</option>
    <option value="PhysicalEducation">Physical Education</option>
    
    </select>
  </div>
</div>

<div id="bookList" class="book-list">⏳ Loading...</div>

</div>

<!-- Authentication & Page Initialization Script -->
<script>
  window.onload = async () => {
      // Check if admin is authenticated before letting them use the page
      if (typeof window.requireAdminAuth === "function") {
          await window.requireAdminAuth();
      }
      
      // Agar aapke upload.js ke andar initialization functions hain, 
      // toh unhe yahan call kar sakte hain agar zaroorat ho.
  };
</script>

<script src="upload.js"></script>
</body>
</html>
