<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Class 11 Commerce — RK Notes</title>
    <link rel="stylesheet" href="site.css">
    
    <style>
      /* Movable Floating Home Button Styling */
      .home-btn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, #7c4dff, #3d5afe);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 18px rgba(61, 90, 254, 0.6), 0 6px 15px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9999;
        touch-action: none; /* Smooth dragging on touch screens */
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      .home-btn:active {
        transform: scale(0.92);
      }

      .home-btn svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: #ffffff;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
      }

      /* Card SVG Badge Styling */
      .card-header-flex {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      }

      .card-svg-icon {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: var(--accent, #3aa0ff);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      .btn-svg-icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
        margin-right: 4px;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="brand"><h1>Class 11 Commerce</h1></div>
    <button class="btn" onclick="location.href='classes.html'">
      <svg class="btn-svg-icon" viewBox="0 0 24 24">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg> Back
    </button>
  </header>

  <h2>Select a Subject</h2>
  <div class="grid">
    <div class="card" onclick="openSubject('accountancy')">
      <div class="card-header-flex">
        <!-- Accountancy SVG -->
        <svg class="card-svg-icon" viewBox="0 0 24 24">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <h3>Accountancy</h3>
      </div>
      <p>Financial Accounting & Ledger</p>
    </div>

    <div class="card" onclick="openSubject('business_studies')">
      <div class="card-header-flex">
        <!-- Business Studies SVG -->
        <svg class="card-svg-icon" viewBox="0 0 24 24">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
        </svg>
        <h3>Business Studies</h3>
      </div>
      <p>Foundations of Business</p>
    </div>

    <div class="card" onclick="openSubject('economics')">
      <div class="card-header-flex">
        <!-- Economics SVG -->
        <svg class="card-svg-icon" viewBox="0 0 24 24">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
        <h3>Economics</h3>
      </div>
      <p>Statistics & Microeconomics</p>
    </div>

    <div class="card" onclick="openSubject('maths')">
      <div class="card-header-flex">
        <!-- Maths SVG -->
        <svg class="card-svg-icon" viewBox="0 0 24 24">
          <path d="M4 19L19 4"></path>
          <circle cx="7" cy="7" r="2"></circle>
          <circle cx="17" cy="17" r="2"></circle>
        </svg>
        <h3>Maths</h3>
      </div>
      <p>Business Mathematics</p>
    </div>

    <div class="card" onclick="openSubject('english')">
      <div class="card-header-flex">
        <!-- English SVG -->
        <svg class="card-svg-icon" viewBox="0 0 24 24">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <h3>English</h3>
      </div>
      <p>Core Course</p>
    </div>
  </div>

  <div id="notesContainer" style="margin-top: 25px;"></div>
</div>

<!-- Draggable SVG Floating Home Button -->
<div id="movableHomeBtn" class="home-btn">
  <svg viewBox="0 0 24 24">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </svg>
</div>

<script>
  const CURRENT_CLASS = "11";
</script>
<script src="site.js"></script>

<script>
  // Draggable & Clickable Logic for Home Button
  const homeBtn = document.getElementById('movableHomeBtn');
  let isDragging = false;
  let hasDragged = false;
  let startX, startY, initialLeft, initialTop;

  // Touch Events (Mobile)
  homeBtn.addEventListener('touchstart', (e) => {
    isDragging = true;
    hasDragged = false;
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const touch = e.touches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    homeBtn.style.left = `${initialLeft + deltaX}px`;
    homeBtn.style.top = `${initialTop + deltaY}px`;
    homeBtn.style.bottom = 'auto';
    homeBtn.style.right = 'auto';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    isDragging = false;
  });

  // Mouse Events (Desktop)
  homeBtn.addEventListener('mousedown', (e) => {
    isDragging = true;
    hasDragged = false;
    startX = e.clientX;
    startY = e.clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    homeBtn.style.left = `${initialLeft + deltaX}px`;
    homeBtn.style.top = `${initialTop + deltaY}px`;
    homeBtn.style.bottom = 'auto';
    homeBtn.style.right = 'auto';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // Handle Click / Navigation
  homeBtn.addEventListener('click', (e) => {
    if (hasDragged) {
      e.preventDefault();
      return;
    }
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
