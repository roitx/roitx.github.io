<!-- Floating Draggable Home Button with SVG Icon -->
<div id="dragHomeBtn" class="home-btn" aria-label="Go to Homepage">
  <svg viewBox="0 0 24 24">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>

<script>
  // FULLY DRAGGABLE HOME BUTTON LOGIC (Mouse & Touch)
  const homeBtn = document.getElementById("dragHomeBtn");
  let isDragging = false;
  let hasDragged = false;
  let startX, startY, initialLeft, initialTop;

  function onDragStart(e) {
    isDragging = true;
    hasDragged = false;
    
    const clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
    
    startX = clientX;
    startY = clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    homeBtn.style.bottom = "auto";
    homeBtn.style.right = "auto";
    homeBtn.style.left = `${initialLeft}px`;
    homeBtn.style.top = `${initialTop}px`;
  }

  function onDragMove(e) {
    if (!isDragging) return;

    const clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
    const clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;

    const deltaX = clientX - startX;
    const deltaY = clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    let newLeft = initialLeft + deltaX;
    let newTop = initialTop + deltaY;

    const maxLeft = window.innerWidth - homeBtn.offsetWidth;
    const maxTop = window.innerHeight - homeBtn.offsetHeight;

    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));

    homeBtn.style.left = `${newLeft}px`;
    homeBtn.style.top = `${newTop}px`;
  }

  function onDragEnd() {
    isDragging = false;
  }

  // Mouse Events
  homeBtn.addEventListener("mousedown", onDragStart);
  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("mouseup", onDragEnd);

  // Touch Events (Mobile/Tablet)
  homeBtn.addEventListener("touchstart", onDragStart, { passive: true });
  window.addEventListener("touchmove", onDragMove, { passive: true });
  window.addEventListener("touchend", onDragEnd);

  // Click Action (Only trigger if not dragged)
  homeBtn.addEventListener("click", () => {
    if (!hasDragged) {
      window.location.href = "index.html";
    }
  });
</script>
