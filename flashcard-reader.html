<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Roitx - Advanced Flashcard Reader</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <!-- Canvas Confetti for completion celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- MathJax CDN -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background: #071124; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; overflow-x: hidden; position: relative; }
    
    /* Top Bar Controls */
    .top-controls {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      max-width: 600px;
      margin: 0 auto;
    }

    .top-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #00d2ff;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }
    .top-btn:hover {
      background: rgba(0, 210, 255, 0.15);
      border-color: rgba(0, 210, 255, 0.4);
    }
    .top-btn:active { transform: scale(0.95); }

    .top-right-group { display: flex; gap: 10px; }
    
    .icon-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      justify-content: center;
      border-radius: 14px;
    }
    .icon-btn.active-star { color: #facc15; border-color: rgba(250,204,21,0.5); background: rgba(250,204,21,0.1); }

    .reader-card { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; margin-top: 40px; }
    
    .top-header { text-align: center; margin-bottom: 12px; width: 100%; }
    .card-title { font-size: 16px; font-weight: 800; color: #00d2ff; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; }
    
    /* Progress Bar */
    .progress-bar-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #00d2ff, #a855f7); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

    .sub-info-bar { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 20px; padding: 0 4px; }

    /* Stacked Cards Container */
    .flashcard-container { width: 100%; height: 320px; position: relative; perspective: 1200px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; }
    
    .stack-card-back-2 { position: absolute; width: 85%; height: 100%; background: #132247; border-radius: 24px; transform: scale(0.85) translateY(30px); z-index: 1; opacity: 0.4; border: 1px solid rgba(255,255,255,0.05); }
    .stack-card-back-1 { position: absolute; width: 92%; height: 100%; background: #172a54; border-radius: 24px; transform: scale(0.92) translateY(15px); z-index: 2; opacity: 0.7; border: 1px solid rgba(255,255,255,0.1); }

    /* Main Active Flashcard */
    .flashcard { 
      width: 100%; 
      height: 100%; 
      position: absolute; 
      transform-style: preserve-3d; 
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
      z-index: 3; 
      cursor: pointer; 
      left: 0; 
    }
    
    .flashcard.flipped-right { transform: rotateY(180deg) scale(1.02); }
    .flashcard.flipped-left { transform: rotateY(-180deg) scale(1.02); }

    .flashcard.swipe-left { transform: translateX(-130%) scale(1.2) rotate(-22deg); opacity: 0; }
    .flashcard.swipe-right { transform: translateX(130%) scale(1.2) rotate(22deg); opacity: 0; }
    
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; box-sizing: border-box; border-radius: 24px; text-align: center; border: 1px solid rgba(0,210,255,0.25); }
    .card-front { background: #0c162d; color: #00d2ff; z-index: 2; }
    .card-back { background: #1e293b; color: #f1f5f9; transform: rotateY(180deg); border-color: rgba(168,85,247,0.4); z-index: 1; }

    .card-face .hint { font-size: 11px; opacity: 0.6; margin-top: 18px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* Utility Action Buttons inside Card (Audio, etc.) */
    .card-actions {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .action-icon {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: 0.2s;
    }
    .action-icon:hover { background: rgba(0,210,255,0.3); color: #00d2ff; }

    /* Spaced Repetition Rating Buttons */
    .rating-container {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .rating-container.show {
      opacity: 1;
      pointer-events: auto;
    }
    .rate-btn {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .rate-hard { background: rgba(239, 68, 68, 0.15); color: #ef4444; border-color: rgba(239, 68, 68, 0.3); }
    .rate-good { background: rgba(234, 179, 8, 0.15); color: #eab308; border-color: rgba(234, 179, 8, 0.3); }
    .rate-easy { background: rgba(34, 197, 94, 0.15); color: #22c55e; border-color: rgba(34, 197, 94, 0.3); }
    .rate-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

    /* Navigation Buttons */
    .nav-btns { display: flex; gap: 12px; width: 100%; }
    .btn { flex: 1; padding: 14px; border-radius: 16px; border: none; background: linear-gradient(135deg, #00d2ff, #3a7bd5); color: #050b18; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,210,255,0.3); transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .btn:active { transform: scale(0.97); }
    .btn.secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid rgba(255,255,255,0.12); box-shadow: none; }
    .btn.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; box-shadow: none; }

    .shortcut-hint { font-size: 11px; color: #64748b; margin-top: 14px; text-align: center; }

    /* Keyboard Shortcut Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 11, 24, 0.8); backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-content {
      background: #0c162d; border: 1px solid rgba(0,210,255,0.3); border-radius: 20px;
      padding: 24px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .modal-content h3 { color: #00d2ff; margin-bottom: 14px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .shortcut-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; color: #94a3b8; }
    .shortcut-row kbd { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; color: #fff; font-family: monospace; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <!-- Top Fixed Controls -->
  <div class="top-controls">
    <a href="flashcard-list.html" class="top-btn" id="fixedListBtn" onclick="saveCurrentProgress()">
      <i class="fa-solid fa-arrow-left-long"></i> List
    </a>
    <div class="top-right-group">
      <button class="top-btn icon-btn" id="bookmarkBtn" onclick="toggleBookmark()" title="Bookmark Card">
        <i class="fa-regular fa-star" id="bookmarkIcon"></i>
      </button>
      <button class="top-btn icon-btn" id="langToggleBtn" onclick="toggleLanguage()" title="Change Language" style="display: none;">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor;"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg>
      </button>
      <button class="top-btn icon-btn" onclick="openShortcutModal()" title="Shortcuts">
        <i class="fa-solid fa-keyboard"></i>
      </button>
    </div>
  </div>

  <div class="reader-card">
    <div class="top-header">
      <div class="card-title" id="cardTitle">Loading Flashcards...</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    
    <div class="sub-info-bar">
      <span id="cardCounter">Card 0 of 0</span>
      <span id="streakCounter" style="color:#22c55e;"><i class="fa-solid fa-fire"></i> Streak: 0</span>
    </div>

    <!-- Stacked Cards Layout -->
    <div class="flashcard-container" id="cardContainer">
      <div class="stack-card-back-2"></div>
      <div class="stack-card-back-1"></div>

      <div class="flashcard" id="flashcardElem" onclick="handleCardClick(event)">
        <div class="card-face card-front">
          <div class="card-actions">
            <button class="action-icon" onclick="event.stopPropagation(); speakText(currentFrontRaw)" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <div id="cardFrontText" style="font-size: 15px; font-weight: 700; line-height: 1.6;">Tap to load...</div>
          <div class="hint"><i class="fa-solid fa-rotate"></i> Tap left/right to flip</div>
        </div>
        <div class="card-face card-back">
          <div class="card-actions">
            <button class="action-icon" onclick="event.stopPropagation(); speakText(currentBackRaw)" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
          </div>
          <div id="cardBackText" style="font-size: 14px; line-height: 1.6;">Answer here...</div>
          <div class="hint" style="color:#c084fc;"><i class="fa-solid fa-rotate"></i> Tap left/right to flip</div>
        </div>
      </div>
    </div>

    <!-- Spaced Repetition Self Rating Buttons -->
    <div class="rating-container" id="ratingContainer">
      <button class="rate-btn rate-hard" onclick="rateCard('hard')">Hard 🔴</button>
      <button class="rate-btn rate-good" onclick="rateCard('good')">Good 🟡</button>
      <button class="rate-btn rate-easy" onclick="rateCard('easy')">Easy 🟢</button>
    </div>

    <div class="nav-btns">
      <button class="btn secondary" id="prevBtn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i> Pichla</button>
      <button class="btn" id="nextBtn" onclick="nextCard()">Agla <i class="fa-solid fa-arrow-right"></i></button>
    </div>
    
    <div class="shortcut-hint">💡 Tip: Tap card sides to flip, swipe or use arrow keys. Press <kbd style="background:rgba(255,255,255,0.1);padding:2px 4px;border-radius:4px;">Space</kbd> to flip.</div>
  </div>

  <!-- Keyboard Shortcuts Modal -->
  <div class="modal-overlay" id="shortcutModal" onclick="closeShortcutModal(event)">
    <div class="modal-content">
      <h3>Keyboard Shortcuts <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeShortcutModal()"></i></h3>
      <div class="shortcut-row"><span>Flip Card</span><kbd>Space / Enter</kbd></div>
      <div class="shortcut-row"><span>Next Card</span><kbd>→</kbd></div>
      <div class="shortcut-row"><span>Previous Card</span><kbd>←</kbd></div>
      <div class="shortcut-row"><span>Bookmark Card</span><kbd>B</kbd></div>
    </div>
  </div>

<script>
  let cardsList = [];
  let currentIndex = 0;
  let isBilingualSet = false;
  let currentLangMode = 'both';
  let bookmarkedCards = new Set();
  let currentFrontRaw = '';
  let currentBackRaw = '';
  let streakCount = 0;

  async function loadFlashcards() {
    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id');

    if (!cardId) {
      document.getElementById('cardTitle').innerText = "Flashcard ID missing!";
      return;
    }

    const { data, error } = await window.supabaseClient
      .from('flashcards_database')
      .select('*')
      .eq('id', cardId)
      .single();

    if (error || !data) {
      document.getElementById('cardTitle').innerText = "Flashcard nahi mila!";
      return;
    }

    document.getElementById('cardTitle').innerText = data.title;
    cardsList = data.cards || [];
    
    // Check URL for cardIndex first, otherwise fallback to saved progress
    const urlCardIndex = urlParams.get('cardIndex');
    if (urlCardIndex !== null && !isNaN(urlCardIndex)) {
      currentIndex = parseInt(urlCardIndex);
    } else {
      let progressData = JSON.parse(localStorage.getItem("readingProgress") || "{}");
      if (progressData[cardId] !== undefined) {
        currentIndex = progressData[cardId];
      }
    }

    if (currentIndex >= cardsList.length || currentIndex < 0) {
      currentIndex = 0;
    }

    // Load local bookmarks for this set
    const savedBookmarks = localStorage.getItem(`bookmarks_${cardId}`);
    if(savedBookmarks) {
      bookmarkedCards = new Set(JSON.parse(savedBookmarks));
    }

    trackPYQActivityLocally({
      title: data.title,
      meta: `${data.subject || 'Flashcard'} • ${cardsList.length} Cards`
    });

    const mode = data.language_mode ? data.language_mode.toLowerCase() : '';
    if (mode === 'bilingual' || mode.includes('bilingual')) {
      isBilingualSet = true;
      document.getElementById('langToggleBtn').style.display = 'flex';
    } else {
      isBilingualSet = false;
      document.getElementById('langToggleBtn').style.display = 'none';
    }

    renderCard(false);
  }

  function parseBilingualText(text) {
    if (!text) return { en: '', hi: '' };
    const parts = text.split('/');
    if (parts.length >= 2) {
      return { en: parts[0].trim(), hi: parts.slice(1).join('/').trim() };
    }
    return { en: text, hi: text };
  }

  function toggleLanguage() {
    if (currentLangMode === 'both') {
      currentLangMode = 'en';
      document.getElementById('langToggleBtn').title = "Language: English Only";
    } else if (currentLangMode === 'en') {
      currentLangMode = 'hi';
      document.getElementById('langToggleBtn').title = "Language: Hindi Only";
    } else {
      currentLangMode = 'both';
      document.getElementById('langToggleBtn').title = "Language: Bilingual";
    }
    renderCard(false);
  }

  function renderCard(animate = true) {
    if (cardsList.length === 0) return;
    const card = cardsList[currentIndex];
    
    currentFrontRaw = card.front;
    currentBackRaw = card.back;
    let frontText = card.front;
    let backText = card.back;

    if (isBilingualSet) {
      const frontParsed = parseBilingualText(card.front);
      const backParsed = parseBilingualText(card.back);

      if (currentLangMode === 'en') {
        frontText = frontParsed.en;
        backText = backParsed.en;
      } else if (currentLangMode === 'hi') {
        frontText = frontParsed.hi;
        backText = backParsed.hi;
      }
    }
    
    document.getElementById('cardFrontText').innerHTML = frontText;
    document.getElementById('cardBackText').innerHTML = backText;
    document.getElementById('cardCounter').innerText = `Card ${currentIndex + 1} of ${cardsList.length}`;
    document.getElementById('streakCounter').innerHTML = `<i class="fa-solid fa-fire"></i> Streak: ${streakCount}`;
    
    const progressPercent = ((currentIndex + 1) / cardsList.length) * 100;
    document.getElementById('progressFill').style.width = `${progressPercent}%`;

    // Save progress automatically whenever card changes
    saveCurrentProgress();

    // Update Bookmark Icon State
    const bookmarkIcon = document.getElementById('bookmarkIcon');
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    if(bookmarkedCards.has(currentIndex)) {
      bookmarkIcon.className = "fa-solid fa-star";
      bookmarkBtn.classList.add('active-star');
    } else {
      bookmarkIcon.className = "fa-regular fa-star";
      bookmarkBtn.classList.remove('active-star');
    }

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const fixedListBtn = document.getElementById('fixedListBtn');

    if (currentIndex === 0) {
      prevBtn.classList.add('disabled');
    } else {
      prevBtn.classList.remove('disabled');
    }

    if (currentIndex === cardsList.length - 1) {
      nextBtn.innerHTML = `<i class="fa-solid fa-list"></i> List par jaye`;
      nextBtn.onclick = () => { 
        saveCurrentProgress();
        window.location.href = 'flashcard-list.html'; 
      };
      
      if(animate) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }
    } else {
      nextBtn.innerHTML = `Agla <i class="fa-solid fa-arrow-right"></i>`;
      nextBtn.onclick = nextCard;
    }

    const cardElem = document.getElementById('flashcardElem');
    cardElem.classList.remove('flipped-right', 'flipped-left', 'swipe-left', 'swipe-right');
    document.getElementById('ratingContainer').classList.remove('show');

    setTimeout(() => {
      if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
        MathJax.typesetPromise().catch((err) => console.log(err));
      }
    }, 50);
  }

  function saveCurrentProgress() {
    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id');
    if (!cardId) return;
    
    let progressData = JSON.parse(localStorage.getItem("readingProgress") || "{}");
    progressData[cardId] = currentIndex;
    localStorage.setItem("readingProgress", JSON.stringify(progressData));
  }

  window.addEventListener("beforeunload", () => {
    saveCurrentProgress();
  });

  function handleCardClick(event) {
    const cardElem = document.getElementById('flashcardElem');
    if (cardElem.classList.contains('swipe-left') || cardElem.classList.contains('swipe-right')) return;

    const rect = cardElem.getBoundingClientRect();
    let clientX = event.clientX || (event.changedTouches && event.changedTouches[0].clientX);
    let isLeftHalf = clientX !== undefined ? (clientX - rect.left) < (rect.width / 2) : true;
    
    const isCurrentlyFlipped = cardElem.classList.contains('flipped-right') || cardElem.classList.contains('flipped-left');

    if (!isCurrentlyFlipped) {
      cardElem.classList.remove('flipped-right', 'flipped-left');
      if (isLeftHalf) cardElem.classList.add('flipped-left');
      else cardElem.classList.add('flipped-right');
      
      document.getElementById('ratingContainer').classList.add('show');
    } else {
      cardElem.classList.remove('flipped-right', 'flipped-left');
      document.getElementById('ratingContainer').classList.remove('show');
    }
  }

  function rateCard(rating) {
    if(rating === 'easy' || rating === 'good') streakCount++;
    else streakCount = 0;
    nextCard();
  }

  function toggleBookmark() {
    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id');
    if (!cardId) return;

    if(bookmarkedCards.has(currentIndex)) {
      bookmarkedCards.delete(currentIndex);
    } else {
      bookmarkedCards.add(currentIndex);
    }
    
    localStorage.setItem(`bookmarks_${cardId}`, JSON.stringify([...bookmarkedCards]));
    renderCard(false);
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/<[^>]*>?/gm, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    }
  }

  function trackPYQActivityLocally(paperData) {
    try {
      let recent = JSON.parse(localStorage.getItem("recentFiles") || "[]");
      let readerUrl = window.location.href;
      let existingIndex = recent.findIndex(f => f.url === readerUrl || f.title === paperData.title);
      let viewCount = existingIndex !== -1 ? (recent[existingIndex].viewCount || 1) + 1 : 1;
      if (existingIndex !== -1) recent.splice(existingIndex, 1);

      recent.unshift({
        title: paperData.title || "Flashcard Reader",
        url: readerUrl,
        meta: paperData.meta || "Flashcards • Study Set",
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        viewCount: viewCount
      });

      localStorage.setItem("recentFiles", JSON.stringify(recent.slice(0, 15)));
    } catch (e) { console.error(e); }
  }

  function nextCard() {
    if (currentIndex < cardsList.length - 1) {
      const cardElem = document.getElementById('flashcardElem');
      cardElem.classList.add('swipe-left');
      setTimeout(() => {
        currentIndex++;
        renderCard(true);
      }, 350);
    }
  }

  function prevCard() {
    if (currentIndex > 0) {
      const cardElem = document.getElementById('flashcardElem');
      cardElem.classList.add('swipe-right');
      setTimeout(() => {
        currentIndex--;
        renderCard(true);
      }, 350);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft') prevCard();
    if (e.key === 'b' || e.key === 'B') toggleBookmark();
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      const cardElem = document.getElementById('flashcardElem');
      if (!cardElem.classList.contains('flipped-right') && !cardElem.classList.contains('flipped-left')) {
        cardElem.classList.add('flipped-right');
        document.getElementById('ratingContainer').classList.add('show');
      } else {
        cardElem.classList.remove('flipped-right', 'flipped-left');
        document.getElementById('ratingContainer').classList.remove('show');
      }
    }
  });

  function openShortcutModal() { document.getElementById('shortcutModal').style.display = 'flex'; }
  function closeShortcutModal(e) { 
    if(!e || e.target.id === 'shortcutModal' || e.target.classList.contains('fa-xmark')) {
      document.getElementById('shortcutModal').style.display = 'none'; 
    }
  }

  let touchStartX = 0, touchEndX = 0;
  const cardContainer = document.getElementById('cardContainer');
  cardContainer.addEventListener('touchstart', (e) => touchStartX = e.changedTouches[0].screenX, {passive: true});
  cardContainer.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 50) nextCard();
    if (touchEndX > touchStartX + 50) prevCard();
  }, {passive: true});

  window.onload = loadFlashcards;
</script>
</body>
</html>
