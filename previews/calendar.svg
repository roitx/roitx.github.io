<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="calBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04101a" />
      <stop offset="100%" stop-color="#071829" />
    </linearGradient>
    <linearGradient id="calTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3aa0ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#calBg)" />

  <!-- Header -->
  <rect x="40" y="30" width="1120" height="72" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" />
  <circle cx="82" cy="66" r="22" fill="#3aa0ff" fill-opacity="0.2" stroke="#3aa0ff" stroke-width="2" />
  <rect x="73" y="58" width="18" height="16" rx="3" fill="none" stroke="#00f2fe" stroke-width="2" />
  <rect x="120" y="56" width="210" height="20" rx="6" fill="url(#calTitleGrad)" />

  <!-- Left Main Calendar Area -->
  <g transform="translate(40, 125)">
    <!-- Cal Header Box -->
    <rect x="0" y="0" width="760" height="110" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <rect x="20" y="20" width="180" height="22" rx="6" fill="#eaf6ff" />
    <rect x="665" y="16" width="75" height="30" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" />
    <!-- Nav buttons & Date input -->
    <rect x="20" y="60" width="42" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <rect x="72" y="60" width="42" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
    <rect x="124" y="60" width="616" height="34" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" />

    <!-- Weekdays Row -->
    <g transform="translate(0, 128)" fill="#b9c9e0" opacity="0.7">
      <rect x="30" y="0" width="45" height="10" rx="4" />
      <rect x="140" y="0" width="45" height="10" rx="4" />
      <rect x="250" y="0" width="45" height="10" rx="4" />
      <rect x="360" y="0" width="45" height="10" rx="4" />
      <rect x="470" y="0" width="45" height="10" rx="4" />
      <rect x="580" y="0" width="45" height="10" rx="4" />
      <rect x="690" y="0" width="45" height="10" rx="4" />
    </g>

    <!-- 7x4 Calendar Day Cells -->
    <g transform="translate(0, 152)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffb703" stroke-opacity="0.6" />
      <rect x="12" y="12" width="18" height="12" rx="3" fill="#ffc107" />

      <rect x="110" y="0" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="122" y="12" width="18" height="12" rx="3" fill="#8bb1e5" />

      <rect x="220" y="0" width="100" height="105" rx="12" fill="#3aa0ff" fill-opacity="0.2" stroke="#3aa0ff" stroke-width="1.5" />
      <rect x="232" y="12" width="18" height="12" rx="3" fill="#ffffff" />
      <rect x="242" y="80" width="56" height="14" rx="7" fill="#000000" fill-opacity="0.6" stroke="#ffffff" stroke-opacity="0.2" />

      <rect x="330" y="0" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="342" y="12" width="18" height="12" rx="3" fill="#8bb1e5" />

      <rect x="440" y="0" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ff4d4d" stroke-opacity="0.8" />
      <rect x="452" y="12" width="18" height="12" rx="3" fill="#ff6b6b" />

      <rect x="550" y="0" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="562" y="12" width="18" height="12" rx="3" fill="#8bb1e5" />

      <rect x="660" y="0" width="100" height="105" rx="12" fill="#00f2fe" fill-opacity="0.05" stroke="#00f2fe" stroke-opacity="0.8" />
      <rect x="672" y="12" width="18" height="12" rx="3" fill="#00f2fe" />

      <!-- Row 2 -->
      <rect x="0" y="115" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffb703" stroke-opacity="0.6" />
      <rect x="12" y="127" width="18" height="12" rx="3" fill="#ffc107" />

      <rect x="110" y="115" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#7b6bff" stroke-opacity="0.8" />
      <rect x="122" y="127" width="18" height="12" rx="3" fill="#8bb1e5" />
      <rect x="120" y="150" width="80" height="16" rx="4" fill="#7b6bff" fill-opacity="0.4" />

      <rect x="220" y="115" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="330" y="115" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="440" y="115" width="100" height="105" rx="12" fill="#00e676" fill-opacity="0.08" stroke="#00e676" stroke-width="2" />
      <rect x="452" y="127" width="18" height="12" rx="3" fill="#69f0ae" />
      <rect x="550" y="115" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="660" y="115" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />

      <!-- Row 3 & 4 -->
      <rect x="0" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffb703" stroke-opacity="0.6" />
      <rect x="110" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="220" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="330" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="440" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="550" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="660" y="230" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />

      <rect x="0" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.02" stroke="#ffb703" stroke-opacity="0.6" />
      <rect x="110" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="220" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="330" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="440" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.015" opacity="0.3" />
      <rect x="550" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.015" opacity="0.3" />
      <rect x="660" y="345" width="100" height="105" rx="12" fill="#ffffff" fill-opacity="0.015" opacity="0.3" />
    </g>
  </g>

  <!-- Right Side Panel -->
  <g transform="translate(830, 125)">
    <!-- Event Form Card -->
    <rect x="0" y="0" width="330" height="230" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="4 4" />
    <rect x="20" y="22" width="190" height="16" rx="4" fill="#3aa0ff" />
    <rect x="20" y="54" width="290" height="38" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
    <rect x="20" y="104" width="290" height="38" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" />
    <rect x="20" y="158" width="290" height="40" rx="10" fill="#3aa0ff" />

    <!-- Legend Card -->
    <rect x="0" y="250" width="330" height="215" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="4 4" />
    <rect x="20" y="270" width="90" height="14" rx="4" fill="#e9f5ff" />
    
    <circle cx="28" cy="306" r="5" fill="#3aa0ff" />
    <rect x="44" y="301" width="110" height="10" rx="4" fill="#b9c9e0" />
    
    <circle cx="28" cy="334" r="5" fill="#ffb703" />
    <rect x="44" y="329" width="130" height="10" rx="4" fill="#b9c9e0" />
    
    <circle cx="28" cy="362" r="5" fill="#ff4d4d" />
    <rect x="44" y="357" width="145" height="10" rx="4" fill="#b9c9e0" />
    
    <circle cx="28" cy="390" r="5" fill="#00f2fe" />
    <rect x="44" y="385" width="120" height="10" rx="4" fill="#b9c9e0" />
    
    <circle cx="28" cy="418" r="5" fill="#a48aff" />
    <rect x="44" y="413" width="140" height="10" rx="4" fill="#b9c9e0" />

    <!-- Back to Home Card -->
    <rect x="0" y="485" width="330" height="54" rx="14" fill="#ffffff" fill-opacity="0.025" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="4 4" />
    <rect x="20" y="505" width="130" height="12" rx="4" fill="#9fcfff" />
  </g>
</svg>