<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <!-- Deep OLED Dark Background -->
  <rect width="1200" height="800" fill="#09090b" />

  <!-- Top Sticky App Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f0f0f" stroke="#27272a" />
  <rect x="24" y="12" width="36" height="36" rx="10" fill="#ff3b30" fill-opacity="0.15" stroke="#ff3b30" />
  <rect x="72" y="22" width="110" height="16" rx="4" fill="#f4f4f5" />
  <rect x="190" y="20" width="38" height="20" rx="4" fill="#ff3b30" fill-opacity="0.25" stroke="#ff3b30" />

  <!-- Status Pills (Right) -->
  <g transform="translate(820, 16)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#18181b" stroke="#27272a" />
    <rect x="120" y="0" width="75" height="28" rx="14" fill="#18181b" stroke="#27272a" />
    <rect x="205" y="0" width="80" height="28" rx="14" fill="#18181b" stroke="#27272a" />
    <rect x="295" y="0" width="65" height="28" rx="14" fill="#18181b" stroke="#27272a" />
  </g>

  <!-- Main App Navigation Tabs -->
  <g transform="translate(380, 82)">
    <rect x="0" y="0" width="440" height="46" rx="23" fill="#121214" stroke="#27272a" />
    <!-- Active Tab: Clock & Timer -->
    <rect x="6" y="6" width="142" height="34" rx="17" fill="#ff3b30" />
    <rect x="26" y="18" width="102" height="10" rx="4" fill="#ffffff" />
    <!-- Inactive Tabs -->
    <rect x="168" y="18" width="105" height="10" rx="4" fill="#a1a1aa" />
    <rect x="305" y="18" width="110" height="10" rx="4" fill="#a1a1aa" />
  </g>

  <!-- AOD Sub-Navigation & Style Selector -->
  <g transform="translate(470, 152)">
    <rect x="10" y="0" width="55" height="12" rx="4" fill="#ffffff" />
    <rect x="10" y="18" width="55" height="3" rx="1.5" fill="#ff3b30" />
    <rect x="95" y="0" width="75" height="12" rx="4" fill="#8e8e93" />
    <rect x="200" y="0" width="50" height="12" rx="4" fill="#8e8e93" />

    <!-- Flip / Minimal Switch -->
    <rect x="30" y="36" width="200" height="32" rx="12" fill="#1c1c1e" stroke="#27272a" />
    <rect x="34" y="40" width="94" height="24" rx="9" fill="#2c2c2e" />
    <rect x="52" y="48" width="58" height="8" rx="3" fill="#ffffff" />
    <rect x="148" y="48" width="62" height="8" rx="3" fill="#8e8e93" />
  </g>

  <!-- Center 3D Flip Clock Display (HH : MM : SS) -->
  <g transform="translate(335, 265)">
    <!-- Hours Card -->
    <rect x="0" y="0" width="150" height="200" rx="20" fill="#141416" stroke="#27272a" stroke-width="1.5" />
    <text x="16" y="26" fill="#666666" font-family="sans-serif" font-size="13" font-weight="800">PM</text>
    <text x="75" y="132" fill="#e5e5ea" font-family="sans-serif" font-size="92" font-weight="700" text-anchor="middle">08</text>
    <line x1="0" y1="100" x2="150" y2="100" stroke="#000000" stroke-width="3" />

    <!-- Colon 1 -->
    <circle cx="170" cy="82" r="5" fill="#444444" />
    <circle cx="170" cy="118" r="5" fill="#444444" />

    <!-- Minutes Card -->
    <rect x="190" y="0" width="150" height="200" rx="20" fill="#141416" stroke="#27272a" stroke-width="1.5" />
    <text x="265" y="132" fill="#e5e5ea" font-family="sans-serif" font-size="92" font-weight="700" text-anchor="middle">46</text>
    <line x1="190" y1="100" x2="340" y2="100" stroke="#000000" stroke-width="3" />

    <!-- Colon 2 -->
    <circle cx="360" cy="82" r="5" fill="#444444" />
    <circle cx="360" cy="118" r="5" fill="#444444" />

    <!-- Seconds Card -->
    <rect x="380" y="0" width="150" height="200" rx="20" fill="#141416" stroke="#27272a" stroke-width="1.5" />
    <text x="455" y="132" fill="#e5e5ea" font-family="sans-serif" font-size="92" font-weight="700" text-anchor="middle">25</text>
    <line x1="380" y1="100" x2="530" y2="100" stroke="#000000" stroke-width="3" />
  </g>

  <!-- AOD Footer Icons (Rotate, Home, Fullscreen) -->
  <g transform="translate(530, 515)" fill="#8e8e93">
    <circle cx="20" cy="12" r="10" fill="none" stroke="#8e8e93" stroke-width="2" />
    <path d="M62 12 l8 -7 l8 7 v9 h-16 z" fill="none" stroke="#8e8e93" stroke-width="2" />
    <rect x="110" y="4" width="16" height="16" rx="2" fill="none" stroke="#8e8e93" stroke-width="2" />
  </g>

  <!-- Bottom Persistent Music Player Bar -->
  <rect x="0" y="720" width="1200" height="80" fill="#121212" stroke="#282828" />
  <!-- Progress Track -->
  <rect x="65" y="732" width="1070" height="4" rx="2" fill="#4a4a4a" />
  <rect x="65" y="732" width="380" height="4" rx="2" fill="#ff3b30" />
  <circle cx="445" cy="734" r="6" fill="#ff3b30" />

  <!-- Left Track Info -->
  <rect x="24" y="748" width="38" height="38" rx="6" fill="#222222" />
  <rect x="74" y="753" width="120" height="12" rx="4" fill="#ffffff" />
  <rect x="74" y="771" width="80" height="9" rx="3" fill="#aaaaaa" />

  <!-- Center Play Button & Controls -->
  <circle cx="600" cy="767" r="19" fill="#ffffff" />
  <polygon points="596,760 608,767 596,774" fill="#000000" />
  <circle cx="550" cy="767" r="6" fill="#ffffff" opacity="0.7" />
  <circle cx="650" cy="767" r="6" fill="#ffffff" opacity="0.7" />
</svg>