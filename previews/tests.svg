<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a00e0" />
      <stop offset="100%" stop-color="#8e2de2" />
    </linearGradient>
    <linearGradient id="newBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="100%" stop-color="#ff4b2b" />
    </linearGradient>
    <linearGradient id="medBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007bff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7090b0" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Light Soft Background -->
  <rect width="1200" height="800" fill="#f4f7fe" />

  <!-- App Header -->
  <g transform="translate(80, 28)">
    <rect x="0" y="0" width="42" height="42" rx="12" fill="url(#purpleGrad)" />
    <path d="M12 20 l9 -5 l9 5 l-9 5 z M15 23 v5 c3 2 9 2 12 0 v-5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <rect x="56" y="10" width="165" height="22" rx="6" fill="#1b2559" />

    <!-- Theme Switch Pill (Right) -->
    <rect x="980" y="6" width="60" height="30" rx="15" fill="#cbd5e1" />
    <circle cx="995" cy="21" r="12" fill="#ffffff" />
  </g>

  <!-- Segmented Navigation Bar -->
  <g transform="translate(80, 95)">
    <rect x="0" y="0" width="1040" height="56" rx="16" fill="#e2e8f0" fill-opacity="0.7" />
    <!-- Active Tab: Explore Tests -->
    <rect x="6" y="6" width="510" height="44" rx="12" fill="#ffffff" filter="url(#softShadow)" />
    <rect x="200" y="22" width="120" height="12" rx="5" fill="#007bff" />
    <!-- Inactive Tab: Leaderboard -->
    <rect x="720" y="22" width="120" height="12" rx="5" fill="#707ebe" />
  </g>

  <!-- Search & Filters Toolbar -->
  <g transform="translate(80, 175)">
    <rect x="0" y="0" width="885" height="50" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="24" cy="25" r="7" fill="none" stroke="#a0aec0" stroke-width="2" />
    <rect x="46" y="19" width="240" height="12" rx="4" fill="#a0aec0" opacity="0.6" />

    <!-- Purple Gradient Filters Button -->
    <rect x="900" y="0" width="140" height="50" rx="14" fill="url(#purpleGrad)" />
    <rect x="935" y="19" width="70" height="12" rx="4" fill="#ffffff" />
  </g>

  <!-- Section Heading: Recently Added Tests -->
  <g transform="translate(80, 252)">
    <polygon points="10,0 2,14 9,14 7,24 18,10 11,10" fill="#ecc94b" />
    <rect x="28" y="4" width="210" height="16" rx="5" fill="#1b2559" />
    <rect x="975" y="0" width="65" height="24" rx="12" fill="#edf2f7" />
    <rect x="990" y="8" width="35" height="8" rx="3" fill="#4a5568" />
  </g>

  <!-- 3x2 Test Cards Grid -->
  <g transform="translate(80, 295)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="330" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)" />
      <rect x="268" y="16" width="44" height="20" rx="10" fill="url(#newBadgeGrad)" />
      <rect x="20" y="22" width="210" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="46" width="160" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="78" width="190" height="11" rx="4" fill="#707ebe" opacity="0.8" />
      <rect x="20" y="126" width="290" height="44" rx="12" fill="#007bff" />
      <rect x="115" y="142" width="100" height="12" rx="4" fill="#ffffff" />
    </g>

    <!-- Card 2 -->
    <g transform="translate(355, 0)">
      <rect x="0" y="0" width="330" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)" />
      <rect x="252" y="16" width="60" height="20" rx="10" fill="url(#medBadgeGrad)" />
      <rect x="20" y="22" width="200" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="46" width="140" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="78" width="210" height="11" rx="4" fill="#707ebe" opacity="0.8" />
      <rect x="20" y="126" width="290" height="44" rx="12" fill="#007bff" />
      <rect x="115" y="142" width="100" height="12" rx="4" fill="#ffffff" />
    </g>

    <!-- Card 3 -->
    <g transform="translate(710, 0)">
      <rect x="0" y="0" width="330" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)" />
      <rect x="268" y="16" width="44" height="20" rx="10" fill="url(#newBadgeGrad)" />
      <rect x="20" y="22" width="215" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="46" width="175" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="78" width="180" height="11" rx="4" fill="#707ebe" opacity="0.8" />
      <rect x="20" y="126" width="290" height="44" rx="12" fill="#007bff" />
      <rect x="115" y="142" width="100" height="12" rx="4" fill="#ffffff" />
    </g>

    <!-- Card 4 (Row 2) -->
    <g transform="translate(0, 215)">
      <rect x="0" y="0" width="330" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)" />
      <rect x="252" y="16" width="60" height="20" rx="10" fill="url(#medBadgeGrad)" />
      <rect x="20" y="22" width="195" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="46" width="150" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="78" width="200" height="11" rx="4" fill="#707ebe" opacity="0.8" />
      <rect x="20" y="126" width="290" height="44" rx="12" fill="#007bff" />
      <rect x="115" y="142" width="100" height="12" rx="4" fill="#ffffff" />
    </g>

    <!-- Card 5 (Row 2) -->
    <g transform="translate(355, 215)">
      <rect x="0" y="0" width="330" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)" />
      <rect x="20" y="22" width="220" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="46" width="130" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="78" width="190" height="11" rx="4" fill="#707ebe" opacity="0.8" />
      <rect x="20" y="126" width="290" height="44" rx="12" fill="#007bff" />
      <rect x="115" y="142" width="100" height="12" rx="4" fill="#ffffff" />
    </g>

    <!-- Card 6 (Row 2) -->
    <g transform="translate(710, 215)">
      <rect x="0" y="0" width="330" height="190" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)" />
      <rect x="268" y="16" width="44" height="20" rx="10" fill="url(#newBadgeGrad)" />
      <rect x="20" y="22" width="205" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="46" width="160" height="15" rx="4" fill="#1b2559" />
      <rect x="20" y="78" width="185" height="11" rx="4" fill="#707ebe" opacity="0.8" />
      <rect x="20" y="126" width="290" height="44" rx="12" fill="#007bff" />
      <rect x="115" y="142" width="100" height="12" rx="4" fill="#ffffff" />
    </g>
  </g>

  <!-- Floating Home FAB (Bottom Right) -->
  <circle cx="1140" cy="740" r="28" fill="url(#purpleGrad)" />
  <path d="M1130 739 l10 -8 l10 8 v11 h-6 v-6 h-8 v6 h-6 z" fill="#ffffff" />
</svg>