<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="glowBlue" cx="25%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#040916" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#040916" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="topAccentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="primaryBtnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Cyber Dark Background & Grid -->
  <rect width="1200" height="800" fill="#040916" />
  <rect width="1200" height="800" fill="url(#cyberGrid)" />
  <rect width="1200" height="800" fill="url(#glowBlue)" />
  <rect width="1200" height="800" fill="url(#glowPurple)" />

  <!-- Top Floating Navigation Pills -->
  <g transform="translate(365, 36)">
    <!-- Back to Classes Pill -->
    <rect x="0" y="0" width="96" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.12" />
    <path d="M18 17h10M22 13l-4 4 4 4" fill="none" stroke="#eef4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="36" y="13" width="44" height="8" rx="4" fill="#eef4ff" />

    <!-- PM Roitx Hub Status Pill -->
    <rect x="345" y="0" width="125" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="363" cy="17" r="4" fill="#10b981" />
    <rect x="375" y="13" width="78" height="8" rx="4" fill="#eef4ff" />
  </g>

  <!-- Main Glassmorphism Viewer Card -->
  <g transform="translate(365, 92)">
    <rect x="0" y="0" width="470" height="635" rx="28" fill="#0d1630" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
    <!-- Top Cyan-Violet Glow Border Line -->
    <rect x="70" y="0" width="330" height="2.5" rx="1.25" fill="url(#topAccentLine)" />

    <!-- Header Row with New Advanced Open-Book Icon -->
    <g transform="translate(24, 28)">
      <rect x="0" y="0" width="54" height="54" rx="16" fill="url(#iconBoxGrad)" />
      <!-- Open Book Left & Right Pages -->
      <path d="M27 16C24.5 14.3 20.2 14 16.5 15C15.7 15.2 15 15.9 15 16.8V30.7C15 31.7 15.9 32.4 16.9 32.2C20.4 31.4 24.5 31.8 27 33.5V16Z" fill="#ffffff" />
      <path d="M27 16C29.5 14.3 33.8 14 37.5 15C38.3 15.2 39 15.9 39 16.8V30.7C39 31.7 38.1 32.4 37.1 32.2C33.6 31.4 29.5 31.8 27 33.5V16Z" fill="#dbeafe" />
      <line x1="18.5" y1="20" x2="24" y2="20.5" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" />
      <line x1="18.5" y1="24" x2="24" y2="24.5" stroke="#6366f1" stroke-width="1.8" stroke-linecap="round" />
      <!-- Ribbon & Sparkle -->
      <path d="M32 14.6V23L34 21.5L36 23V14.8" fill="#f43f5e" />
      <path d="M36.5 9.5L37.5 12.5L40.5 13.5L37.5 14.5L36.5 17.5L35.5 14.5L32.5 13.5L35.5 12.5L36.5 9.5Z" fill="#fde047" />

      <!-- Title & Subtitle -->
      <rect x="70" y="8" width="165" height="20" rx="6" fill="#eef4ff" />
      <rect x="70" y="36" width="245" height="10" rx="4" fill="#8ea5c9" opacity="0.8" />
    </g>

    <!-- 3-Step Interactive Progress Bar -->
    <g transform="translate(24, 104)">
      <rect x="0" y="0" width="422" height="44" rx="14" fill="#060d1f" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.06" />
      
      <!-- Step 1: Active -->
      <rect x="6" y="6" width="132" height="32" rx="10" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-opacity="0.4" />
      <circle cx="38" cy="22" r="9" fill="#3b82f6" />
      <rect x="54" y="18" width="44" height="8" rx="4" fill="#93c5fd" />

      <!-- Step 2 -->
      <circle cx="176" cy="22" r="9" fill="#ffffff" fill-opacity="0.08" />
      <rect x="192" y="18" width="52" height="8" rx="4" fill="#8ea5c9" opacity="0.7" />

      <!-- Step 3 -->
      <circle cx="316" cy="22" r="9" fill="#ffffff" fill-opacity="0.08" />
      <rect x="332" y="18" width="54" height="8" rx="4" fill="#8ea5c9" opacity="0.7" />
    </g>

    <!-- Step 1 Dropdown -->
    <g transform="translate(24, 172)">
      <rect x="2" y="0" width="110" height="8" rx="3" fill="#8ea5c9" opacity="0.7" />
      <rect x="0" y="16" width="422" height="52" rx="14" fill="#081026" stroke="#ffffff" stroke-opacity="0.12" />
      <circle cx="24" cy="42" r="8" fill="none" stroke="#60a5fa" stroke-width="2" />
      <rect x="46" y="37" width="115" height="10" rx="4" fill="#eef4ff" opacity="0.9" />
      <path d="M394 39 l6 6 l6 -6" fill="none" stroke="#9fb4d6" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Step 2 Dropdown -->
    <g transform="translate(24, 260)">
      <rect x="2" y="0" width="105" height="8" rx="3" fill="#8ea5c9" opacity="0.7" />
      <rect x="0" y="16" width="422" height="52" rx="14" fill="#081026" stroke="#ffffff" stroke-opacity="0.12" />
      <rect x="16" y="34" width="16" height="16" rx="3" fill="none" stroke="#60a5fa" stroke-width="2" />
      <rect x="46" y="37" width="145" height="10" rx="4" fill="#8ea5c9" opacity="0.6" />
      <path d="M394 39 l6 6 l6 -6" fill="none" stroke="#9fb4d6" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Step 3 Dropdown -->
    <g transform="translate(24, 348)">
      <rect x="2" y="0" width="105" height="8" rx="3" fill="#8ea5c9" opacity="0.7" />
      <rect x="0" y="16" width="422" height="52" rx="14" fill="#081026" stroke="#ffffff" stroke-opacity="0.12" />
      <line x1="16" y1="37" x2="32" y2="37" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="42" x2="32" y2="42" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
      <line x1="16" y1="47" x2="32" y2="47" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
      <rect x="46" y="37" width="160" height="10" rx="4" fill="#8ea5c9" opacity="0.6" />
      <path d="M394 39 l6 6 l6 -6" fill="none" stroke="#9fb4d6" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Action Buttons Row -->
    <g transform="translate(24, 452)">
      <!-- Preview Button -->
      <rect x="0" y="0" width="205" height="50" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" />
      <rect x="65" y="19" width="75" height="11" rx="4" fill="#eef4ff" />

      <!-- View Full Primary Gradient Button -->
      <rect x="217" y="0" width="205" height="50" rx="14" fill="url(#primaryBtnGrad)" />
      <rect x="275" y="19" width="90" height="11" rx="4" fill="#ffffff" />
    </g>
  </g>
</svg>