<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found (404) | Roitx</title>
<meta name="description" content="The page you’re looking for doesn’t exist or has moved.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030712">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" defer></script>
<style>
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#030712;--panel:rgba(15,23,42,.7);--line:rgba(255,255,255,.12);--text:#F8FAFC;--muted:#A3B0C2;--cyan:#00D2FF;--blue:#0088FF;--sky:#38BDF8;--red:#EF4444}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(90px);pointer-events:none}
.glow.a{top:8%;left:6%;background:radial-gradient(circle,rgba(0,210,255,.32),transparent 70%);animation:breathe 7s ease-in-out infinite alternate}
.glow.b{bottom:8%;right:6%;background:radial-gradient(circle,rgba(239,68,68,.24),transparent 70%);animation:breathe 9s ease-in-out infinite alternate-reverse}
@keyframes breathe{from{transform:scale(1) translate(0,0);opacity:.5}to{transform:scale(1.3) translate(30px,-20px);opacity:.95}}

.panel{position:relative;z-index:2;width:100%;max-width:460px;text-align:center;padding:34px 28px 26px;border-radius:28px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:0 25px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .25s ease-out;will-change:transform}
.panel::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ang),transparent 0 62%,var(--cyan) 82%,var(--red) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite}
@keyframes spin{to{--ang:360deg}}

.in{opacity:0;transform:translateY(16px);animation:enter .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes enter{to{opacity:1;transform:none}}

.art{position:relative;width:170px;height:170px;margin:0 auto 6px;display:grid;place-items:center}
.art::before{content:"";position:absolute;inset:4%;border-radius:50%;border:1.5px dashed rgba(56,189,248,.45);animation:rot 18s linear infinite;pointer-events:none}
.art::after{content:"";position:absolute;inset:4%;border-radius:50%;animation:rot 6s linear infinite;pointer-events:none;background:radial-gradient(circle at 50% 0,var(--cyan) 0 4px,transparent 5px)}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-8px)}}
.art svg{position:relative;max-width:100%;max-height:100%}

.code{position:relative;display:inline-block;font-family:'Orbitron',system-ui,sans-serif;font-weight:900;line-height:1;letter-spacing:.04em;font-size:clamp(56px,16vw,80px);background:linear-gradient(180deg,#fff 20%,var(--cyan));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.code::before,.code::after{content:attr(data-text);position:absolute;inset:0;-webkit-text-fill-color:currentColor;background:none;opacity:0}
.code::before{color:var(--cyan);animation:glitchA 4.5s steps(1) infinite}
.code::after{color:var(--red);animation:glitchB 4.5s steps(1) infinite}
@keyframes glitchA{0%,86%,100%{opacity:0}87%{opacity:.9;transform:translate(-4px,1px);clip-path:inset(10% 0 55% 0)}91%{opacity:.9;transform:translate(3px,-1px);clip-path:inset(60% 0 8% 0)}95%{opacity:0}}
@keyframes glitchB{0%,86%,100%{opacity:0}88%{opacity:.9;transform:translate(4px,-1px);clip-path:inset(55% 0 12% 0)}92%{opacity:.9;transform:translate(-3px,1px);clip-path:inset(8% 0 62% 0)}96%{opacity:0}}

h1{margin:14px 0 8px;font-family:'Orbitron',system-ui,sans-serif;font-size:.9rem;font-weight:900;letter-spacing:.14em;color:var(--red)}
.msg{color:var(--muted);font-size:.95rem;line-height:1.6;max-width:36ch;margin:0 auto;min-height:3.2em}
.path{display:inline-block;max-width:100%;margin:14px 0 12px;padding:6px 12px;border-radius:10px;font:.8rem/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--sky);background:rgba(255,255,255,.05);border:1px solid var(--line);word-break:break-all}
.hearts{display:flex;justify-content:center;gap:8px;font-size:1.15rem;margin-bottom:20px}
.hearts span{display:inline-block;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.15)}}

.actions{display:flex;flex-direction:column;gap:10px}
.btn{position:relative;overflow:hidden;display:block;padding:14px 20px;border-radius:14px;font:inherit;font-size:.92rem;font-weight:700;text-decoration:none;cursor:pointer;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.1)}
.btn.primary{border:0;color:#03111F;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 24px rgba(0,210,255,.35)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.5s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-80%}100%{left:140%}}
.btn.primary:hover{box-shadow:0 0 36px rgba(0,210,255,.65)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.foot{margin-top:18px;font-size:.8rem;font-weight:700;letter-spacing:.2em;color:#64748B}


.art>.fb,.art>.lt{display:grid;place-items:center;width:100%;height:100%}
.art>.lt{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.art>.fb,.art>.lt{animation:bob 4s ease-in-out infinite alternate}
.fbspin{transform-box:fill-box;transform-origin:center;animation:fbspin 8s linear infinite}
.fbspinr{transform-box:fill-box;transform-origin:center;animation:fbspin 5.3s linear infinite reverse}
.fbfloat{animation:fbfloat 3s ease-in-out infinite alternate}
.fbblink{animation:fbblink 1.4s ease-in-out infinite}
.fbflame{transform-box:fill-box;transform-origin:top center;animation:fbflame .35s ease-in-out infinite alternate}
.fbbeam{animation:fbdash 1.2s linear infinite}
@keyframes fbspin{to{transform:rotate(360deg)}}
@keyframes fbfloat{to{transform:translateY(-5px)}}
@keyframes fbblink{50%{opacity:.2}}
@keyframes fbflame{to{transform:scaleY(1.35)}}
@keyframes fbdash{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>

<main class="panel" id="panel">
  <div id="art" class="art in" style="--d:.05s" aria-hidden="true">
    <div class="fb"><svg viewBox="0 0 120 120" width="150" height="150" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="60" r="34"/><ellipse cx="60" cy="60" rx="58" ry="16" transform="rotate(-24 60 60)" stroke-opacity=".6"/><circle class="fbblink" cx="50" cy="54" r="3" fill="#38BDF8"/><circle class="fbblink" cx="70" cy="54" r="3" fill="#38BDF8"/><path d="M48 74c7-6 17-6 24 0"/></svg></div><div class="lt"></div>
  </div>

  <div class="in" style="--d:.2s"><div class="code" id="code" data-text="404" role="img" aria-label="Error 404">404</div></div>
  <h1 class="in" style="--d:.3s" id="title">PATH NOT FOUND</h1>
  <p class="msg in" style="--d:.4s" id="msg">Looks like you've drifted into deep space.<br>Let's get you safely back home!</p>
  <div class="in" style="--d:.5s"><div class="path" id="path" title="Requested address">/</div></div>
  <div class="hearts in" style="--d:.55s" id="hearts" aria-hidden="true"><span>❤️</span><span>💙</span><span>💜</span><span>💚</span></div>

  <nav class="actions in" style="--d:.65s" aria-label="Recovery options">
    <a class="btn primary" href="https://roitx.github.io/">Go to homepage</a>
    <a class="btn" href="javascript:history.back()" id="back">Go back</a>
  </nav>
  <p class="foot in" style="--d:.75s">ROITX</p>
</main>

<script>
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.getElementById('path').textContent = location.pathname + location.search;
  if (history.length < 2) document.getElementById('back').hidden = true;

  // Random paired copy + hearts
  var messages = [
    "Looks like you've drifted into deep space.<br>Let's get you safely back home!",
    "Oops! The page you are looking for morphed into another dimension.",
    "You found a black hole in Roitx Multiverse!<br>Don't worry, we got your back.",
    "Lost in cyberspace?<br>Take a breath and head back to safety."
  ];
  var titles = ["LOST IN SPACE","DIMENSION MISMATCH","SIGNAL LOST","PAGE UNREACHABLE"];
  var heartSets = [["❤️","💙","💜","💚","🧡"],["🤍","🤎","💙","💜","💖"],["💜","💚","💛","💙","❤️"],["🧡","💙","🤍","💜","💚"]];
  var r = Math.floor(Math.random() * messages.length);
  document.getElementById('title').textContent = titles[r];
  document.getElementById('msg').innerHTML = messages[r];
  var hb = document.getElementById('hearts'); hb.innerHTML = '';
  heartSets[r].forEach(function (h, i) { var s = document.createElement('span'); s.textContent = h; s.style.animationDelay = (i * .18) + 's'; hb.appendChild(s); });

  // ---- Welcome listener: roitx.qd.je (Aasaan Hisaab) ke 404 se aane wale visitors ke liye pyara message ----
  var cameFromOldSite = false, cleanSearch = location.search;
  try {
    var qs = new URLSearchParams(location.search);
    if (qs.get('from') === 'roitx-qd') {
      cameFromOldSite = true;
      qs.delete('from');
      cleanSearch = qs.toString() ? '?' + qs.toString() : '';
    }
  } catch (e) {}
  try {
    if (!cameFromOldSite && document.referrer && new URL(document.referrer).hostname === 'roitx.qd.je') cameFromOldSite = true;
  } catch (e) {}

  if (cameFromOldSite) {
    try { history.replaceState(null, '', location.pathname + cleanSearch + location.hash); } catch (e) {}   // address bar saaf rakho
    document.title = 'Welcome back | Roitx';
    var ttl = document.getElementById('title');
    ttl.textContent = 'WELCOME BACK';
    ttl.style.color = 'var(--sky)';
    document.getElementById('msg').innerHTML = 'Welcome to your previous site! \uD83D\uDC99<br>Is pareshani ke liye hame khed hai.<br>Hum naye address par aa gaye hain, chaliye aapko sahi jagah le chalte hain.';
    document.getElementById('path').textContent = location.pathname + cleanSearch;
    hb.innerHTML = '';
    ['\uD83D\uDC99', '\uD83D\uDC9C', '\uD83D\uDC9A', '\uD83E\uDDE1', '\u2764\uFE0F'].forEach(function (h, i) {
      var sp = document.createElement('span'); sp.textContent = h; sp.style.animationDelay = (i * .18) + 's'; hb.appendChild(sp);
    });
    var homeBtn = document.querySelector('.btn.primary');
    if (homeBtn) { homeBtn.href = '/'; homeBtn.textContent = 'Take me to the homepage'; }
    document.getElementById('back').hidden = true;   // back dabane par wapas redirect wale page par jaate, isliye hata diya
  }

  // 404 count-up
  var code = document.getElementById('code');
  if (!reduce) {
    var t0 = performance.now();
    (function count(now) {
      var p = Math.min((now - t0) / 1100, 1), v = Math.round(404 * (1 - Math.pow(1 - p, 3)));
      code.textContent = ('00' + v).slice(-3); code.setAttribute('data-text', code.textContent);
      if (p < 1) requestAnimationFrame(count);
    })(t0);
  }

  // Starfield + shooting stars
  var cv = document.getElementById('fx'), cx = cv.getContext('2d'), W, H, S = [], shots = [], dpr = Math.min(devicePixelRatio || 1, 2);
  function size() {
    W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    var n = Math.min(130, Math.floor(W * H / 9000)); S = [];
    for (var i = 0; i < n; i++) S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*6.28,s:Math.random()*.02+.005,v:Math.random()*.15+.03});
  }
  function draw(move) {
    cx.clearRect(0,0,W,H);
    for (var i = 0; i < S.length; i++) {
      var p = S[i]; if (move) { p.a += p.s; p.y += p.v; if (p.y > H) { p.y = 0; p.x = Math.random()*W; } }
      cx.fillStyle = 'rgba(186,230,253,' + (.35 + .45 * Math.sin(p.a)) + ')'; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    }
    for (var k = shots.length - 1; k >= 0; k--) {
      var m = shots[k]; m.x += m.vx; m.y += m.vy; m.life -= .016;
      var g = cx.createLinearGradient(m.x, m.y, m.x - m.vx * 9, m.y - m.vy * 9);
      g.addColorStop(0, 'rgba(255,255,255,' + Math.max(m.life,0) + ')'); g.addColorStop(1, 'rgba(0,210,255,0)');
      cx.strokeStyle = g; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(m.x,m.y); cx.lineTo(m.x - m.vx*9, m.y - m.vy*9); cx.stroke();
      if (m.life <= 0) shots.splice(k, 1);
    }
  }
  size(); addEventListener('resize', function(){ size(); if (reduce) draw(false); });
  if (reduce) { draw(false); } else {
    (function loop(){ if (!document.hidden) draw(true); requestAnimationFrame(loop); })();
    (function launch(){
      if (!document.hidden) shots.push({x:Math.random()*W*.8,y:Math.random()*H*.4,vx:7+Math.random()*4,vy:3+Math.random()*3,life:1});
      setTimeout(launch, 2200 + Math.random() * 3000);
    })();
    var panel = document.getElementById('panel');
    if (matchMedia('(pointer:fine)').matches) {
      addEventListener('pointermove', function (e) {
        var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
        panel.style.transform = 'perspective(900px) rotateY(' + (x*7) + 'deg) rotateX(' + (-y*7) + 'deg)';
      });
      document.addEventListener('pointerleave', function(){ panel.style.transform = ''; });
    }
  }

  // Offline fallback illustrations (random, built in) + Lottie swap-in
  var FALLBACKS = [
    `<svg viewBox="0 0 120 120" width="150" height="150" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="60" r="34"/><ellipse cx="60" cy="60" rx="58" ry="16" transform="rotate(-24 60 60)" stroke-opacity=".6"/><circle class="fbblink" cx="50" cy="54" r="3" fill="#38BDF8"/><circle class="fbblink" cx="70" cy="54" r="3" fill="#38BDF8"/><path d="M48 74c7-6 17-6 24 0"/></svg>`,
    `<svg viewBox="0 0 120 120" width="150" height="150" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g class="fbfloat"><circle cx="60" cy="54" r="30"/><rect x="38" y="42" width="44" height="26" rx="13" stroke="#00D2FF"/><path d="M46 52q3-4 8-4" stroke-width="3" stroke="#00D2FF"/><path d="M60 24V14"/><circle class="fbblink" cx="60" cy="11" r="3" fill="#EF4444" stroke="#EF4444"/><path d="M34 106c0-16 12-24 26-24s26 8 26 24"/></g></svg>`,
    `<svg viewBox="0 0 120 120" width="150" height="150" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g class="fbfloat"><path d="M42 54a18 18 0 0 1 36 0"/><ellipse cx="60" cy="62" rx="34" ry="10"/><circle class="fbblink" cx="42" cy="63" r="2.5" fill="#00D2FF" stroke="none"/><circle class="fbblink" cx="60" cy="67" r="2.5" fill="#EF4444" stroke="none" style="animation-delay:.4s"/><circle class="fbblink" cx="78" cy="63" r="2.5" fill="#00D2FF" stroke="none" style="animation-delay:.8s"/></g><path class="fbbeam" d="M48 76l-14 28h52L72 76" stroke-dasharray="4 5" stroke-opacity=".7"/></svg>`
  ];
  var artBox = document.getElementById('art'), fbBox = artBox.querySelector('.fb'), ltBox = artBox.querySelector('.lt');
  fbBox.innerHTML = FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
  addEventListener('load', function () {
    if (!window.lottie) { console.warn('[Roitx] Lottie library not loaded, using built-in fallback'); ltBox.remove(); return; }
    var TOTAL = 2, n = Math.floor(Math.random() * TOTAL) + 1, shown = false;
    var paths = ['/assets/3d/404_' + n + '.json', 'assets/3d/404_' + n + '.json'];
    function show() { if (shown) return; shown = true; ltBox.style.opacity = 1; setTimeout(function () { fbBox.style.display = 'none'; }, 500); }
    (function attempt(i) {
      if (i >= paths.length) { console.warn('[Roitx] Animation JSON not found, using built-in fallback. Tried:', paths); ltBox.remove(); return; }
      var anim;
      try { anim = lottie.loadAnimation({container: ltBox, renderer: 'svg', loop: !reduce, autoplay: !reduce, path: paths[i]}); }
      catch (e) { console.warn('[Roitx] Lottie error:', e); attempt(i + 1); return; }
      anim.addEventListener('DOMLoaded', function () { console.info('[Roitx] Loaded', paths[i]); show(); });
      anim.addEventListener('data_failed', function () { console.warn('[Roitx] Failed to load', paths[i]); anim.destroy(); attempt(i + 1); });
    })(0);
  });
})();
</script>
</body>
</html>
