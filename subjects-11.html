        }

        .stream-btn:focus-visible {

        @media (hover: hover) {

                background: #eaffea;
                box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            }
        }

        .stream-svg-icon {

            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;

        @media (min-width: 720px) {
            body { padding-top: 40px; }

            .stream-btn {
                flex-direction: column;
                min-height: 190px;
                gap: 16px;
                font-size: 24px;
                border-radius: 18px;
            }
            .stream-svg-icon { width: 52px; height: 52px; }
        }

        @media (prefers-reduced-motion: reduce) {

            .stream-btn:hover, .stream-btn:active { transform: none; }

        /* Movable Floating Action Container */
        .floating-container {
            position: fixed;
            bottom: 25px;

            touch-action: none;
        }

        /* Main Floating Toggle Button */
        .home-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c4dff, #3d5afe);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 18px rgba(61, 90, 254, 0.6), 0 6px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;

</div>

<script>
  // Draggable & Toggle Menu Logic
  const container = document.getElementById('floatingContainer');
  const homeBtn = document.getElementById('movableHomeBtn');
  
  let isDragging = false;
  let hasDragged = false;
  let startX, startY, initialLeft, initialTop;

  function dragStart(clientX, clientY) {
    isDragging = true;
    hasDragged = false;
    startX = clientX;
    startY = clientY;
    
    const rect = container.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
    
    container.style.bottom = 'auto';
    container.style.right = 'auto';
    container.style.left = `${initialLeft}px`;
    container.style.top = `${initialTop}px`;
  }

  function dragMove(clientX, clientY) {
    if (!isDragging) return;
    const deltaX = clientX - startX;
    const deltaY = clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
      container.classList.remove('active');
    }

    container.style.left = `${initialLeft + deltaX}px`;
    container.style.top = `${initialTop + deltaY}px`;
  }

  // Events setup
  homeBtn.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  document.addEventListener('touchmove', (e) => { if(isDragging) dragMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  document.addEventListener('touchend', () => { isDragging = false; });

  homeBtn.addEventListener('mousedown', (e) => dragStart(e.clientX, e.clientY));
  document.addEventListener('mousemove', (e) => { if(isDragging) dragMove(e.clientX, e.clientY); });
  document.addEventListener('mouseup', () => { isDragging = false; });

  // Toggle Menu on Click
  homeBtn.addEventListener('click', (e) => {
    if (hasDragged) return;
    container.classList.toggle('active');
  });

  // Close menu when clicking outside
  document.addEventListener('click', (e) => {
    if (!container.contains(e.target)) {
      container.classList.remove('active');
    }
  });
</script>
