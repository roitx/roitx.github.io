<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Working On It | Roitx</title>

    <meta name="description" content="We are crafting something special for you. Stay tuned as Roitx updates this section.">
    <meta name="keywords" content="Roitx, Under Construction, Coming Soon, Roitx AI">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0B0F19">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Reliable Lottie Player Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B0F19;
            font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
            color: #FFFFFF;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        /* Animated Ambient Mesh Gradients */
        .glow-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
            top: -50px;
            left: -50px;
            filter: blur(90px);
            animation: moveGlow1 8s infinite alternate ease-in-out;
        }

        .glow-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, transparent 70%);
            bottom: -50px;
            right: -50px;
            filter: blur(90px);
            animation: moveGlow2 10s infinite alternate ease-in-out;
        }

        @keyframes moveGlow1 { 0% { transform: translate(0, 0); } 100% { transform: translate(60px, 60px); } }
        @keyframes moveGlow2 { 0% { transform: translate(0, 0); } 100% { transform: translate(-60px, -60px); } }

        /* Modern Glassmorphism Card */
        .card {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 42px 30px 32px;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 36px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: floatCard 4s ease-in-out infinite alternate;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* Live Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #818CF8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #818CF8;
            border-radius: 50%;
            box-shadow: 0 0 10px #818CF8;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .character-3d {
            width: 210px;
            height: 210px;
            margin: 0 auto 10px auto;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.4));
        }

        h1 {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.9rem;
            color: #94A3B8;
            line-height: 1.6;
            font-weight: 500;
        }

        .small {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #64748B;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <main class="card">
        <div class="status-badge">
            <span class="dot"></span> IN PROGRESS
        </div>

        <div id="lottie-dev" class="character-3d"></div>

        <h1 id="work-title">I am working on it ❤️</h1>
        <p id="work-desc">
            Please give me a little time.<br>
            Something beautiful is coming for you ✨
        </p>

        <div class="small">— ROITX —</div>
    </main>

    <script>
        // Random Heart Colors
        const hearts = ['❤️', '💙', '💚', '💜', '🤎', '🤍'];

        // Dynamic Text Messages
        const messages = [
            "Crafting something amazing for you ",
            "Building next-gen experience ",
            "Writing fine code with passion ",
            "Upgrading system core features ",
            "Almost ready, sit back and relax "
        ];

        // Total animations in assets/3d/ folder (working_1.json to working_5.json)
        const totalAnimations = 5; 

        // Random Index Generator (1 to 5)
        const randomAnimIndex = Math.floor(Math.random() * totalAnimations) + 1;
        
        // Random Selection for Hearts & Messages
        const randomHeart = hearts[Math.floor(Math.random() * hearts.length)];
        const msgIndex = Math.floor(Math.random() * messages.length);
        const randomMsg = messages[msgIndex];

        // Update Dynamic Heading & Description
        document.getElementById('work-title').innerText = "I am working on it " + randomHeart;
        document.getElementById('work-desc').innerHTML = randomMsg + randomHeart + "<br>Something beautiful is coming for you ✨";

        // Load Local JSON File Dynamically (e.g., assets/3d/working_1.json)
        lottie.loadAnimation({
            container: document.getElementById('lottie-dev'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: `assets/3d/working_${randomAnimIndex}.json`
        });
    </script>
</body>
</html>
