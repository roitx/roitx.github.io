<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Secure Payment Approvals</title>
    <link rel="stylesheet" href="premium.css">
    <!-- Supabase CDN + Central Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        /* 🛡️ Anti-Screenshot & Security Styling */
        body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Security Warning Banner */
        .security-banner {
            background: rgba(255, 71, 87, 0.12);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            font-size: 0.75rem;
            text-align: center;
            padding: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .admin-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .admin-header h1 {
            font-size: 1.3rem;
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header span.badge-admin {
            font-size: 0.7rem;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #fff;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(0, 210, 255, 0.3);
        }

        .admin-header p {
            margin: 6px 0 0 0;
            font-size: 0.8rem;
            color: #8a99ad;
        }

        .card {
            background: #111622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }

        select, input[type="text"] {
            width: 100%;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
        }

        select:focus, input[type="text"]:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .orders-table th, .orders-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .orders-table th {
            background: rgba(255, 255, 255, 0.03);
            color: #00d2ff;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-approve {
            background: linear-gradient(135deg, #2ed573, #1e7e34);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            box-shadow: 0 2px 8px rgba(46, 213, 115, 0.3);
            transition: transform 0.1s;
        }

        .btn-approve:active { transform: scale(0.95); }

        .btn-reject {
            background: linear-gradient(135deg, #ff4757, #c0392b);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.3);
            transition: transform 0.1s;
        }

        .btn-reject:active { transform: scale(0.95); }

        .badge-status {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .status-pending { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid rgba(255, 165, 0, 0.3); }
        .status-approved { background: rgba(46, 213, 115, 0.15); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.3); }
        .status-rejected { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="admin-container" style="max-width: 950px; margin: 0 auto; padding: 12px;">
        
        <!-- 🔒 Strict Admin Access Banner -->
        <div class="security-banner">
            ⚠️ RESTRICTED AREA: Authorized Admin Personnel Only. All activities are monitored.
        </div>

        <header class="admin-header">
            <div class="header-top">
                <h1>Admin Panel</h1>
                <span class="badge-admin">Payment Approvals</span>
            </div>
            <p>Verify user UTR codes securely and unlock study notes instantly.</p>
        </header>

        <section class="card">
            <!-- Search & Filter Controls -->
            <div class="filter-grid">
                <div>
                    <select id="statusFilter" onchange="filterOrders()">
                        <option value="pending" selected>Pending Only</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="ALL">All Orders</option>
                    </select>
                </div>
                <div>
                    <input type="text" id="searchInput" placeholder="🔍 Search by Email or UTR Code..." oninput="filterOrders()">
                </div>
            </div>

            <!-- Orders Table -->
            <div class="table-responsive">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Note Title</th>
                            <th>Amount</th>
                            <th>UTR Code</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; color:#888; padding: 20px;">Loading payment orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let cachedOrders = [];

        window.onload = async () => {
            if (typeof window.requireAdminAuth === "function") {
                await window.requireAdminAuth();
            }
            await fetchOrders();
        };

        // 🚫 Screenshot / Screen Recording Blocker Warning Layer
        document.addEventListener("keyup", (e) => {
            if (e.key == "PrintScreen") {
                navigator.clipboard.writeText("");
                alert("🔒 Screenshots & Screen Captures are disabled on this Secure Admin Panel!");
            }
        });

        async function fetchOrders() {
            const { data, error } = await window.supabaseClient
                .from('user_orders')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Orders fetch error:", error);
                document.getElementById('ordersTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ff4757;">Error loading: ${error.message}</td></tr>`;
                return;
            }

            cachedOrders = data || [];
            filterOrders();
        }

        function filterOrders() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = cachedOrders.filter(order => {
                const matchStatus = (statusFilter === 'ALL') || (order.status === statusFilter);
                
                const emailStr = (order.user_email || '').toLowerCase();
                const utrStr = (order.utr_code || '').toLowerCase();
                const matchSearch = !searchQuery || emailStr.includes(searchQuery) || utrStr.includes(searchQuery);

                return matchStatus && matchSearch;
            });

            renderTable(filtered);
        }

        function renderTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = "";

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888; padding: 20px;">No orders found.</td></tr>`;
                return;
            }

            orders.forEach(order => {
                let statusBadge = `<span class="badge-status status-${order.status}">${order.status}</span>`;
                
                let actionButtons = '-';
                if (order.status === 'pending') {
                    actionButtons = `
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveOrder(${order.id}, '${order.user_email}', ${order.note_id})">Approve</button>
                            <button class="btn-reject" onclick="rejectOrder(${order.id})">Reject</button>
                        </div>
                    `;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color:#fff;">${order.user_email}</strong></td>
                        <td style="color:#d1d5db;">${order.note_title}</td>
                        <td style="color:#2ed573; font-weight:bold;">₹${order.amount}</td>
                        <td style="font-family:monospace; color:#00d2ff; font-weight:bold;">${order.utr_code}</td>
                        <td>${statusBadge}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
            });
        }

        async function approveOrder(orderId, userEmail, noteId) {
            if (!confirm(`Confirm approval for ${userEmail}?`)) return;

            try {
                const { data: userData, error: userErr } = await window.supabaseClient
                    .from('profiles')
                    .select('id')
                    .eq('email', userEmail)
                    .single();

                let userId = userData ? userData.id : null;

                const { error: orderErr } = await window.supabaseClient
                    .from('user_orders')
                    .update({ status: 'approved' })
                    .eq('id', orderId);

                if (orderErr) throw orderErr;

                if (userId && noteId) {
                    await window.supabaseClient
                        .from('user_purchases')
                        .insert([{
                            user_id: userId,
                            note_id: noteId,
                            txn_id: `MANUAL_UTR_${orderId}`
                        }]);
                }

                alert("🎉 Order Approved & Access Granted!");
                await fetchOrders();

            } catch (err) {
                alert("Approval Error: " + err.message);
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm("Are you sure you want to REJECT this payment?")) return;

            try {
                const { error } = await window.supabaseClient
                    .from('user_orders')
                    .update({ status: 'rejected' })
                    .eq('id', orderId);

                if (error) throw error;

                alert("Order Rejected ❌");
                await fetchOrders();
            } catch (err) {
                alert("Reject Error: " + err.message);
            }
        }
    </script>
</body>
</html>
