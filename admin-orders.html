<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Payment Approvals | PM-Roit</title>
    <link rel="stylesheet" href="premium.css">
    <!-- FontAwesome for Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase CDN + Central Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: rgba(17, 24, 39, 0.75);
            --accent-cyan: #00d2ff;
            --accent-blue: #0072ff;
            --accent-purple: #7928ca;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            -webkit-user-select: none;
            user-select: none;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Radial Background Glows */
        .bg-glow-1 {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(121, 40, 202, 0.15) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        .admin-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: clamp(12px, 3vw, 24px);
        }

        .admin-header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: clamp(16px, 4vw, 22px);
            margin-bottom: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-header h1 {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
        }

        .badge-admin {
            font-size: 0.72rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background: linear-gradient(145deg, rgba(18, 24, 38, 0.9), rgba(26, 35, 51, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: clamp(14px, 3vw, 22px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 230px 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        @media (max-width: 650px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }

        /* CUSTOM DROPDOWN STYLING */
        .custom-dropdown {
            position: relative;
            user-select: none;
        }

        .dropdown-trigger {
            background: rgba(13, 18, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 11px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .dropdown-trigger:hover {
            border-color: var(--accent-cyan);
            background: #0f1624;
        }

        .dropdown-menu {
            position: absolute;
            top: 110%;
            left: 0;
            right: 0;
            background: #0f1624;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .dropdown-menu.show {
            display: flex;
        }

        .dropdown-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.83rem;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .dropdown-item:hover, .dropdown-item.active {
            background: rgba(0, 210, 255, 0.15);
            color: var(--accent-cyan);
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--accent-cyan);
            font-size: 0.85rem;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(13, 18, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 11px 14px 11px 40px;
            border-radius: 12px;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
            background: #0f1624;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(13, 18, 29, 0.5);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            white-space: nowrap;
        }

        .orders-table th, .orders-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .orders-table th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.6px;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-info {
            background: rgba(0, 210, 255, 0.15);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 210, 255, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-info:hover {
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
            transform: translateY(-1px);
        }

        .btn-receipt {
            background: rgba(121, 40, 202, 0.2);
            color: #d8b4fe;
            border: 1px solid rgba(121, 40, 202, 0.4);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.82rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-receipt:hover {
            background: #7928ca;
            color: #fff;
            box-shadow: 0 0 12px rgba(121, 40, 202, 0.6);
            transform: translateY(-1px);
        }

        .btn-approve {
            background: linear-gradient(135deg, #2ed573, #10ac84);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            box-shadow: 0 4px 12px rgba(46, 213, 115, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-approve:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(46, 213, 115, 0.45);
        }

        .btn-reject {
            background: linear-gradient(135deg, #ff4757, #ff6b6b);
            color: #fff;
            border: none;
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.75rem;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-reject:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.45);
        }

        .badge-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-pending { background: rgba(255, 165, 0, 0.12); color: #ffa500; border: 1px solid rgba(255, 165, 0, 0.3); }
        .status-approved { background: rgba(46, 213, 115, 0.12); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.3); }
        .status-rejected { background: rgba(255, 71, 87, 0.12); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); }

        /* MODAL POPUP STYLING */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 14px;
        }

        .modal-card {
            background: #111622;
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 22px;
            box-shadow: 0 16px 45px rgba(0, 210, 255, 0.25);
            position: relative;
            color: #fff;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .modal-close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: #ff4757;
            color: #fff;
            transform: rotate(90deg);
        }

        .user-profile-avatar {
            width: 75px; 
            height: 75px;
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            overflow: hidden;
            border: 2px solid var(--accent-cyan);
        }

        .user-profile-avatar img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .profile-field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
            text-align: left;
        }

        .profile-field {
            background: rgba(255,255,255,0.03);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .profile-field label {
            display: block;
            font-size: 0.68rem;
            color: var(--accent-cyan);
            margin-bottom: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .profile-field span {
            font-size: 0.83rem;
            color: #fff;
            word-break: break-all;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <script>
        let cachedOrders = [];
        let currentStatusFilter = 'pending';

        window.onload = async () => {
            if (typeof window.requireAdminAuth === "function") {
                await window.requireAdminAuth();
            }
            await fetchOrders();
        };

        function toggleDropdown() {
            const menu = document.getElementById('dropdownMenu');
            menu.classList.toggle('show');
        }

        function selectFilter(status, htmlContent, element) {
            currentStatusFilter = status;
            document.getElementById('selectedOption').innerHTML = htmlContent;
            document.querySelectorAll('.dropdown-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('dropdownMenu').classList.remove('show');
            filterOrders();
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('statusDropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        document.addEventListener("keyup", (e) => {
            if (e.key === "PrintScreen") {
                navigator.clipboard.writeText("");
                alert("🔒 Screenshots & Screen Captures are disabled on this Admin Panel!");
            }
        });

        async function fetchOrders() {
            const { data, error } = await window.supabaseClient
                .from('user_orders')
                .select(`
                    *,
                    profiles:user_email (
                        full_name,
                        phone,
                        target_class,
                        stream,
                        institution,
                        city,
                        state,
                        avatar_url,
                        email
                    )
                `)
                .order('id', { ascending: false });

            if (error) {
                console.error("Orders fetch error:", error);
                document.getElementById('ordersTableBody').innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center; color:#ff4757; padding: 20px;">
                            <i class="fa-solid fa-triangle-exclamation"></i> Error loading data: ${error.message}
                        </td>
                    </tr>`;
                return;
            }

            cachedOrders = data || [];
            filterOrders();
        }

        function filterOrders() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = cachedOrders.filter(order => {
                const matchStatus = (currentStatusFilter === 'ALL') || (order.status === currentStatusFilter);
                const emailStr = (order.user_email || order.profiles?.email || '').toLowerCase();
                const utrStr = (order.utr_code || '').toLowerCase();
                const matchSearch = !searchQuery || emailStr.includes(searchQuery) || utrStr.includes(searchQuery);

                return matchStatus && matchSearch;
            });

            renderTable(filtered);
        }

        function renderTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = "";

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center; color:#8a99ad; padding: 30px;">
                            <i class="fa-solid fa-inbox" style="font-size: 1.8rem; display:block; margin-bottom: 8px; color:var(--accent-cyan);"></i> No matching orders found.
                        </td>
                    </tr>`;
                return;
            }

            orders.forEach(order => {
                const displayEmail = order.user_email || order.profiles?.email || 'N/A';
                let statusBadge = '';
                if (order.status === 'pending') {
                    statusBadge = `<span class="badge-status status-pending"><i class="fa-solid fa-hourglass-half"></i> PENDING</span>`;
                } else if (order.status === 'approved') {
                    statusBadge = `<span class="badge-status status-approved"><i class="fa-solid fa-circle-check"></i> APPROVED</span>`;
                } else {
                    statusBadge = `<span class="badge-status status-rejected"><i class="fa-solid fa-circle-xmark"></i> REJECTED</span>`;
                }
                
                let actionButtons = `
                    <div class="action-btns">
                        <button class="btn-info" title="View Profile Info" onclick='viewUserProfile(${JSON.stringify(order)})'>
                            <i class="fa-solid fa-user"></i>
                        </button>
                        ${order.receipt_url ? `<button class="btn-receipt" title="View Payment Screenshot" onclick='viewReceipt(${JSON.stringify(order.receipt_url)})'><i class="fa-solid fa-receipt"></i></button>` : ''}
                    </div>
                `;
                
                if (order.status === 'pending') {
                    actionButtons = `
                        <div class="action-btns">
                            <button class="btn-info" title="View Profile Info" onclick='viewUserProfile(${JSON.stringify(order)})'>
                                <i class="fa-solid fa-user"></i>
                            </button>
                            ${order.receipt_url ? `<button class="btn-receipt" title="View Payment Screenshot" onclick='viewReceipt(${JSON.stringify(order.receipt_url)})'><i class="fa-solid fa-receipt"></i></button>` : ''}
                            <button class="btn-approve" onclick="approveOrder(${order.id}, '${displayEmail}', ${order.note_id})">
                                <i class="fa-solid fa-check"></i> Approve
                            </button>
                            <button class="btn-reject" onclick="rejectOrder(${order.id})">
                                <i class="fa-solid fa-xmark"></i> Reject
                            </button>
                        </div>
                    `;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color:#fff;"><i class="fa-regular fa-envelope" style="color:#8a99ad; margin-right:5px;"></i>${displayEmail}</strong></td>
                        <td style="color:#d1d5db;">${order.note_title}</td>
                        <td style="color:#2ed573; font-weight:bold;">₹${order.amount}</td>
                        <td style="font-family:monospace; color:var(--accent-cyan); font-weight:bold; font-size: 0.88rem;">${order.utr_code}</td>
                        <td>${statusBadge}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
            });
        }

        function viewUserProfile(order) {
            const modal = document.getElementById('userProfileModal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'flex';
            
            const profile = order.profiles || {};
            const nameToShow = profile.full_name || order.user_name || 'N/A';
            const emailToShow = profile.email || order.user_email || 'N/A';
            const phoneToShow = profile.phone || order.user_phone || 'N/A';
            const classToShow = profile.target_class || order.target_class || 'N/A';
            const streamToShow = profile.stream || order.stream || 'N/A';
            const institutionToShow = profile.institution || order.institution || 'N/A';
            const cityToShow = profile.city || order.city || 'N/A';
            const stateToShow = profile.state || order.state || 'N/A';
            const avatarUrl = profile.avatar_url || order.avatar_url || '';

            const initial = nameToShow !== 'N/A' ? nameToShow.charAt(0).toUpperCase() : 'U';
            const avatarHtml = avatarUrl ? `<img src="${avatarUrl}" alt="Profile">` : initial;

            content.innerHTML = `
                <div style="text-align:center;">
                    <div class="user-profile-avatar">${avatarHtml}</div>
                    <h3 style="margin: 0; font-size: 1.15rem; color:#fff;">${nameToShow}</h3>
                    <span style="font-size: 0.78rem; color:var(--text-muted);"><i class="fa-solid fa-envelope"></i> ${emailToShow}</span>
                </div>

                <div class="profile-field-grid">
                    <div class="profile-field">
                        <label><i class="fa-solid fa-phone"></i> Phone</label>
                        <span>${phoneToShow}</span>
                    </div>
                    <div class="profile-field">
                        <label><i class="fa-solid fa-graduation-cap"></i> Class</label>
                        <span>${classToShow}</span>
                    </div>
                    <div class="profile-field">
                        <label><i class="fa-solid fa-book-open"></i> Stream</label>
                        <span>${streamToShow}</span>
                    </div>
                    <div class="profile-field">
                        <label><i class="fa-solid fa-building-columns"></i> Institution</label>
                        <span>${institutionToShow}</span>
                    </div>
                    <div class="profile-field">
                        <label><i class="fa-solid fa-city"></i> City</label>
                        <span>${cityToShow}</span>
                    </div>
                    <div class="profile-field">
                        <label><i class="fa-solid fa-map-location-dot"></i> State</label>
                        <span>${stateToShow}</span>
                    </div>
                </div>
                <div style="margin-top: 14px; text-align: center;">
                    <span style="font-size: 0.78rem; color:var(--accent-cyan); font-family:monospace;">UTR: ${order.utr_code || 'N/A'}</span>
                </div>
            `;
        }

        function viewReceipt(receiptContent) {
            const modal = document.getElementById('userProfileModal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'flex';

            let displayHtml = receiptContent;
            if (!receiptContent.includes('<img') && receiptContent.startsWith('http')) {
                displayHtml = `<img src="${receiptContent}" alt="Payment Receipt" style="width: 100%; max-height: 380px; object-fit: contain; border-radius: 8px; display: block;">`;
            }

            content.innerHTML = `
                <div style="text-align:center;">
                    <h3 style="margin: 0 0 12px 0; font-size: 1.1rem; color:#fff;"><i class="fa-solid fa-receipt" style="color:var(--accent-cyan);"></i> Payment Receipt Screenshot</h3>
                    <div style="background: #090d16; padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: inline-block; max-width: 100%;">
                        ${displayHtml}
                    </div>
                </div>
            `;
        }

        function closeProfileModal() {
            document.getElementById('userProfileModal').style.display = 'none';
        }

        async function approveOrder(orderId, userEmail, noteId) {
            if (!confirm(`Confirm payment approval for ${userEmail}?`)) return;

            try {
                const { data: orderDetails, error: fetchErr } = await window.supabaseClient
                    .from('user_orders')
                    .select('*')
                    .eq('id', orderId)
                    .single();

                if (fetchErr) throw fetchErr;

                let userId = orderDetails.user_id;
                if (!userId) {
                    const { data: userData } = await window.supabaseClient
                        .from('profiles')
                        .select('id')
                        .eq('email', userEmail)
                        .maybeSingle();
                    userId = userData ? userData.id : null;
                }

                const { error: orderErr } = await window.supabaseClient
                    .from('user_orders')
                    .update({ 
                        status: 'approved',
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', orderId);

                if (orderErr) throw orderErr;

                if (userId && noteId) {
                    await window.supabaseClient
                        .from('user_purchases')
                        .insert([{
                            user_id: userId,
                            note_id: noteId,
                            txn_id: `MANUAL_UTR_${orderId}`
                        }]);
                }

                const { data: notifData } = await window.supabaseClient
                    .from('notifications')
                    .insert([{
                        user_id: userId,
                        title: "🎉 Note Access Granted!",
                        message: `Your payment for "${orderDetails.note_title}" (UTR: ${orderDetails.utr_code}) has been verified successfully. Enjoy your study material!`,
                        link: "premium-notes.html",
                        created_at: new Date().toISOString()
                    }])
                    .select('id')
                    .single();

                if (userId && notifData && notifData.id) {
                    await window.supabaseClient
                        .from('user_notification_state')
                        .insert([{
                            user_id: userId,
                            notification_id: notifData.id,
                            is_read: false,
                            is_deleted: false,
                            updated_at: new Date().toISOString()
                        }]);
                }

                alert("🎉 Order Approved & User Notified!");
                await fetchOrders();

            } catch (err) {
                alert("Approval Error: " + err.message);
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm("Are you sure you want to REJECT this payment?")) return;

            try {
                const { data: orderData, error: fetchErr } = await window.supabaseClient
                    .from('user_orders')
                    .select('*')
                    .eq('id', orderId)
                    .single();

                if (fetchErr) throw fetchErr;

                let userId = orderData?.user_id;
                if (!userId && orderData?.user_email) {
                    const { data: userData } = await window.supabaseClient
                        .from('profiles')
                        .select('id')
                        .eq('email', orderData.user_email)
                        .maybeSingle();
                    if (userData) userId = userData.id;
                }

                const { error } = await window.supabaseClient
                    .from('user_orders')
                    .update({ 
                        status: 'rejected',
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', orderId);

                if (error) throw error;

                const { data: notifData } = await window.supabaseClient
                    .from('notifications')
                    .insert([{
                        user_id: userId,
                        title: "❌ Payment Verification Failed",
                        message: `Your payment for "${orderData.note_title}" could not be verified (UTR: ${orderData.utr_code}). Please recheck your UTR code and try submitting again.`,
                        link: "premium-notes.html",
                        created_at: new Date().toISOString()
                    }])
                    .select('id')
                    .single();

                if (userId && notifData && notifData.id) {
                    await window.supabaseClient
                        .from('user_notification_state')
                        .insert([{
                            user_id: userId,
                            notification_id: notifData.id,
                            is_read: false,
                            is_deleted: false,
                            updated_at: new Date().toISOString()
                        }]);
                }

                alert("Order Rejected & User Notified ❌");
                await fetchOrders();
            } catch (err) {
                alert("Reject Error: " + err.message);
            }
        }
    </script>
</body>
