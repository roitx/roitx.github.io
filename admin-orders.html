<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Payment Orders</title>
    <link rel="stylesheet" href="premium.css">
    <!-- Supabase CDN + Central Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        .admin-header {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
        }
        .admin-header h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-header h1 span {
            font-size: 0.75rem;
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .admin-header p {
            margin: 4px 0 0 0;
            font-size: 0.75rem;
            color: #8a99ad;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .orders-table th, .orders-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .orders-table th {
            background: rgba(255, 255, 255, 0.05);
            color: #00d2ff;
            font-weight: 600;
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }
        .btn-approve {
            background: #2ed573;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }
        .btn-reject {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .badge-status {
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(255, 165, 0, 0.2); color: #ffa500; border: 1px solid rgba(255, 165, 0, 0.4); }
        .status-approved { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid rgba(46, 213, 115, 0.4); }
        .status-rejected { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.4); }
    </style>
</head>
<body>
    <div class="admin-container" style="max-width: 950px; margin: 0 auto; padding: 10px;">
        
        <header class="admin-header">
            <h1>Admin Panel <span>Payment Approvals</span></h1>
            <p>Verify user UTR codes and unlock notes instantly</p>
        </header>

        <section class="card">
            <!-- Search & Filter Controls -->
            <div class="filter-grid">
                <div class="input-group">
                    <select id="statusFilter" onchange="filterOrders()">
                        <option value="pending" selected>Pending Only</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                        <option value="ALL">All Orders</option>
                    </select>
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <input type="text" id="searchInput" placeholder="🔍 Search Email or UTR..." oninput="filterOrders()">
                </div>
            </div>

            <!-- Orders Table -->
            <div class="table-responsive">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Note Title</th>
                            <th>Amount</th>
                            <th>UTR Code</th>
                            <th>Status</th>
                            <th>1-Click Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; color:#888;">Loading payment orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let cachedOrders = [];

        window.onload = async () => {
            if (typeof window.requireAdminAuth === "function") {
                await window.requireAdminAuth();
            }
            await fetchOrders();
        };

        async function fetchOrders() {
            const { data, error } = await window.supabaseClient
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Orders fetch error:", error);
                return;
            }

            cachedOrders = data || [];
            filterOrders();
        }

        function filterOrders() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = cachedOrders.filter(order => {
                const matchStatus = (statusFilter === 'ALL') || (order.status === statusFilter);
                
                const emailStr = (order.user_email || '').toLowerCase();
                const utrStr = (order.utr_number || '').toLowerCase();
                const matchSearch = !searchQuery || emailStr.includes(searchQuery) || utrStr.includes(searchQuery);

                return matchStatus && matchSearch;
            });

            renderTable(filtered);
        }

        function renderTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = "";

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">No orders found.</td></tr>`;
                return;
            }

            orders.forEach(order => {
                let statusBadge = `<span class="badge-status status-${order.status}">${order.status}</span>`;
                
                let actionButtons = '-';
                if (order.status === 'pending') {
                    actionButtons = `
                        <div class="action-btns">
                            <button class="btn-approve" onclick="approveOrder(${order.id}, '${order.user_email}', ${order.note_id})">Approve ✅</button>
                            <button class="btn-reject" onclick="rejectOrder(${order.id})">Reject ❌</button>
                        </div>
                    `;
                }

                tbody.innerHTML += `
                    <tr>
                        <td><strong style="color:#fff;">${order.user_email}</strong></td>
                        <td style="color:#d1d5db;">${order.note_title}</td>
                        <td style="color:#2ed573; font-weight:bold;">₹${order.amount}</td>
                        <td style="font-family:monospace; color:#00d2ff; font-weight:bold;">${order.utr_number}</td>
                        <td>${statusBadge}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
            });
        }

        // 🚀 1-Click Approve Function (Updates Order + Grants Purchase Access)
        async function approveOrder(orderId, userEmail, noteId) {
            if (!confirm(`Confirm approval for ${userEmail}?`)) return;

            try {
                // Step 1: User का user_id ढूंढना (Profiles/Users टेबल से)
                const { data: userData, error: userErr } = await window.supabaseClient
                    .from('profiles') // अगर आपकी प्रोफाइल टेबल का नाम अलग है तो अपडेट करें
                    .select('id')
                    .eq('email', userEmail)
                    .single();

                let userId = userData ? userData.id : null;

                // Step 2: Order status को approved सेट करें
                const { error: orderErr } = await window.supabaseClient
                    .from('orders')
                    .update({ status: 'approved' })
                    .eq('id', orderId);

                if (orderErr) throw orderErr;

                // Step 3: user_purchases टेबल में एंट्री करें ताकि नोट अनलॉक हो जाए
                if (userId) {
                    await window.supabaseClient
                        .from('user_purchases')
                        .insert([{
                            user_id: userId,
                            note_id: noteId,
                            txn_id: `MANUAL_UTR_${orderId}`
                        }]);
                }

                alert("🎉 Order Approved & Access Granted!");
                await fetchOrders(); // Table Refresh

            } catch (err) {
                alert("Approval Error: " + err.message);
            }
        }

        async function rejectOrder(orderId) {
            if (!confirm("Are you sure you want to REJECT this payment?")) return;

            try {
                const { error } = await window.supabaseClient
                    .from('orders')
                    .update({ status: 'rejected' })
                    .eq('id', orderId);

                if (error) throw error;

                alert("Order Rejected ❌");
                await fetchOrders();
            } catch (err) {
                alert("Reject Error: " + err.message);
            }
        }
    </script>
</body>
</html>
