<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Roitx Reader Elite v11</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="supabase.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="viewer-style.css">
</head>
<body class="theme-dark ui-visible mode-flip">

    <!-- SIDEBAR FOR TABLE OF CONTENTS (TOC) -->
    <aside id="toc-sidebar" class="sidebar">
        <header class="sidebar-header">
            <h3>Table of Contents</h3>
            <button class="close-x" onclick="toggleTOC(false)">✕</button>
        </header>
        <div id="toc-list" class="toc-container">
            <p class="empty-msg">Scanning chapters...</p>
        </div>
    </aside>

    <header class="navbar" id="navbar">
        <div class="nav-left">
            <button class="icon-btn action-back" onclick="window.history.back()" aria-label="Go Back">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20,11H7.83L13.42,5.41L12,4L4,12L12,20L13.41,18.59L7.83,13H20V11Z"/></svg>
            </button>
            <button class="icon-btn" onclick="toggleTOC()" title="Chapters Outline">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3,4H21V6H3V4M3,11H21V13H3V11M3,18H21V20H3V18Z"/></svg>
            </button>
            <div class="metadata">
                <h1 id="doc-title">Initializing...</h1>
                <div class="sub-meta">
                    <span id="page-indicator-top">Page 0 of 0</span>
                    <span class="dot">•</span>
                    <span id="progress-percent">0%</span>
                    <span class="dot">•</span>
                    <span id="file-size">0.0 MB</span>
                </div>
            </div>
        </div>
        <div class="nav-right">
            <!-- Auto-Scroll Toggle -->
            <button class="icon-btn" id="btn-autoscroll" onclick="toggleAutoScroll()" title="Auto-Scroll">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M10,16.5V7.5L16,12L10,16.5Z"/></svg>
            </button>
            <!-- Search Toggle -->
            <button class="icon-btn" onclick="toggleSearchBox()" title="Search Text">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
            </button>
            <!-- Bookmark Button -->
            <button class="icon-btn" id="btn-bookmark" onclick="toggleCurrentPageBookmark()" title="Bookmark Page">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17,3H7A2,2 0 0,0 5,5V21L12,18L19,21V5C19,3.89 18.1,3 17,3Z"/></svg>
            </button>
            <!-- Audio Reader (TTS) -->
            <button class="icon-btn" id="btn-tts" onclick="toggleSpeech()" title="Read Aloud">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>
            </button>
            <!-- Settings -->
            <button class="icon-btn" onclick="toggleSettings()" aria-label="Settings">
                <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.35 19.43,11.03L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.97 19.05,5.05L16.56,6.05C16.04,5.66 15.47,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.53,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.97 4.46,5.05 4.34,5.27L2.34,8.73C2.22,8.95 2.27,9.22 2.46,9.37L4.57,11.03C4.53,11.35 4.5,11.67 4.5,12C4.5,11.67 4.53,11.35 4.57,11.03L2.46,14.63C2.27,14.78 2.22,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.95C7.96,18.34 8.53,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.47,18.68 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
            </button>
        </div>
    </header>

    <!-- FLOATING HIGHLIGHTER TOOLBAR -->
    <div id="highlight-bar" class="highlight-floating-bar">
        <button onclick="applyHighlight('#ffff00')" style="background:#ffff00;"></button>
        <button onclick="applyHighlight('#00ff7f')" style="background:#00ff7f;"></button>
        <button onclick="applyHighlight('#00bfff')" style="background:#00bfff;"></button>
        <button onclick="applyHighlight('#ff69b4')" style="background:#ff69b4;"></button>
        <button onclick="clearPageHighlights()" title="Clear Highlights" style="background:#333; color:#fff;">✕</button>
    </div>

    <!-- FLOATING SEARCH BAR -->
    <div id="search-bar-container" class="search-floating-bar">
        <input type="text" id="search-input" placeholder="Search..." onkeyup="handleSearchKey(event)">
        <span id="search-count">0/0</span>
        <button onclick="navigateSearch(-1)">▲</button>
        <button onclick="navigateSearch(1)">▼</button>
        <button onclick="toggleSearchBox(false)">✕</button>
    </div>

    <main id="viewport" onclick="handleViewportClick(event)">
        <div id="canvas-stage">
            <div id="book-container"></div>
        </div>

        <div id="vertical-scroll-container"></div>

        <div id="master-loader">
            <div class="loader-ring"><div></div><div></div><div></div><div></div></div>
            <p id="loader-text">Optimizing for your screen...</p>
        </div>
    </main>

    <!-- SCRUBBER TOOLBAR -->
    <div class="scrub-bar" id="scrubBar">
        <div class="scrub-container">
            <button class="scrub-btn" onclick="toggleThumbnailGrid()" title="Thumbnails Grid">
                <svg viewBox="0 0 24 24" width="18"><path fill="currentColor" d="M4,4H8V8H4V4M10,4H14V8H10V4M16,4H20V8H16V4M4,10H8V14H4V10M10,10H14V14H10V10M16,10H20V14H16V10M4,16H8V20H4V16M10,16H14V20H10V16M16,16H20V20H16V16Z"/></svg>
            </button>
            <button class="scrub-btn" onclick="navPage('prev')">
                <svg viewBox="0 0 24 24" width="18"><path fill="currentColor" d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"/></svg>
            </button>
            <div class="scrub-track">
                <input type="range" id="page-slider" min="1" max="100" value="1">
                <div id="bubble-tip">1</div>
            </div>
            <button class="scrub-btn" onclick="navPage('next')">
                <svg viewBox="0 0 24 24" width="18"><path fill="currentColor" d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"/></svg>
            </button>
            <button class="scrub-btn" onclick="toggleStickyNote()" title="Page Sticky Notes">
                <svg viewBox="0 0 24 24" width="18"><path fill="currentColor" d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M17,14H7V12H17V14M14,17H7V15H14V17M17,11H7V9H17V11Z"/></svg>
            </button>
        </div>
    </div>

    <!-- THUMBNAIL GRID MODAL -->
    <div id="thumbnail-modal" class="modal-view">
        <header class="modal-header">
            <h3>Page Thumbnails</h3>
            <button class="close-x" onclick="toggleThumbnailGrid(false)">✕</button>
        </header>
        <div id="thumbnail-grid" class="grid-container"></div>
    </div>

    <!-- STICKY NOTES MODAL -->
    <div id="notes-modal" class="modal-view">
        <header class="modal-header">
            <h3>Page Notes (Page <span id="note-page-num">1</span>)</h3>
            <button class="close-x" onclick="toggleStickyNote(false)">✕</button>
        </header>
        <textarea id="page-note-input" placeholder="Type your notes for this page here..."></textarea>
        <button class="full-btn primary" onclick="saveStickyNote()">Save Note</button>
    </div>

    <!-- SETTINGS PANEL -->
    <div id="modal-overlay" onclick="closeAllModals()"></div>
    <div id="settings-panel">
        <div class="panel-handle"></div>
        <section class="panel-content">
            <header>
                <h2>Reader Settings</h2>
                <button class="close-x" onclick="toggleSettings(false)">✕</button>
            </header>

            <div class="control-group">
                <label>Theme</label>
                <div class="theme-picker">
                    <button onclick="setTheme('light')" class="t-opt t-light">Light</button>
                    <button onclick="setTheme('sepia')" class="t-opt t-sepia">Sepia</button>
                    <button onclick="setTheme('dark')" class="t-opt t-dark">Dark</button>
                    <button onclick="setTheme('oled')" class="t-opt t-oled">OLED</button>
                </div>
            </div>

            <div class="control-group">
                <label>Reading Mode & View</label>
                <div class="theme-picker">
                    <button onclick="setViewMode('flip')" class="t-opt">3D Flip</button>
                    <button onclick="setViewMode('vertical')" class="t-opt">Vertical Scroll</button>
                    <button onclick="togglePageSpread()" id="btn-spread-toggle" class="t-opt">Single Page Mode</button>
                </div>
            </div>

            <div class="control-group">
                <label>Page Zoom</label>
                <div class="zoom-stepper">
                    <button onclick="adjustZoom(-0.2)">A−</button>
                    <span id="zoom-val">100%</span>
                    <button onclick="adjustZoom(0.2)">A+</button>
                </div>
            </div>

            <div class="control-group">
                <label>Bookmarks & Tools</label>
                <button class="full-btn" onclick="showSavedBookmarks()">View Bookmarked Pages</button>
                <button class="full-btn" onclick="togglePresentationMode()">Presentation Mode (F5)</button>
                <button class="full-btn" onclick="rotateCanvas()">Rotate Page 90°</button>
                <a id="download-trigger" class="full-btn primary">Download for Offline</a>
            </div>
        </section>
    </div>

    <script src="viewer-main.js"></script>
</body>
</html>
