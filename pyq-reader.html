<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYQ Reader Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --reader-font-size: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text-main); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }

    .reader-card { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 50px; }

    /* STICKY TOP TOOLBAR */
    .sticky-bar {
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .bar-btn-group { display: flex; gap: 8px; align-items: center; }
    .btn-tool {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .btn-tool:hover, .btn-tool.active { background: var(--accent); color: #0f172a; border-color: transparent; }

    /* PAPER HEADER */
    .paper-header {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(168, 85, 247, 0.1));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 20px;
    }
    .paper-title { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 8px; line-height: 1.3; }
    .paper-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag-pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: rgba(255, 255, 255, 0.05); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.2); }

    /* OVERVIEW & SUMMARY STYLING */
    .overview-box {
      background: rgba(168, 85, 247, 0.08);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 20px;
      padding: 20px;
    }
    .overview-title { font-size: 13px; font-weight: 800; color: #c084fc; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* MARKDOWN FORMATTING CLASSES */
    .md-heading { font-size: 16px; font-weight: 800; color: #f472b6; margin: 16px 0 8px 0; }
    .md-hr { border: 0; height: 1px; background: rgba(255, 255, 255, 0.1); margin: 16px 0; }
    .md-list { list-style: none; padding-left: 0; margin-bottom: 10px; }
    .md-list li { position: relative; padding-left: 20px; margin-bottom: 8px; font-size: 13.5px; line-height: 1.6; color: #cbd5e1; }
    .md-list li::before { content: "•"; position: absolute; left: 4px; color: var(--accent); font-weight: bold; font-size: 16px; }

    /* SEARCH IN READER */
    .reader-search {
      width: 100%;
      height: 42px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    /* QUESTION CARD */
    .ans-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: 0.2s ease;
    }
    .ans-card:hover { border-color: rgba(56, 189, 248, 0.3); }

    .q-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .q-meta-group { display: flex; flex-direction: column; gap: 4px; }
    .q-text { font-size: calc(var(--reader-font-size) + 1px); font-weight: 700; color: #f8fafc; line-height: 1.5; }
    
    /* YEAR & SHIFT BADGES */
    .meta-badges { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .badge-meta {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .q-actions { display: flex; gap: 6px; }
    .btn-icon-action { background: rgba(255,255,255,0.05); border: none; color: var(--text-muted); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .btn-icon-action:hover { color: var(--accent); background: rgba(255,255,255,0.1); }

    .ans-eng { border-left: 3px solid #10b981; background: rgba(16, 185, 129, 0.06); padding: 12px 14px; border-radius: 14px; font-size: var(--reader-font-size); line-height: 1.6; color: #e2e8f0; }
    .ans-hin { border-left: 3px solid #3b82f6; background: rgba(59, 130, 246, 0.06); padding: 12px 14px; border-radius: 14px; font-size: var(--reader-font-size); line-height: 1.6; color: #cbd5e1; }
    
    .tag { font-weight: 800; font-size: 11px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .eng-tag { color: #34d399; }
    .hin-tag { color: #60a5fa; }

    /* TOAST */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0f172a; padding: 8px 18px; border-radius: 30px; font-weight: 800; font-size: 12px; display: none; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
  </style>
</head>
<body>

  <div class="reader-card" id="mainContainer">
    <div style="text-align:center; padding: 40px; color:var(--text-muted);"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading Question Set...</div>
  </div>

  <div id="toast" class="toast">Copied to Clipboard!</div>

<script>
  let currentQuestions = [];
  let currentData = null;
  let activeLang = 'BOTH';

  // MARKDOWN PARSER FOR HEADINGS, LISTS, DIVIDERS & BOLDING
  function parseFullMarkdown(text) {
    if (!text) return "";
    let formatted = text
      .replace(/^### (.*$)/gim, '<div class="md-heading">$1</div>')
      .replace(/^---\s*$/gim, '<hr class="md-hr">')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^\* (.*$)/gim, '<li>$1</li>');

    formatted = formatted.replace(/(<li>.*<\/li>)/s, '<ul class="md-list">$1<\/ul>');
    return formatted;
  }

  // ACTIVITY TRACKING FUNCTION FOR LIBRARY
  function trackPYQActivityLocally(paperData) {
    try {
      let recent = JSON.parse(localStorage.getItem("recentFiles") || "[]");
      let readerUrl = `pyq-reader.html?id=${paperData.id}`;
      
      let existingIndex = recent.findIndex(f => f.url === readerUrl || f.title === paperData.title);
      let viewCount = 1;
      if (existingIndex !== -1) {
        viewCount = (recent[existingIndex].viewCount || 1) + 1;
        recent.splice(existingIndex, 1);
      }

      recent.unshift({
        title: paperData.title || "PYQ Reader Paper",
        url: readerUrl,
        meta: `${paperData.subject || 'PYQ'} • ${paperData.years_range || 'Past Years'}`,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        downloaded: true,
        isPurchased: true,
        isTest: false,
        viewCount: viewCount
      });

      recent = recent.slice(0, 15);
      localStorage.setItem("recentFiles", JSON.stringify(recent));
    } catch (e) {
      console.error("PYQ Tracking Error: ", e);
    }
  }

  document.addEventListener("DOMContentLoaded", fetchPYQDetails);

  async function fetchPYQDetails() {
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    if(!id) {
      document.getElementById("mainContainer").innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px;">No Paper ID provided.</div>`;
      return;
    }

    const { data, error } = await window.supabaseClient
      .from('pyq_database')
      .select('*')
      .eq('id', id)
      .single();

    if(error || !data) {
      document.getElementById("mainContainer").innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px;">Error loading paper details.</div>`;
      return;
    }

    currentData = data;
    currentQuestions = data.questions || data.content || [];
    
    // Track Activity in Library Dashboard
    trackPYQActivityLocally(data);

    renderReader();
  }

  function renderReader() {
    const container = document.getElementById("mainContainer");
    const data = currentData;
    const hasQuestions = currentQuestions.length > 0;

    let html = `
      <div class="sticky-bar">
        <div class="bar-btn-group">
          <button class="btn-tool ${activeLang === 'BOTH' ? 'active' : ''}" onclick="setLanguage('BOTH')">Both</button>
          <button class="btn-tool ${activeLang === 'EN' ? 'active' : ''}" onclick="setLanguage('EN')">ENG</button>
          <button class="btn-tool ${activeLang === 'HI' ? 'active' : ''}" onclick="setLanguage('HI')">HIN</button>
        </div>
        <div class="bar-btn-group">
          <button class="btn-tool" onclick="adjustFontSize(-1)"><i class="fa-solid fa-minus"></i></button>
          <button class="btn-tool" onclick="adjustFontSize(1)"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <div class="paper-header">
        <div class="paper-title">${data.title}</div>
        <div class="paper-tags">
          <span class="tag-pill"><i class="fa-solid fa-graduation-cap"></i> ${data.exam_target || 'BSEB'}</span>
          <span class="tag-pill"><i class="fa-solid fa-book"></i> ${data.subject || 'General'}</span>
          <span class="tag-pill"><i class="fa-solid fa-calendar"></i> ${data.years_range || 'Past Years'}</span>
        </div>
      </div>
    `;

    if (data.summary) {
      let sumEn = data.summary.summary_en || (typeof data.summary === 'string' ? data.summary : '');
      let sumHi = data.summary.summary_hi || '';

      const boxTitle = hasQuestions ? "CHAPTER OVERVIEW & KEY CONCEPTS" : "SUMMARY / REVISION NOTES";

      html += `
        <div class="overview-box">
          <div class="overview-title"><i class="fa-solid fa-lightbulb"></i> ${boxTitle}</div>
          ${(sumEn && (activeLang === 'BOTH' || activeLang === 'EN')) ? `<div>${parseFullMarkdown(sumEn)}</div>` : ''}
          ${(sumHi && (activeLang === 'BOTH' || activeLang === 'HI')) ? `<div>${parseFullMarkdown(sumHi)}</div>` : ''}
        </div>
      `;
    }

    if (hasQuestions) {
      html += `<input type="text" class="reader-search" id="qSearch" placeholder="🔍 Search inside this paper..." onkeyup="filterQuestions()">`;
    }

    html += `<div id="questionsContainer" style="display:flex; flex-direction:column; gap:16px;"></div>`;

    container.innerHTML = html;
    renderQuestions(currentQuestions);
  }

  function renderQuestions(questions) {
    const qContainer = document.getElementById("questionsContainer");
    if(!qContainer) return;

    if(questions.length === 0) {
      qContainer.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px;">No questions found.</div>`;
      return;
    }

    qContainer.innerHTML = questions.map((q, idx) => {
      const qText = q.question_en || q.question_hi || q.question || "";
      const showEn = (activeLang === 'BOTH' || activeLang === 'EN') && q.answer_en;
      const showHi = (activeLang === 'BOTH' || activeLang === 'HI') && q.answer_hi;

      // Extract Year and Shift values
      const yearVal = q.year || currentData.years_range || '';
      const shiftVal = q.shift || '';

      // Question + Answer combined speech text
      let speechText = `Question ${idx + 1}. ${qText}. `;
      if (showEn) speechText += `Answer: ${q.answer_en}. `;
      if (showHi) speechText += `उत्तर: ${q.answer_hi}. `;

      return `
        <div class="ans-card">
          <div class="q-header">
            <div class="q-meta-group">
              <div class="q-text">Q${idx + 1}. ${parseFullMarkdown(qText)}</div>
              ${(yearVal || shiftVal) ? `
                <div class="meta-badges">
                  ${yearVal ? `<span class="badge-meta"><i class="fa-regular fa-calendar-days"></i> ${yearVal}</span>` : ''}
                  ${shiftVal ? `<span class="badge-meta"><i class="fa-regular fa-clock"></i> ${shiftVal}</span>` : ''}
                </div>
              ` : ''}
            </div>
            <div class="q-actions">
              <button class="btn-icon-action" onclick="speakText('${escapeQuotes(speechText)}')" title="Read Question & Answer"><i class="fa-solid fa-volume-high"></i></button>
              <button class="btn-icon-action" onclick="copyQuestion('${escapeQuotes(qText)}', '${escapeQuotes(q.answer_en || q.answer_hi || '')}')" title="Copy"><i class="fa-solid fa-copy"></i></button>
            </div>
          </div>
          
          ${showEn ? `
            <div class="ans-eng">
              <span class="tag eng-tag"><i class="fa-solid fa-circle-check"></i> ENGLISH ANSWER</span>
              ${parseFullMarkdown(q.answer_en)}
            </div>
          ` : ''}

          ${showHi ? `
            <div class="ans-hin">
              <span class="tag hin-tag"><i class="fa-solid fa-language"></i> हिंदी व्याख्या / उत्तर</span>
              ${parseFullMarkdown(q.answer_hi)}
            </div>
          ` : ''}
        </div>
      `;
    }).join("");
  }

  function setLanguage(lang) {
    activeLang = lang;
    renderReader();
  }

  function adjustFontSize(delta) {
    const root = document.documentElement;
    let current = parseInt(getComputedStyle(root).getPropertyValue('--reader-font-size')) || 14;
    current = Math.min(Math.max(current + delta, 12), 20);
    root.style.setProperty('--reader-font-size', current + 'px');
  }

  function filterQuestions() {
    const query = document.getElementById("qSearch").value.toLowerCase();
    const filtered = currentQuestions.filter(q => {
      const qText = (q.question_en || q.question_hi || q.question || "").toLowerCase();
      const aEn = (q.answer_en || "").toLowerCase();
      const aHi = (q.answer_hi || "").toLowerCase();
      return qText.includes(query) || aEn.includes(query) || aHi.includes(query);
    });
    renderQuestions(filtered);
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const cleanText = text.replace(/[*#]/g, ''); // Clean markdown characters for voice
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'hi-IN';
      window.speechSynthesis.speak(utterance);
    }
  }

  function copyQuestion(q, a) {
    const fullText = `Q: ${q}\n\nAns: ${a}`;
    navigator.clipboard.writeText(fullText).then(() => {
      showToast("Copied to Clipboard!");
    });
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2000);
  }

  function escapeQuotes(str) {
    return str ? str.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
  }
</script>

</body>
</html>
