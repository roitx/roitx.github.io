<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Upload Premium Materials | PM-Roit</title>
    <link rel="stylesheet" href="premium.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase CDN + Central Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: rgba(17, 24, 39, 0.75);
            --accent-cyan: #00d2ff;
            --accent-blue: #0072ff;
            --accent-purple: #7928ca;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Ambient Glows */
        .bg-glow-1 {
            position: fixed; top: -100px; left: -100px; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }
        .bg-glow-2 {
            position: fixed; bottom: -100px; right: -100px; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(121, 40, 202, 0.15) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        .admin-container {
            width: 100%; max-width: 1000px; margin: 0 auto; padding: clamp(12px, 3vw, 24px);
        }

        .admin-header {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: clamp(16px, 4vw, 24px);
            margin-bottom: 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .admin-header h1 {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            margin: 0; color: #fff; display: flex; align-items: center; gap: 10px; font-weight: 800;
        }

        .admin-header h1 span {
            font-size: 0.72rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: 700;
            text-transform: uppercase; box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        .admin-header p {
            margin: 6px 0 0 0; font-size: 0.82rem; color: var(--text-muted);
        }

        .card {
            background: linear-gradient(145deg, rgba(18, 24, 38, 0.9), rgba(26, 35, 51, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: clamp(16px, 3vw, 24px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.1rem; margin-top: 0; margin-bottom: 16px; color: #fff; display: flex; align-items: center; gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 14px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px;
        }

        .input-group select, .input-group input {
            background: rgba(13, 18, 29, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff; padding: 11px 14px; border-radius: 12px;
            font-size: 0.85rem; outline: none; font-family: inherit; transition: all 0.25s ease;
        }

        .input-group select:focus, .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.25);
            background: #0f1624;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: #fff; border: none; padding: 12px 20px; border-radius: 12px;
            font-weight: 700; font-size: 0.9rem; cursor: pointer; width: 100%;
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.3); transition: all 0.25s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 198, 255, 0.45);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .table-responsive {
            width: 100%; overflow-x: auto; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(13, 18, 29, 0.5);
        }

        .notes-table {
            width: 100%; border-collapse: collapse; font-size: 0.82rem; white-space: nowrap;
        }

        .notes-table th, .notes-table td {
            padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .notes-table th {
            background: rgba(255, 255, 255, 0.03); color: var(--accent-cyan);
            font-weight: 700; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.6px;
        }

        .action-btns {
            display: flex; gap: 8px; align-items: center;
        }

        .btn-view-sm {
            background: rgba(0, 210, 255, 0.15); color: var(--accent-cyan);
            border: 1px solid rgba(0, 210, 255, 0.3); padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
            text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s ease;
        }

        .btn-view-sm:hover {
            background: var(--accent-cyan); color: #000; box-shadow: 0 0 12px rgba(0, 210, 255, 0.5);
        }

        .btn-danger-sm {
            background: rgba(255, 71, 87, 0.15); color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.3); padding: 6px 12px;
            border-radius: 8px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
            display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s ease;
        }

        .btn-danger-sm:hover {
            background: #ff4757; color: #fff; box-shadow: 0 0 12px rgba(255, 71, 87, 0.5);
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="admin-container">
        
        <header class="admin-header">
            <div>
                <h1><i class="fa-solid fa-cloud-arrow-up" style="color: var(--accent-cyan);"></i> Admin Panel</h1>
                <p>Upload premium notes (PDFs & High-Res Images) & manage assets</p>
            </div>
            <span><i class="fa-solid fa-shield-halved"></i> Uploader Hub</span>
        </header>

        <!-- Upload Form Card -->
        <section class="card">
            <h2><i class="fa-solid fa-circle-plus" style="color: var(--accent-cyan);"></i> Add New Premium Material</h2>
            
            <div class="form-grid">
                <div class="input-group">
                    <label>Class No / Category</label>
                    <select id="classNo" onchange="autoGeneratePath()">
                        <option value="9">Class 9th</option>
                        <option value="10">Class 10th</option>
                        <option value="11" selected>Class 11th</option>
                        <option value="12">Class 12th</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Subject</label>
                    <select id="subject" onchange="autoGeneratePath()">
                        <option value="Physics">Physics (phy)</option>
                        <option value="Chemistry">Chemistry (che)</option>
                        <option value="Maths">Maths (mat)</option>
                        <option value="Biology">Biology (bio)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Chapter No</label>
                    <input type="number" id="chapterNo" placeholder="e.g. 1, 2, 3" oninput="autoGeneratePath()">
                </div>

                <div class="input-group">
                    <label>Chapter Name / Title</label>
                    <input type="text" id="noteTitle" placeholder="e.g. Structure of Atom">
                </div>

                <div class="input-group">
                    <label>Price (₹)</label>
                    <input type="number" id="notePrice" placeholder="e.g. 29">
                </div>

                <div class="input-group">
                    <label>Select File (PDF / Image)</label>
                    <input type="file" id="fileInput" accept="application/pdf,image/*" onchange="autoGeneratePath()">
                </div>
            </div>

            <div class="form-grid" style="margin-top: 10px; grid-template-columns: 1fr;">
                <div class="input-group">
                    <label>Target Storage File Path</label>
                    <input type="text" id="filePath" readonly style="background: rgba(255,255,255,0.04); color: var(--accent-cyan); font-weight: bold; font-family: monospace;">
                </div>
            </div>

            <button class="btn-primary" id="uploadBtn" style="margin-top: 16px;" onclick="uploadNoteAndFile()">
                <i class="fa-solid fa-rocket"></i> Upload & Sync File Securely
            </button>
        </section>

        <!-- Uploaded Files List Card -->
        <section class="card">
            <h2><i class="fa-solid fa-folder-open" style="color: var(--accent-cyan);"></i> Uploaded Files (Top 20 Recent)</h2>
            
            <div class="filter-grid">
                <div class="input-group">
                    <select id="filterClass" onchange="filterNotes()">
                        <option value="ALL">All Classes</option>
                        <option value="Class 9th">Class 9th</option>
                        <option value="Class 10th">Class 10th</option>
                        <option value="Class 11th">Class 11th</option>
                        <option value="Class 12th">Class 12th</option>
                    </select>
                </div>
                <div class="input-group">
                    <select id="filterSubject" onchange="filterNotes()">
                        <option value="ALL">All Subjects</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Maths">Maths</option>
                        <option value="Biology">Biology</option>
                    </select>
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <input type="text" id="filterSearch" placeholder="🔍 Search Title..." oninput="filterNotes()">
                </div>
            </div>

            <div class="table-responsive">
                <table class="notes-table">
                    <thead>
                        <tr>
                            <th>Class / Sub</th>
                            <th>Title & Chapter</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="uploadedTableBody">
                        <tr>
                            <td colspan="4" style="text-align:center; color:var(--text-muted); padding: 25px;">
                                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 6px; color: var(--accent-cyan);"></i> Loading uploaded files...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let cachedUploadedNotes = [];

        window.onload = async () => {
            if (typeof window.requireAdminAuth === "function") {
                await window.requireAdminAuth();
            }
            autoGeneratePath();
            await fetchUploadedNotes();
        };

                function autoGeneratePath() {
            const classVal = document.getElementById('classNo').value;
            const subjectVal = document.getElementById('subject').value.toLowerCase().substring(0, 3);
            const chapterVal = document.getElementById('chapterNo').value.trim();
            const fileInput = document.getElementById('fileInput');
            
            let ext = "pdf";
            if (fileInput.files && fileInput.files[0]) {
                const fileName = fileInput.files[0].name;
                const fileExt = fileName.split('.').pop().toLowerCase();
                if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(fileExt)) {
                    ext = fileExt;
                }
            }

            // Random Timestamp / Unique Suffix jod rahe hain randomness ke liye
            const randomSuffix = Date.now() + "_" + Math.floor(Math.random() * 1000);

            if (chapterVal) {
                const generated = `pre_class${classVal}_${subjectVal}_ch${chapterVal}_${randomSuffix}.${ext}`;
                document.getElementById('filePath').value = generated;
            } else {
                document.getElementById('filePath').value = `pre_class${classVal}_${subjectVal}_ch[NO]_${randomSuffix}.${ext}`;
            }
        }

        async function uploadNoteAndFile() {
            const classNo = document.getElementById('classNo').value;
            const subject = document.getElementById('subject').value;
            const chapterNo = document.getElementById('chapterNo').value.trim();
            const title = document.getElementById('noteTitle').value.trim();
            const price = parseFloat(document.getElementById('notePrice').value);
            const filePath = document.getElementById('filePath').value.trim();
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!chapterNo || !title || isNaN(price) || !file) {
                alert("⚠️ Kripya sabhi fields bharein aur file (PDF ya Image) select karein!");
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Uploading to Storage...`;

            try {
                // Yahan naya private bucket name set kiya gaya hai
                const { data: storageData, error: storageError } = await window.supabaseClient.storage
                    .from('private-premium-files')
                    .upload(filePath, file, { cacheControl: '3600', upsert: true });

                if (storageError) throw new Error("Storage Upload Failed: " + storageError.message);

                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving to Database...`;

                const dbPayload = {
    class_no: `Class ${classNo}th`,
    subject: subject,
    chapter_no: `Chapter ${chapterNo}`,
    title: title,
    price: price,
    file_path: filePath, // Yeh wahi unique timestamp wala path hai jo bucket me upload hua hai
    demo_pdf_url: filePath,
    full_pdf_url: filePath,
    type: 'premium'
};


                const { error: dbError } = await window.supabaseClient
                    .from('premium_notes')
                    .insert([dbPayload]);

                if (dbError) throw new Error("Database Entry Failed: " + dbError.message);

                alert(`🎉 Success! File Uploaded & Published with Timestamp!\nPath: ${filePath}`);
                
                document.getElementById('chapterNo').value = "";
                document.getElementById('noteTitle').value = "";
                document.getElementById('notePrice').value = "";
                document.getElementById('fileInput').value = "";
                autoGeneratePath();

                await fetchUploadedNotes();

            } catch (err) {
                alert("❌ Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-rocket"></i> Upload & Sync File Securely`;
            }
        }

        async function fetchUploadedNotes() {
            const { data, error } = await window.supabaseClient
                .from('premium_notes')
                .select('*')
                .order('id', { ascending: false })
                .limit(20);

            if (error) {
                console.error("Fetch error:", error);
                return;
            }

            cachedUploadedNotes = data || [];
            filterNotes();
        }

        function filterNotes() {
            const classFilter = document.getElementById('filterClass').value;
            const subjectFilter = document.getElementById('filterSubject').value;
            const searchQuery = document.getElementById('filterSearch').value.toLowerCase().trim();

            const filtered = cachedUploadedNotes.filter(note => {
                const matchClass = (classFilter === 'ALL') || (note.class_no === classFilter);
                const matchSubject = (subjectFilter === 'ALL') || (note.subject === subjectFilter);
                
                const titleStr = (note.title || '').toLowerCase();
                const chStr = (note.chapter_no || '').toLowerCase();
                const matchSearch = !searchQuery || titleStr.includes(searchQuery) || chStr.includes(searchQuery);

                return matchClass && matchSubject && matchSearch;
            });

            renderTable(filtered);
        }

        function renderTable(notes) {
            const tbody = document.getElementById('uploadedTableBody');
            tbody.innerHTML = "";

            if (notes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 25px;">No uploaded files found matching filters.</td></tr>`;
                return;
            }

            notes.forEach(note => {
 // upload-premium.html ke renderTable function me yeh karein:
let rawPath = note.file_path || note.full_pdf_url || '';

// Agar file ke path me pehle se folder nahi hai aur yeh premium note hai, toh direct path bhejein
const cleanPath = encodeURIComponent(rawPath);
const cleanName = encodeURIComponent(note.title || 'Material');

const isImg = /\.(png|jpg|jpeg|webp|gif)$/i.test(rawPath);
const viewerUrl = isImg 
    ? `image-viewer.html?path=${cleanPath}&name=${cleanName}&type=premium`
    : `notes-viewer.html?path=${cleanPath}&name=${cleanName}&type=premium&purchased=true`;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong style="color:var(--accent-cyan);">${note.class_no || ''}</strong><br>
                            <span style="color:var(--text-muted); font-size:0.7rem;">${note.subject || ''}</span>
                        </td>
                        <td>
                            <strong style="color:#fff;">${note.title}</strong><br>
                            <span style="color:var(--text-muted); font-size:0.7rem;">${note.chapter_no || ''}</span>
                        </td>
                        <td style="color:#2ed573; font-weight:bold;">₹${note.price}</td>
                        <td>
                            <div class="action-btns">
                                <a href="${viewerUrl}" class="btn-view-sm" target="_blank"><i class="fa-solid fa-eye"></i> View</a>
                                <button class="btn-danger-sm" onclick="deleteNote(${note.id}, '${note.file_path || ''}')"><i class="fa-solid fa-trash"></i> Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteNote(id, filePath) {
    if (!confirm("Kya aap sach mein is file ko delete karna chahte hain?")) return;

    try {
        const { error: dbErr } = await window.supabaseClient
            .from('premium_notes')
            .delete()
            .eq('id', id);

        if (dbErr) throw dbErr;

        if (filePath) {
            // Yahan 'admin-files' ki jagah 'private-premium-files' hona chahiye
            await window.supabaseClient.storage.from('private-premium-files').remove([filePath]);
        }

        alert("File successfully delete ho gayi! 🗑️");
        await fetchUploadedNotes();
    } catch (err) {
        alert("Delete failed: " + err.message);
    }
}

    </script>
</body>
</html>
