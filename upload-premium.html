<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Premium Notes</title>
    <link rel="stylesheet" href="premium.css">
    <!-- Supabase CDN + Central Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        .admin-header {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
        }
        .admin-header h1 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .admin-header h1 span {
            font-size: 0.75rem;
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .admin-header p {
            margin: 4px 0 0 0;
            font-size: 0.75rem;
            color: #8a99ad;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }
        .notes-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .notes-table th, .notes-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .notes-table th {
            background: rgba(255, 255, 255, 0.05);
            color: #00d2ff;
            font-weight: 600;
        }
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-view-sm {
            background: rgba(0, 210, 255, 0.15);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn-danger-sm {
            background: #ff4757;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="admin-container" style="max-width: 900px; margin: 0 auto; padding: 10px;">
        
        <header class="admin-header">
            <h1>Admin Panel <span>Upload Premium Notes</span></h1>
            <p>Add new study material and manage uploaded files</p>
        </header>

        <!-- Upload Form Card -->
        <section class="card">
            <h2 style="font-size: 1.1rem; margin-bottom: 12px;">📤 Add New Premium Note</h2>
            <div class="grid">
                <div class="input-group">
                    <label>Class No / Category</label>
                    <select id="classNo" onchange="autoGeneratePath()">
                        <option value="9">Class 9th</option>
                        <option value="10">Class 10th</option>
                        <option value="11" selected>Class 11th</option>
                        <option value="12">Class 12th</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Subject</label>
                    <select id="subject" onchange="autoGeneratePath()">
                        <option value="Physics">Physics (phy)</option>
                        <option value="Chemistry">Chemistry (che)</option>
                        <option value="Maths">Maths (mat)</option>
                        <option value="Biology">Biology (bio)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Chapter No</label>
                    <input type="number" id="chapterNo" placeholder="e.g. 1, 2, 3" oninput="autoGeneratePath()">
                </div>

                <div class="input-group">
                    <label>Chapter Name / Note Title</label>
                    <input type="text" id="noteTitle" placeholder="e.g. Structure of Atom">
                </div>

                <div class="input-group">
                    <label>Price (₹)</label>
                    <input type="number" id="notePrice" placeholder="e.g. 29">
                </div>

                <div class="input-group">
                    <label>Select PDF File 📄</label>
                    <input type="file" id="pdfFileInput" accept="application/pdf">
                </div>
            </div>

            <div class="grid" style="margin-top: 10px;">
                <div class="input-group">
                    <label>Target Storage File Path</label>
                    <input type="text" id="filePath" readonly style="background: rgba(255,255,255,0.05); color: #00d2ff; font-weight: bold;" placeholder="notes/pre_class11_che_ch2.pdf">
                </div>
            </div>

            <button class="btn btn-primary" id="uploadBtn" style="margin-top: 15px; width: 100%;" onclick="uploadNoteAndFile()">Upload & Sync File 🚀</button>
        </section>

        <!-- Uploaded Files List Card -->
        <section class="card" style="margin-top: 20px;">
            <h2 style="font-size: 1.1rem; margin-bottom: 12px;">📚 Uploaded Files (Top 20 Recent)</h2>
            
            <div class="filter-grid">
                <div class="input-group">
                    <select id="filterClass" onchange="filterNotes()">
                        <option value="ALL">All Classes</option>
                        <option value="Class 9th">Class 9th</option>
                        <option value="Class 10th">Class 10th</option>
                        <option value="Class 11th">Class 11th</option>
                        <option value="Class 12th">Class 12th</option>
                    </select>
                </div>
                <div class="input-group">
                    <select id="filterSubject" onchange="filterNotes()">
                        <option value="ALL">All Subjects</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Maths">Maths</option>
                        <option value="Biology">Biology</option>
                    </select>
                </div>
                <div class="input-group" style="grid-column: span 2;">
                    <input type="text" id="filterSearch" placeholder="🔍 Search Title..." oninput="filterNotes()">
                </div>
            </div>

            <div class="table-responsive">
                <table class="notes-table">
                    <thead>
                        <tr>
                            <th>Class/Sub</th>
                            <th>Title & Chapter</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="uploadedTableBody">
                        <tr>
                            <td colspan="4" style="text-align:center; color:#888;">Loading uploaded notes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let cachedUploadedNotes = [];

        window.onload = async () => {
            if (typeof window.requireAdminAuth === "function") {
                await window.requireAdminAuth();
            }
            autoGeneratePath();
            await fetchUploadedNotes();
        };

        // Fix Path: Ensures path starts with notes/ so Reader finds it correctly
        function autoGeneratePath() {
            const classVal = document.getElementById('classNo').value;
            const subjectVal = document.getElementById('subject').value.toLowerCase().substring(0, 3);
            const chapterVal = document.getElementById('chapterNo').value.trim();

            if (chapterVal) {
                const generated = `notes/pre_class${classVal}_${subjectVal}_ch${chapterVal}.pdf`;
                document.getElementById('filePath').value = generated;
            } else {
                document.getElementById('filePath').value = `notes/pre_class${classVal}_${subjectVal}_ch[NO].pdf`;
            }
        }

        async function uploadNoteAndFile() {
            const classNo = document.getElementById('classNo').value;
            const subject = document.getElementById('subject').value;
            const chapterNo = document.getElementById('chapterNo').value.trim();
            const title = document.getElementById('noteTitle').value.trim();
            const price = parseFloat(document.getElementById('notePrice').value);
            const filePath = document.getElementById('filePath').value.trim();
            const fileInput = document.getElementById('pdfFileInput');
            const file = fileInput.files[0];

            if (!chapterNo || !title || isNaN(price) || !file) {
                alert("Please fill all required fields and SELECT A PDF FILE!");
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerText = "Uploading File to Storage... ⏳";

            try {
                // Step 1: Upload PDF to admin-files bucket
                const { data: storageData, error: storageError } = await window.supabaseClient.storage
                    .from('admin-files')
                    .upload(filePath, file, { cacheControl: '3600', upsert: true });

                if (storageError) throw new Error("Storage Upload Failed: " + storageError.message);

                btn.innerText = "Saving to Database... ⏳";

                // Step 2: Insert into Database
                const dbPayload = {
                    class_no: `Class ${classNo}th`,
                    subject: subject,
                    chapter_no: `Chapter ${chapterNo}`,
                    title: title,
                    price: price,
                    file_path: filePath,
                    demo_pdf_url: filePath,
                    full_pdf_url: filePath,
                    type: 'premium'
                };

                const { error: dbError } = await window.supabaseClient
                    .from('premium_notes')
                    .insert([dbPayload]);

                if (dbError) throw new Error("Database Entry Failed: " + dbError.message);

                alert(`🎉 Success! PDF Uploaded & Published!\nPath: ${filePath}`);
                
                // Clear form & auto refresh table
                document.getElementById('chapterNo').value = "";
                document.getElementById('noteTitle').value = "";
                document.getElementById('notePrice').value = "";
                document.getElementById('pdfFileInput').value = "";
                autoGeneratePath();

                await fetchUploadedNotes(); // Refresh list automatically

            } catch (err) {
                alert("❌ Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Upload & Sync File 🚀";
            }
        }

        async function fetchUploadedNotes() {
            const { data, error } = await window.supabaseClient
                .from('premium_notes')
                .select('*')
                .order('id', { ascending: false })
                .limit(20);

            if (error) {
                console.error("Fetch error:", error);
                return;
            }

            cachedUploadedNotes = data || [];
            filterNotes();
        }

        function filterNotes() {
            const classFilter = document.getElementById('filterClass').value;
            const subjectFilter = document.getElementById('filterSubject').value;
            const searchQuery = document.getElementById('filterSearch').value.toLowerCase().trim();

            const filtered = cachedUploadedNotes.filter(note => {
                const matchClass = (classFilter === 'ALL') || (note.class_no === classFilter);
                const matchSubject = (subjectFilter === 'ALL') || (note.subject === subjectFilter);
                
                const titleStr = (note.title || '').toLowerCase();
                const chStr = (note.chapter_no || '').toLowerCase();
                const matchSearch = !searchQuery || titleStr.includes(searchQuery) || chStr.includes(searchQuery);

                return matchClass && matchSubject && matchSearch;
            });

            renderTable(filtered);
        }

        function renderTable(notes) {
            const tbody = document.getElementById('uploadedTableBody');
            tbody.innerHTML = "";

            if (notes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#888;">No uploaded notes found matching filters.</td></tr>`;
                return;
            }

            notes.forEach(note => {
                let rawPath = note.file_path || note.full_pdf_url || '';
                
                // Auto fix path if prefix notes/ is missing
                if (rawPath && !rawPath.startsWith('notes/')) {
                    rawPath = 'notes/' + rawPath;
                }

                const cleanPath = encodeURIComponent(rawPath);
                const cleanName = encodeURIComponent(note.title || 'Note');
                
                const viewerUrl = `notes-viewer.html?path=${cleanPath}&name=${cleanName}&type=premium&purchased=true`;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <strong style="color:#00d2ff;">${note.class_no || ''}</strong><br>
                            <span style="color:#aaa; font-size:0.7rem;">${note.subject || ''}</span>
                        </td>
                        <td>
                            <strong>${note.title}</strong><br>
                            <span style="color:#888; font-size:0.7rem;">${note.chapter_no || ''}</span>
                        </td>
                        <td style="color:#2ed573; font-weight:bold;">₹${note.price}</td>
                        <td>
                            <div class="action-btns">
                                <a href="${viewerUrl}" class="btn-view-sm" target="_blank">👁️ View</a>
                                <button class="btn-danger-sm" onclick="deleteNote(${note.id}, '${note.file_path || ''}')">🗑️ Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        async function deleteNote(id, filePath) {
            if (!confirm("Are you sure you want to delete this note and its file?")) return;

            try {
                // Delete from DB
                const { error: dbErr } = await window.supabaseClient
                    .from('premium_notes')
                    .delete()
                    .eq('id', id);

                if (dbErr) throw dbErr;

                // Delete from Storage if filepath exists
                if (filePath) {
                    await window.supabaseClient.storage.from('admin-files').remove([filePath]);
                }

                alert("Deleted successfully! 🗑️");
                await fetchUploadedNotes(); // Immediate list refresh
            } catch (err) {
                alert("Delete failed: " + err.message);
            }
        }
    </script>
</body>
</html>
