<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- SEO Meta Tags -->
  <title>Roitx Calendar — Smart Schedule & Indian Holiday Tracker</title>
  <meta name="description" content="Manage your personal schedule, track Indian public holidays, and plan your events seamlessly with Roitx Calendar." />
  <meta name="keywords" content="Roitx Calendar, Indian Holidays 2026, Personal Planner, Schedule Manager, Roitx App" />
  <meta name="author" content="Roitx" />
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Roitx Calendar — Premium Personal Planner" />
  <meta property="og:description" content="Organize your personal schedule and track holidays in a luxury dark interface." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://roitx.qd.je/calendar.html" />
  <meta property="og:image" content="https://roitx.qd.je/calendar.png" />
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Roitx Calendar ",
  "url": "https://roitx.qd.je/calendar.html",
  "description": "Calendar for public holidays and observance.",
  "publisher": {
    "@type": "Organization",
    "name": "PM Roitx Study Hub",
    "logo": "https://roitx.qd.je/calendar.png"
  }
}
</script>

<link rel="icon" href="calendar.png" type="image/png">

  <link rel="stylesheet" href="calendar.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body>

<header>
  <img src="calendar.png" alt="Roitx Calendar">
  <h1>Roitx — Calendar</h1>
</header>

<!-- HOLIDAY WISH BANNER -->
<div id="holidayWishBanner" class="holiday-wish-banner"></div>

<div class="container">
  <div>
    <!-- CALENDAR HEADER -->
    <div class="cal-header">
      <div class="cal-title-row">
        <div class="cal-title" id="calTitle">Month Year</div>
        <button class="cal-btn" id="todayBtn">Today</button>
      </div>

      <div class="cal-nav">
        <button class="cal-btn" id="prevBtn">◀</button>
        <button class="cal-btn" id="nextBtn">▶</button>
        <input type="date" id="gotoDate" title="Go to date">
      </div>
    </div>

    <!-- WEEKDAYS -->
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <!-- DAYS GRID -->
    <div class="days" id="daysGrid"></div>
  </div>

  <!-- SIDE PANEL -->
  <aside class="side">
    <div class="mini" id="eventFormSection">
      <h3 style="margin:0 0 8px 0; color:#3aa0ff;">📌 Create Personal Event</h3>
      <input type="date" id="eventDate" class="event-input">
      <input type="text" id="eventName" class="event-input" placeholder="Event Name">
      <button class="cal-btn" onclick="addEvent()" style="width:100%; background:var(--accent); color:#fff;">Save Event</button>
      <div id="eventMsg" style="margin-top:6px; font-size:12px;"></div>
    </div>

    <div class="mini">
      <h4 style="margin:0 0 8px 0; color:#e9f5ff;">Legend</h4>
      <div class="legend">
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#3aa0ff"></span> Today</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#ffb703"></span> Sunday Off</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#ff4d4d"></span> Public Holiday</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#00f2fe"></span> Observance</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#a48aff"></span> Personal Events</div>
      </div>    
    </div>

    <div id="eventList"></div>

    <div class="mini">
      <a href="index.html" style="color:#9fcfff; text-decoration:none;">⬅ Back to Home</a>
    </div>
  </aside>

  <!-- POPUP OVERLAY -->
  <div id="holidayPopup" class="popup-overlay">
    <div class="popup-box">
      <h3 id="popupTitle">Notification</h3>
      <p id="popupText" style="white-space: pre-line; line-height: 1.5; margin-top: 10px;"></p>
      <button id="popupButton" onclick="closePopup()">Close</button>
    </div>
  </div>
</div>

<script src="calendar.js"></script>
</body>
</html>
