<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04101a" />
  
  <!-- SEO Meta Tags -->
  <title>Roitx Calendar — Smart Schedule & Indian Holiday Tracker</title>
  <meta name="description" content="Manage your personal schedule, track Indian public holidays, and plan your events seamlessly with Roitx Calendar." />
  <meta name="keywords" content="Roitx Calendar, Indian Holidays 2026, Personal Planner, Schedule Manager, Roitx App" />
  <meta name="author" content="PM Roitx" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://roitx.dpdns.org/calendar.html" />
  
  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Roitx Calendar — Premium Personal Planner" />
  <meta property="og:description" content="Organize your personal schedule and track holidays in a luxury dark interface." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://roitx.dpdns.org/calendar.html" />
  <meta property="og:image" content="https://roitx.dpdns.org/calendar.png" />
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Roitx Calendar ",
  "url": "https://roitx.dpdns.org/calendar.html",
  "description": "Calendar for public holidays and observance.",
  "publisher": {
    "@type": "Organization",
    "name": "PM Roitx Study Hub",
    "logo": "https://roitx.dpdns.org/calendar.png"
  }
}
</script>

<link rel="icon" href="calendar.png" type="image/png">

  <script>try{var t=localStorage.getItem("roitx_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="calendar.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
<script src="activity-log.js"></script>
</head>
<body>

<header>
  <img src="calendar.png" alt="Roitx Calendar">
  <h1>Roitx — Calendar</h1>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="Light theme" aria-label="Light theme"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
    <button class="icon-btn header-export" id="exportBtn" onclick="confirmExport()" title="Export month" aria-label="Export month"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  </div>
</header>

<!-- HOLIDAY WISH BANNER -->
<div id="holidayWishBanner" class="holiday-wish-banner"></div>

<div class="container">
  <div>
    <!-- UPCOMING FESTIVALS STRIP -->
    <div id="festStrip" class="fest-strip"></div>

    <!-- CALENDAR HEADER -->
    <div class="cal-header">
      <div class="cal-title-row">
        <div class="cal-title" id="calTitle">Month Year</div>
        <div class="title-actions">
          <button class="icon-btn" id="viewBtn" title="Year view" aria-label="Year view"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
          <button class="cal-btn" id="todayBtn">Today</button>
        </div>
      </div>

      <div class="cal-nav">
        <button class="cal-btn" id="prevBtn" aria-label="Previous month"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="cal-btn" id="nextBtn" aria-label="Next month"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
        <input type="date" id="gotoDate" title="Go to date">
      </div>

      <div class="search-wrap">
        <span class="s-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="search" id="searchInput" placeholder="Search holidays or events…" autocomplete="off" aria-label="Search">
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>

    <!-- WEEKDAYS -->
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <!-- DAYS GRID -->
    <div class="days" id="daysGrid"></div>

    <!-- YEAR VIEW -->
    <div class="year-grid" id="yearGrid"></div>
  </div>

  <!-- SIDE PANEL -->
  <aside class="side">
    <div class="mini" id="eventFormSection">
      <h3 style="margin:0 0 8px 0; color:#3aa0ff;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Create Personal Event</h3>
      <input type="date" id="eventDate" class="event-input">
      <input type="text" id="eventName" class="event-input" placeholder="Event Name">
      <button class="cal-btn" onclick="addEvent()" style="width:100%; background:var(--accent); color:#fff;">Save Event</button>
      <div id="eventMsg" style="margin-top:6px; font-size:12px;"></div>
    </div>

    <div id="eventList"></div>

    <div class="mini" id="legendBox">
      <h4 style="margin:0 0 8px 0; color:#e9f5ff;">Legend</h4>
      <div class="legend">
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#3aa0ff"></span> Today</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#ffb703"></span> Sunday Off</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#ff4d4d"></span> Public Holiday</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#00f2fe"></span> Observance</div>
        <div style="display:flex;gap:8px;align-items:center"><span class="dot" style="background:#a48aff"></span> Personal Events</div>
      </div>    
    </div>

    <div class="mini">
      <a href="/" style="color:#9fcfff; text-decoration:none; display:inline-flex; align-items:center; gap:6px;"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to Home</a>
    </div>
  </aside>

  <!-- POPUP OVERLAY -->
  <div id="holidayPopup" class="popup-overlay">
    <div class="popup-box">
      <h3 id="popupTitle">Notification</h3>
      <p id="popupText" style="white-space: pre-line; line-height: 1.5; margin-top: 10px;"></p>
      <button id="popupButton" onclick="closePopup()">Close</button>
    </div>
  </div>
</div>

<script src="mini-state.js"></script>
<script src="calendar.js"></script>
</body>
</html>
