<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roitx Studio IDE v5.6</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="cfile.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="top-nav">
        <div class="brand-container">
            <span class="logo-text">ROITX LAB</span>
            <span class="version-tag">v5.6</span>
        </div>
        
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleFindReplaceModal()" title="Find & Replace"><i class="fas fa-search"></i></button>
            <button class="btn btn-primary" onclick="runManualCode()"><i class="fas fa-play"></i> Run</button>
            <button class="icon-btn" onclick="togglePreviewPanel()" title="Toggle Preview"><i class="fas fa-columns"></i></button>
            <button class="icon-btn" onclick="openPreviewFullscreen()" title="Fullscreen Preview"><i class="fas fa-expand"></i></button>
            <!-- Mode Changer Button Fixed -->
            <!-- Is line ko update karein -->
<button class="icon-btn mode-changer-btn" id="mode-toggle" onclick="toggleThemeMode()" title="Toggle Theme"><i class="fas fa-moon"></i></button>

        </div>
    </header>

    <!-- Main Workspace Grid -->
    <div class="workspace-grid">
        <!-- Editors Container -->
        <div class="editors-wrapper">
            <div class="editor-tabs-bar">
                <button class="tab-btn active" id="tabBtnHtml" onclick="switchEditorTab('html')">HTML</button>
                <button class="tab-btn" id="tabBtnCss" onclick="switchEditorTab('css')">CSS</button>
                <button class="tab-btn" id="tabBtnJs" onclick="switchEditorTab('js')">JS</button>
                <button class="tab-btn" id="tabBtnPy" onclick="switchEditorTab('py')">Python</button>
            </div>

            <div class="editors-container">
                <!-- HTML Panel -->
                <div class="editor-panel active" id="htmlPanel">
                    <div class="panel-header">
                        <span class="panel-title"><span class="file-icon html-icon">&lt;/&gt;</span> HTML</span>
                        <button class="mini-btn" onclick="clearEditor('html')">Clear</button>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="htmlLineNums">1</div>
                        <div class="code-area-wrapper">
                            <textarea id="htmlInput" spellcheck="false"></textarea>
                            <pre class="highlight-layer"><code id="htmlHighlight"></code></pre>
                        </div>
                    </div>
                </div>

                <!-- CSS Panel -->
                <div class="editor-panel" id="cssPanel">
                    <div class="panel-header">
                        <span class="panel-title"><span class="file-icon css-icon">#</span> CSS</span>
                        <button class="mini-btn" onclick="clearEditor('css')">Clear</button>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="cssLineNums">1</div>
                        <div class="code-area-wrapper">
                            <textarea id="cssInput" spellcheck="false"></textarea>
                            <pre class="highlight-layer"><code id="cssHighlight"></code></pre>
                        </div>
                    </div>
                </div>

                <!-- JS Panel -->
                <div class="editor-panel" id="jsPanel">
                    <div class="panel-header">
                        <span class="panel-title"><span class="file-icon js-icon">JS</span> JavaScript</span>
                        <button class="mini-btn" onclick="clearEditor('js')">Clear</button>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="jsLineNums">1</div>
                        <div class="code-area-wrapper">
                            <textarea id="jsInput" spellcheck="false"></textarea>
                            <pre class="highlight-layer"><code id="jsHighlight"></code></pre>
                        </div>
                    </div>
                </div>

                <!-- Python Panel -->
                <div class="editor-panel" id="pyPanel">
                    <div class="panel-header">
                        <span class="panel-title"><span class="file-icon py-icon">PY</span> Python</span>
                        <button class="mini-btn" onclick="clearEditor('py')">Clear</button>
                    </div>
                    <div class="editor-body">
                        <div class="line-numbers" id="pyLineNums">1</div>
                        <div class="code-area-wrapper">
                            <textarea id="pyInput" spellcheck="false"></textarea>
                            <pre class="highlight-layer"><code id="pyHighlight"></code></pre>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Custom Keyboard Shortcut Toolbar -->
            <div class="shortcut-bar">
                <button onclick="insertAtCursor('htmlInput', '&lt;div&gt;')">&lt;div&gt;</button>
                <button onclick="insertAtCursor('htmlInput', '&lt;p&gt;')">&lt;p&gt;</button>
                <button onclick="insertAtCursor('htmlInput', '&lt;h1&gt;')">&lt;h1&gt;</button>
                <button onclick="insertAtCursor('htmlInput', '&lt;button&gt;')">&lt;btn&gt;</button>
                <button onclick="insertAtCursor('htmlInput', '&lt;a href=&quot;&quot;&gt;')">&lt;a&gt;</button>
                <button onclick="insertAtCursor('htmlInput', 'class=&quot;&quot;')">class</button>
                <button onclick="insertAtCursor('htmlInput', 'id=&quot;&quot;')">id</button>
                <button onclick="insertAtCursor('htmlInput', '()')">()</button>
                <button onclick="insertAtCursor('htmlInput', '{}')">{}</button>
                <button onclick="insertAtCursor('htmlInput', '\"\"')">""</button>
                <button onclick="insertAtCursor('htmlInput', '=')">=</button>
                <button onclick="insertAtCursor('htmlInput', '/')">/</button>
            </div>
        </div>

        <!-- Output / Preview Container -->
        <div class="output-container">
            <div class="output-header">
                <div class="output-tabs">
                    <button class="output-tab active" id="btnPreviewTab" onclick="switchOutputTab('preview')"><i class="fas fa-eye"></i> Preview</button>
                    <button class="output-tab" id="btnConsoleTab" onclick="switchOutputTab('console')"><i class="fas fa-terminal"></i> Console <span class="badge" id="consoleBadge">0</span></button>
                </div>
                
                <div class="device-selector">
                    <button class="device-btn active" id="btnDeviceFull" onclick="setDeviceMode('full')"><i class="fas fa-desktop"></i></button>
                    <button class="device-btn" id="btnDeviceMobile" onclick="setDeviceMode('mobile')"><i class="fas fa-mobile-alt"></i></button>
                </div>
            </div>

            <!-- Live Preview Wrapper -->
            <div class="preview-wrapper" id="previewWrapper">
                <iframe id="liveFrame"></iframe>
            </div>

            <!-- Console Wrapper -->
            <div class="console-wrapper hidden" id="consoleWrapper">
                <div class="console-toolbar">
                    <span>Virtual Console Output</span>
                    <button class="mini-btn" onclick="consoleOutput.innerHTML=''; logCount=0; consoleBadge.innerText='0';">Clear Console</button>
                </div>
                <div class="console-output" id="consoleOutput"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Status Bar -->
    <footer class="bottom-bar">
        <span class="auto-save-indicator" id="autoSaveStatus">Auto-Saved</span>
        <span id="editorStats">Lines: 0 | Characters: 0</span>
    </footer>

    <!-- Find & Replace Modal -->
    <div id="findReplaceModal" class="hidden" style="position:fixed; top:70px; right:20px; background:var(--bg-panel); border:1px solid var(--border-color); padding:15px; border-radius:8px; z-index:1000; width:300px; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:bold; font-size:13px;">
            <span>Find & Replace</span>
            <button onclick="toggleFindReplaceModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fas fa-times"></i></button>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
            <div style="display:flex; gap:5px;">
                <input type="text" id="findInput" placeholder="Find..." oninput="handleSearchInput()" style="flex:1; background:var(--bg-input); border:1px solid var(--border-color); color:var(--text-main); padding:5px 8px; border-radius:4px; font-size:12px;">
                <span id="matchCounter" style="font-size:11px; color:var(--text-muted); display:flex; align-items:center;">0/0</span>
                <button onclick="navigateMatch(-1)" class="mini-btn"><i class="fas fa-chevron-up"></i></button>
                <button onclick="navigateMatch(1)" class="mini-btn"><i class="fas fa-chevron-down"></i></button>
            </div>
            <input type="text" id="replaceInput" placeholder="Replace with..." style="background:var(--bg-input); border:1px solid var(--border-color); color:var(--text-main); padding:5px 8px; border-radius:4px; font-size:12px;">
            <div style="display:flex; gap:5px; margin-top:5px;">
                <button class="btn" style="flex:1; padding:4px;" onclick="executeSingleReplace()">Replace</button>
                <button class="btn btn-primary" style="flex:1; padding:4px;" onclick="executeReplaceAll()">Replace All</button>
            </div>
        </div>
    </div>

    <!-- Script Engine -->
    <script src="cfile.js"></script>
</body>
</html>
