<style>
  /* Movable Floating Home Button Styling */
  .home-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c4dff, #3d5afe);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 18px rgba(61, 90, 254, 0.6), 0 6px 15px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 9999;
    touch-action: none; /* Smooth dragging on mobile */
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .home-btn:active {
    transform: scale(0.92);
  }

  .home-btn svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
  }

  /* ---- Responsive class cards & top bar (mobile + desktop) ---- */
  .container { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

  .topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .topbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar .brand img { flex-shrink: 0; }
  .topbar .brand h1 { font-size: clamp(18px, 5vw, 24px); line-height: 1.2; margin: 0; }
  .topbar .btn { min-height: 44px; padding-left: 18px; padding-right: 18px; touch-action: manipulation; }

  a.card {
    display: block;
    box-sizing: border-box;
    min-height: 88px;
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  a.card:active { transform: scale(0.97); }
  a.card:focus-visible { outline: 3px solid #3d5afe; outline-offset: 3px; }
  @media (hover: hover) { a.card:hover { transform: translateY(-4px); } }
  @media (min-width: 720px) { a.card { min-height: 120px; } }
  @media (prefers-reduced-motion: reduce) { a.card { transition: none; } a.card:hover, a.card:active { transform: none; } }

<!-- Draggable SVG Floating Home Button -->
<div id="movableHomeBtn" class="home-btn">
  <svg viewBox="0 0 24 24">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>

<script src="site.js"></script>

<script>
  // Draggable & Clickable Logic for Home Button
  const homeBtn = document.getElementById('movableHomeBtn');
  let isDragging = false;
  let hasDragged = false;
  let startX, startY, initialLeft, initialTop;

  // Touch Events (Mobile)
  homeBtn.addEventListener('touchstart', (e) => {
    isDragging = true;
    hasDragged = false;
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const touch = e.touches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    homeBtn.style.left = `${initialLeft + deltaX}px`;
    homeBtn.style.top = `${initialTop + deltaY}px`;
    homeBtn.style.bottom = 'auto';
    homeBtn.style.right = 'auto';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    isDragging = false;
  });

  // Mouse Events (Desktop)
  homeBtn.addEventListener('mousedown', (e) => {
    isDragging = true;
    hasDragged = false;
    startX = e.clientX;
    startY = e.clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    homeBtn.style.left = `${initialLeft + deltaX}px`;
    homeBtn.style.top = `${initialTop + deltaY}px`;
    homeBtn.style.bottom = 'auto';
    homeBtn.style.right = 'auto';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // Handle Click / Navigation
  homeBtn.addEventListener('click', (e) => {
    if (hasDragged) {
      e.preventDefault();
      return;
    }
    window.location.href = '/';
  });
</script>

</body>
