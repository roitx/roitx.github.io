<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classes — RK Notes</title>
<link rel="stylesheet" href="site.css">
<style>
  /* Movable Floating Home Button Styling */
  .home-btn {
    position: fixed;
    bottom: 25px;
    right: 25px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c4dff, #3d5afe);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 18px rgba(61, 90, 254, 0.6), 0 6px 15px rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 9999;
    touch-action: none; /* Smooth dragging on mobile */
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }

  .home-btn:active {
    transform: scale(0.92);
  }

  .home-btn svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: #ffffff;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
  }
</style>
</head>
<body>

<div class="container">
  <header class="topbar">
    <div class="brand"><img src="notes.png" alt="Rohit"><h1>Roitx - Notes</h1></div>
    <div><button class="btn" onclick="mailSupport()">Contact</button></div>
  </header>

  <h2>Choose Class</h2>
  <div class="grid">
    <div class="card" onclick="goto('subjects-9.html')">
      <h3>Class 9</h3><p>Important subjects for Class 9</p>
    </div>

    <div class="card" onclick="goto('subjects-10.html')">
      <h3>Class 10</h3><p>Important subjects for Class 10</p>
    </div>

    <div class="card" onclick="goto('subjects-11.html')">
      <h3>Class 11</h3><p>Science & other important subjects</p>
    </div>

    <div class="card" onclick="goto('subjects-12.html')">
      <h3>Class 12</h3><p>Board exam focused materials</p>
    </div>
  </div>
</div>

<!-- Draggable SVG Floating Home Button -->
<div id="movableHomeBtn" class="home-btn">
  <svg viewBox="0 0 24 24">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
    <polyline points="9 22 9 12 15 12 15 22"></polyline>
  </svg>
</div>

<script src="site.js"></script>

<script>
  // Draggable & Clickable Logic for Home Button
  const homeBtn = document.getElementById('movableHomeBtn');
  let isDragging = false;
  let hasDragged = false;
  let startX, startY, initialLeft, initialTop;

  // Touch Events (Mobile)
  homeBtn.addEventListener('touchstart', (e) => {
    isDragging = true;
    hasDragged = false;
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    const touch = e.touches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    homeBtn.style.left = `${initialLeft + deltaX}px`;
    homeBtn.style.top = `${initialTop + deltaY}px`;
    homeBtn.style.bottom = 'auto';
    homeBtn.style.right = 'auto';
  }, { passive: true });

  document.addEventListener('touchend', () => {
    isDragging = false;
  });

  // Mouse Events (Desktop)
  homeBtn.addEventListener('mousedown', (e) => {
    isDragging = true;
    hasDragged = false;
    startX = e.clientX;
    startY = e.clientY;
    
    const rect = homeBtn.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;
  });

  document.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - startX;
    const deltaY = e.clientY - startY;

    if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
      hasDragged = true;
    }

    homeBtn.style.left = `${initialLeft + deltaX}px`;
    homeBtn.style.top = `${initialTop + deltaY}px`;
    homeBtn.style.bottom = 'auto';
    homeBtn.style.right = 'auto';
  });

  document.addEventListener('mouseup', () => {
    isDragging = false;
  });

  // Handle Click / Navigation
  homeBtn.addEventListener('click', (e) => {
    if (hasDragged) {
      e.preventDefault();
      return;
    }
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
