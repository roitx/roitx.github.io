<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1b3d" />
  
  <!-- SEO & Advanced Meta Tags as Secondary Page -->
  <title>PYQ Complete Question Analysis - PM Roitx</title>
  <meta name="description" content="Explore comprehensive chapter-wise and year-wise PYQ analysis for Bihar Board Class 10 & 12 Science stream with Objective, Short, and Long questions breakdown." />
  <meta name="keywords" content="PM Roitx, PYQ Analyzer, Bihar Board, Class 12 Science, Brilliant Question Bank Pattern, Physics, Chemistry, Math, Biology" />
  <meta name="author" content="Rohit (PM Roitx)" />
  
  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="PYQ Complete Question Analysis - PM Roitx" />
  <meta property="og:description" content="Detailed year-wise question breakdown following Brilliant Question Bank pattern." />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="style.css" />
  
  <!-- KaTeX CSS & JS for Lightning Fast & Perfect Formula Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] });"></script>

  <style>
    :root {
      --primary-bg: #0a1b3d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-color: #00d2ff;
      --accent-gradient: linear-gradient(135deg, #00d2ff, #3a7bd5);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--primary-bg) !important;
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .analyzer-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px 16px;
      box-sizing: border-box;
    }

    /* Header & Branding */
    .topbar {
      background: rgba(10, 27, 61, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
    }
    .brand a {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
    }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Selectors & Search */
    .selector-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .select-box {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
      font-size: 14px;
      width: 100%;
      max-width: 320px;
    }
    .select-box option {
      background: #0a1b3d;
      color: #fff;
    }

    .subject-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-color) transparent;
    }
    .subject-selector::-webkit-scrollbar {
      height: 4px;
    }
    .subject-selector::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 4px;
    }

    .sub-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .sub-btn.active {
      background: var(--accent-gradient);
      border-color: var(--accent-color);
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
    }
    .search-box {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.07);
    }

    /* Chapter Cards */
    .chapter-trend-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    
    .chap-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 12px;
    }
    .chap-title h3 {
      margin: 0 0 4px 0;
      font-size: 17px;
      color: #fff;
      font-weight: 700;
      line-height: 1.4;
    }
    .chap-title p {
      margin: 0;
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .total-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.25);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      white-space: nowrap;
    }
    .total-badge svg {
      width: 14px;
      height: 14px;
      fill: var(--accent-color);
    }

    /* Info & Formula Boxes */
    .info-box {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(58, 160, 255, 0.06);
      border-left: 4px solid #3aa0ff;
      padding: 12px 14px;
      border-radius: 0 10px 10px 0;
      font-size: 13px;
      color: #cbd5e0;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .info-box svg {
      width: 16px;
      height: 16px;
      fill: var(--accent-color);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .info-box strong { color: var(--accent-color); }

    .formula-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      color: #ffb703;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .formula-box svg {
      width: 18px;
      height: 18px;
      fill: #ffb703;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .formula-content {
      width: 100%;
      overflow-x: auto;
    }

    /* Trend Table */
    .trend-table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .trend-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: center;
      min-width: 550px;
    }
    .trend-table th {
      background: rgba(255, 255, 255, 0.06);
      color: #3aa0ff;
      padding: 10px 6px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }
    .trend-table td {
      padding: 9px 6px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: #cbd5e0;
      white-space: nowrap;
    }
    .highlight-cell {
      color: var(--accent-color);
      font-weight: 700;
      background: rgba(0, 210, 255, 0.05);
    }

    /* Empty/Loading state */
    .state-msg {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .analyzer-container { padding: 12px 10px; }
      .chap-header { flex-direction: column; align-items: flex-start; }
      .total-badge { align-self: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="topbar">
    <div class="brand">
      <a href="index.html">
        <img src="1profile.jpg" alt="Logo" class="logo" />
        <div>
          <div class="brand-name">PYQ QUESTION ANALYZER</div>
          <div class="brand-sub">Brilliant Question Bank Pattern</div>
        </div>
      </a>
    </div>
  </header>

  <!-- Main Analyzer Container -->
  <main class="analyzer-container">
    <h2 style="font-size: 20px; margin-bottom: 6px;">Chapter-wise Year-wise Analysis (Obj, Short & Long)</h2>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Brilliant Question Bank ki tarah har saal ke Objective, Short aur Long questions ka complete breakdown.</p>

    <!-- Class Selector Dropdown -->
    <div class="selector-row">
      <select id="classSelect" class="select-box" onchange="changeClass()">
        <option value="class-12">Class 12 (Science Stream)</option>
        <option value="class-10">Class 10 (Secondary)</option>
      </select>
    </div>

    <!-- Subject Selector Buttons -->
    <div class="subject-selector" id="subjectButtons"></div>

    <!-- Search Input with SVG Icon -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" class="search-box" placeholder="Chapter ya topic search karein..." oninput="filterChapters()" />
    </div>

    <!-- Dynamic Chapters Container -->
    <div id="chaptersContainer"></div>
  </main>

  <script src="pyq-database.js"></script>
  <script>
    let currentClass = 'class-12';
    let currentSubject = 'physics';

    function changeClass() {
      currentClass = document.getElementById('classSelect').value;
      if (!pmRoitxDatabase[currentClass]) return;
      const streamKey = Object.keys(pmRoitxDatabase[currentClass])[0];
      const subjects = Object.keys(pmRoitxDatabase[currentClass][streamKey]);
      currentSubject = subjects[0];
      renderSubjectButtons();
      renderChapters();
    }

    function renderSubjectButtons() {
      if (!pmRoitxDatabase[currentClass]) return;
      const streamKey = Object.keys(pmRoitxDatabase[currentClass])[0];
      const subjects = Object.keys(pmRoitxDatabase[currentClass][streamKey]);
      const container = document.getElementById('subjectButtons');
      
      container.innerHTML = subjects.map(sub => {
        const activeClass = sub === currentSubject ? 'active' : '';
        const formattedName = sub.charAt(0).toUpperCase() + sub.slice(1);
        return `<button class="sub-btn ${activeClass}" onclick="switchSubject('${sub}')">${formattedName}</button>`;
      }).join('');
    }

    function switchSubject(sub) {
      currentSubject = sub;
      renderSubjectButtons();
      document.getElementById('searchInput').value = '';
      renderChapters();
    }

    function renderChapters() {
      const container = document.getElementById('chaptersContainer');
      const streamKey = Object.keys(pmRoitxDatabase[currentClass])[0];

      if (!pmRoitxDatabase[currentClass][streamKey][currentSubject]) {
        container.innerHTML = `<div class="state-msg">Data available nahi hai.</div>`;
        return;
      }

      const dataList = pmRoitxDatabase[currentClass][streamKey][currentSubject];
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = dataList.filter(c => c.chapter.toLowerCase().includes(query) || c.importantTopics.toLowerCase().includes(query));

      if (!filtered || filtered.length === 0) {
        container.innerHTML = `<div class="state-msg">Koi chapter nahi mila.</div>`;
        return;
      }

      container.innerHTML = filtered.map(chap => `
        <div class="chapter-trend-card">
          <div class="chap-header">
            <div class="chap-title">
              <h3>${chap.chapter}</h3>
              <p>Year-wise Question Analysis (Objective, Short & Long)</p>
            </div>
            <div class="total-badge">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
              Total PYQs: ${chap.totalPyqs}
            </div>
          </div>

          <div class="info-box">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            <div><strong>Important Topics:</strong> ${chap.importantTopics}</div>
          </div>

                    <div class="formula-box">
            <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
            <div class="formula-content"><strong>Key Formula / Concept:</strong> $${chap.formula}$$</div>
          </div>


          <div class="trend-table-wrapper">
            <table class="trend-table">
              <thead>
                <tr>
                  <th>Exam Year</th>
                  <th colspan="3">2026</th>
                  <th colspan="3">2025</th>
                  <th colspan="3">2024</th>
                  <th colspan="3">2023</th>
                  <th colspan="3">2022</th>
                </tr>
                <tr>
                  <th>Type</th>
                  <th>Obj</th><th>Sh</th><th>Lg</th>
                  <th>Obj</th><th>Sh</th><th>Lg</th>
                  <th>Obj</th><th>Sh</th><th>Lg</th>
                  <th>Obj</th><th>Sh</th><th>Lg</th>
                  <th>Obj</th><th>Sh</th><th>Lg</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td style="font-weight:700; color:#3aa0ff;">Questions</td>
                  <td class="highlight-cell">${chap.years["2026"].obj}</td><td>${chap.years["2026"].short}</td><td>${chap.years["2026"].long}</td>
                  <td class="highlight-cell">${chap.years["2025"].obj}</td><td>${chap.years["2025"].short}</td><td>${chap.years["2025"].long}</td>
                  <td>${chap.years["2024"].obj}</td><td>${chap.years["2024"].short}</td><td>${chap.years["2024"].long}</td>
                  <td>${chap.years["2023"].obj}</td><td>${chap.years["2023"].short}</td><td>${chap.years["2023"].long}</td>
                  <td>${chap.years["2022"].obj}</td><td>${chap.years["2022"].short}</td><td>${chap.years["2022"].long}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `).join('');

      // Trigger KaTeX to render formulas dynamically after content update
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ]
        });
      }
    }

    function filterChapters() {
      renderChapters();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSubjectButtons();
      renderChapters();
    });
  </script>
</body>
</html>
