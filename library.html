<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Activity Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 40px; display: flex; justify-content: center; }

        /* Widget Container */
        .activity-widget {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .widget-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .widget-title span {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: normal;
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s;
        }

        .activity-item:hover {
            border-color: var(--accent-color);
        }

        .file-info b {
            display: block;
            font-size: 14px;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .file-info span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Status Badges */
        .badges-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge.downloaded {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge.not-downloaded {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--warning-color);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .empty {
            color: var(--text-secondary);
            text-align: center;
            font-style: italic;
            padding: 20px;
        }

        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="activity-widget">
        <div class="widget-title">
            Recent Activity <span>Tracked Files</span>
        </div>
        
        <div id="recentList" class="activity-list"></div>

        <div class="actions">
            <button onclick="simulateViewFile('Design_Asset.png', false)">Simulate View (Not Downloaded)</button>
            <button onclick="simulateViewFile('Project_Report.pdf', true)">Simulate View & Download</button>
        </div>
    </div>

    <!-- External Library File -->
    <script src="library.js"></script>
</body>
</html>
