<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Activity Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; }

        .activity-widget {
            width: 100%;
            max-width: 600px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .widget-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-btn {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            gap: 12px;
            transition: border-color 0.2s;
        }

        .activity-item:hover {
            border-color: var(--accent-color);
        }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .title-row {
            display: flex;
            align-items: center; 
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .file-info a {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
            white-space: normal; 
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            line-height: 1.4;
            flex: 1;
        }

        .file-info a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .file-info span {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .info-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .info-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .access-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .access-tag svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .access-tag.purchased { color: #10b981; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); }
        .access-tag.locked { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.3); }
        .access-tag.free { color: #3b82f6; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); }

        /* Badge Group Alignments Fix */
        .badges-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            min-width: 100px;
        }

        .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 12px;
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
            display: inline-block;
        }

        .badge.downloaded { background-color: rgba(16, 185, 129, 0.15); color: var(--success-color); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.not-downloaded { background-color: rgba(245, 158, 11, 0.15); color: var(--warning-color); border: 1px solid rgba(245, 158, 11, 0.3); }

        .view-btn {
            font-size: 11px;
            color: var(--accent-color);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            white-space: nowrap;
        }

        .empty {
            color: var(--text-secondary);
            text-align: center;
            font-style: italic;
            padding: 20px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
            padding: 20px;
        }
        .modal-card {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            width: 100%; max-width: 400px; border-radius: 14px; padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); animation: scaleIn 0.2s ease;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-header {
            font-size: 16px; font-weight: 600; margin-bottom: 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 8px;
        }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; }
        .modal-body { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
        .modal-row { display: flex; justify-content: space-between; background: var(--card-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); }
        .modal-row span:last-child { font-weight: 600; color: var(--text-color); }
    </style>
</head>
<body>

    <div class="activity-widget">
        <div class="widget-title">
            Recent Activity 
            <button id="filterToggle" class="filter-btn" onclick="toggleFilter()">✨ Downloaded Only</button>
        </div>
        
        <div id="recentList" class="activity-list"></div>
    </div>

    <!-- Details Popup Modal -->
    <div id="infoModal" class="modal-overlay" onclick="closeInfoModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>File Details</span>
                <button class="modal-close" onclick="closeInfoModal(event)">&times;</button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- Dynamic Content Will Load Here -->
            </div>
        </div>
    </div>

    <script src="library.js"></script>
</body>
</html>
