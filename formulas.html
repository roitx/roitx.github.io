<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 Formula Viewer</title>

<link rel="stylesheet" href="formulas.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script defer src="formulas.js"></script>

<style>
/* Search Bar & Dynamic Filter Grid Layout */
.search-container {
    margin-bottom: 12px;
}

.search-input {
    width: 100%;
    padding: 12px 15px;
    background: #111622;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    border-radius: 8px;
    font-size: 0.95rem;
    box-sizing: border-box;
    outline: none;
}

.search-input:focus {
    border-color: #00d2ff;
}

.filters {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

@media (min-width: 600px) {
    .filters {
        grid-template-columns: repeat(4, 1fr);
    }
}

.filters select {
    width: 100%;
    padding: 12px;
    background: #111622;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    border-radius: 8px;
    font-size: 0.9rem;
    box-sizing: border-box;
    outline: none;
    text-align: center;
    cursor: pointer;
}

.filters select:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>
</head>

<body>

<header class="topbar">
  <h2>📐 Formula Viewer</h2>
  <a href="index.html" class="back">⬅ Home</a>
</header>

<main>

<!-- LIVE SEARCH BAR -->
<div class="search-container">
  <input type="text" id="fSearch" class="search-input" placeholder="🔍 Search formula, topic, or chapter name..." oninput="handleSearchInput()">
</div>

<!-- CASCADING FLOW FILTERS -->
<section class="filters">
  <select id="fClass" onchange="onClassChange()">
    <option value="">All Classes</option>
  </select>

  <select id="fSubject" onchange="onSubjectChange()" disabled>
    <option value="">All Subjects</option>
  </select>

  <select id="fChapter" onchange="onChapterChange()" disabled>
    <option value="">All Chapters</option>
  </select>

  <select id="fCategory" onchange="loadFormulas()" disabled>
    <option value="">All Categories</option>
  </select>
</section>

<!-- FORMULA LIST -->
<section class="formula-list" id="formulaList">
  ⏳ Loading formulas...
</section>

</main>

<!-- LIGHTWEIGHT TEXT FORMULA VIEWER MODAL -->
<div id="textViewerModal" class="text-modal-overlay" onclick="closeTextViewer()">
  <div class="text-modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>📝 Formula View</span>
      <button onclick="closeTextViewer()">✖</button>
    </div>
    <div id="modalTextContent" class="modal-body"></div>
  </div>
</div>

</body>
</html>
