<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📐 Formula Viewer</title>

<link rel="stylesheet" href="formulas.css">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script defer src="formulas.js"></script>

<style>
/* 🌟 Uniform Grid Styling for Filters and Search Button */
.filters {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

@media (min-width: 600px) {
    .filters {
        grid-template-columns: repeat(5, 1fr); /* 4 Dropdowns + 1 Search Button */
    }
}

.filters select, 
.filters button {
    width: 100%;
    padding: 12px;
    background: #111622;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    border-radius: 8px;
    font-size: 0.9rem;
    box-sizing: border-box;
    outline: none;
    text-align: center;
}

.filters button {
    background: linear-gradient(135deg, #00d2ff, #0072ff);
    font-weight: bold;
    cursor: pointer;
    grid-column: span 2; /* मोबाइल स्क्रीन पर सर्च बटन पूरी चौड़ाई लेगा */
    transition: 0.2s ease;
}

.filters button:active {
    transform: scale(0.97);
}

@media (min-width: 600px) {
    .filters button {
        grid-column: span 1;
    }
}
</style>
</head>

<body>

<header class="topbar">
  <h2>📐 Formula Viewer</h2>
  <a href="index.html" class="back">⬅ Home</a>
</header>

<main>

<!-- FILTERS -->
<section class="filters">
  <select id="fClass">
    <option value="">Class</option>
    <option value="9">Class 9</option>
    <option value="10">Class 10</option>
    <option value="11">Class 11</option>
    <option value="12">Class 12</option>
  </select>

  <select id="fSubject">
    <option value="">Subject</option>
    <option value="physics">Physics</option>
    <option value="chemistry">Chemistry</option>
    <option value="maths">Maths</option>
    <option value="biology">Biology</option>
  </select>

  <select id="fChapter">
    <option value="">Chapter</option>
    <option value="ch1">Chapter 1</option>
    <option value="ch2">Chapter 2</option>
    <option value="ch3">Chapter 3</option>
    <option value="ch4">Chapter 4</option>
    <option value="ch5">Chapter 5</option>
  </select>

  <!-- 🌟 Updated Category Dropdown ID (Matching with JS: fCategory) -->
  <select id="fCategory">
    <option value="">Category</option>
    <option value="mind_map">Mind Map</option>
    <option value="short_notes">Short Notes</option>
    <option value="other">Other</option>
  </select>

  <button onclick="loadFormulas()">🔍 Search</button>
</section>

<!-- FORMULA LIST -->
<section class="formula-list" id="formulaList">
  ⏳ Loading formulas...
</section>

</main>

<!-- LIGHTWEIGHT TEXT FORMULA VIEWER MODAL -->
<div id="textViewerModal" class="text-modal-overlay" onclick="closeTextViewer()">
  <div class="text-modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>📝 Formula View</span>
      <button onclick="closeTextViewer()">✖</button>
    </div>
    <div id="modalTextContent" class="modal-body"></div>
  </div>
</div>

</body>
</html>
