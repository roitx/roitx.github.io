<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Roitx - AI JS Generator</title>
  
  <!-- Favicon & Icons -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/profile.png" type="image/png" />
  <link rel="apple-touch-icon" href="/profile.jpg" />

  <style>
    :root {
      --bg-deep: #071124;
      --bg-card: rgba(25, 43, 80, 0.7);
      --accent-cyan: #00d2ff;
      --accent-blue: #3a7bd5;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --glow: rgba(0, 210, 255, 0.25);
    }
    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 0%, #112244 0%, var(--bg-deep) 80%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }
    .container { width: 100%; max-width: 750px; margin-top: 10px; }
    .header-brand { text-align: center; margin-bottom: 20px; }
    .header-brand h1 { margin: 0 0 5px 0; font-size: 26px; background: linear-gradient(135deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; }
    .header-brand p { margin: 0; font-size: 13px; color: var(--text-sub); }
    
    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 30px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      margin-bottom: 20px;
      position: relative;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      background: rgba(0, 210, 255, 0.1);
      padding: 6px 14px;
      border-radius: 10px;
      border: 1px solid rgba(0, 210, 255, 0.2);
      transition: 0.2s;
    }
    .back-link:hover { background: rgba(0, 210, 255, 0.2); }
    
    label { display: block; font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; margin-top: 18px; }
    label:first-of-type { margin-top: 0; }
    
    select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: #0a1b3d;
      border: 1px solid rgba(0, 210, 255, 0.3);
      color: #fff;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      transition: 0.3s;
    }
    select:focus, textarea:focus { border-color: var(--accent-cyan); box-shadow: 0 0 12px var(--glow); }
    textarea { resize: vertical; font-family: monospace; font-size: 12px; }
    
    button.submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #071124;
      font-weight: 900;
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      margin-top: 25px;
      border: none;
      font-size: 15px;
      box-shadow: 0 8px 25px var(--glow);
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button.submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px var(--glow); }
    
    .footer-promo { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-sub); }
    .footer-promo a { color: var(--text-sub); text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-brand">
      <h1>PM ROITX JS GENERATOR</h1>
      <p>Instant Client-Side Database Builder</p>
    </div>

    <div class="card">
      <a href="index.html" class="back-link">
        <svg style="width:16px; height:16px; fill:currentColor;" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back to Dashboard
      </a>

      <form id="genForm" onsubmit="generateJSFile(event)">
        <label>Kaksha (Class & Stream):</label>
        <select id="class_folder" required>
          <option value="12-science">Class 12 - Science</option>
          <option value="12-arts">Class 12 - Arts</option>
          <option value="10-science">Class 10 - Science (Matric)</option>
        </select>

        <label>Subject Chunein:</label>
        <select id="subject_name" required>
          <option value="physics">Physics (भौतिकी)</option>
          <option value="chemistry">Chemistry (रसायनशास्त्र)</option>
          <option value="math">Mathematics (गणित)</option>
          <option value="biology">Biology (जीवविज्ञान)</option>
          <option value="history">History (इतिहास)</option>
          <option value="political-science">Political Science (राजनीति शास्त्र)</option>
          <option value="geography">Geography (भूगोल)</option>
          <option value="economics">Economics (अर्थशास्त्र)</option>
          <option value="science">Science (विज्ञान - Class 10)</option>
          <option value="social-science">Social Science (सामाजिक विज्ञान)</option>
          <option value="hindi">Hindi (हिंदी)</option>
          <option value="english">English (अंग्रेज़ी)</option>
          <option value="sanskrit">Sanskrit (संस्कृत)</option>
        </select>

        <label>AI Extracted JSON Data Paste Karein:</label>
        <textarea id="json_input" rows="8" placeholder='[
  {
    "chapter": "1. Solid State",
    "totalPyqs": 42,
    "years": { "2024": { "obj": "03", "short": "01", "long": "00" } },
    "importantTopics": "Defects",
    "formula": "d = ZM / a^3 N_A"
  }
]' required></textarea>

        <button type="submit" class="submit-btn">
          <svg style="width:20px; height:20px; fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Download `.js` File Instantly
        </button>
      </form>
    </div>

    <div class="footer-promo">
      Designed with passion by Rohit | Official Portal: <a href="https://roitx.xo.je" target="_blank">roitx.xo.je</a>
    </div>
  </div>

  <script>
    function generateJSFile(event) {
      event.preventDefault();
      
      const classVal = document.getElementById('class_folder').value;
      const subjectVal = document.getElementById('subject_name').value;
      const rawText = document.getElementById('json_input').value.trim();

      try {
        const parsedData = JSON.parse(rawText);

        const prefix = (classVal === '10-science') ? '10s' : ((classVal === '12-science') ? '12s' : '12a');
        const varName = "class" + classVal.replace(/-/g, "") + subjectVal.charAt(0).toUpperCase() + subjectVal.slice(1);
        const fileName = prefix + subjectVal.toLowerCase() + ".js";

        const fileContent = `const ${varName} = ${JSON.stringify(parsedData, null, 2)};`;

        const blob = new Blob([fileContent], { type: 'text/javascript;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

      } catch (err) {
        alert("Invalid JSON Format! Kripya sahi JSON format paste karein.\n\nError: " + err.message);
      }
    }
  </script>

</body>
</html>
